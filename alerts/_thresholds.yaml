# Alert thresholds — Phase 2 (client_errors_spike tuned 2026-06-06).
#
# Phase 1 (2026-05-28) shipped DELIBERATELY LOW placeholders so alerts fired
# during the baseline week. Phase 2 re-tunes client_errors_spike from the
# observed baseline (see docs/audit/2026-06-03-alert-baseline.md):
#   - the count now EXCLUDES benign telemetry breadcrumbs (error_code 'event'/
#     'info'), which were ~81.5% of client_errors rows and inflated every spike;
#   - EXCEPT failure-shaped op_types (*_failed, widget_error_fallback, ...) which
#     ARE re-included — logEvent stamps error_code='event' even for failures, so
#     filtering on error_code alone would hide them (087, diagnose f0b9d3);
#   - thresholds raised to the founder-chosen "Tolerant" tier (real-error
#     baseline p95=127/hr, max=161) so a reinstall/restore burst (~150) lands
#     at info, not critical.
# edge_function_health + payment_flow_health stay on Phase-1 placeholders until
# those subsystems have their own baseline.
#
# Owner: founder. Tuning is a deliberate scheduled action, not a
# reactive twiddle.
#
# Source of truth: this file is documentation. The actual thresholds are
# embedded in the SQL of the cron jobs — client_errors_spike is now defined by
# supabase/migrations/087_alert_spike_reinclude_failure_events.sql (076→086→087).
# Any change here MUST be paired with a follow-up migration that re-schedules
# the cron body (cron.unschedule + cron.schedule) in the same commit. The pair
# is pinned by test/contracts/alert_thresholds_sync_test.dart.
# See feedback_migration_apply_record_pair.md.

phase: 2
ships_date: 2026-05-28
phase_2_date: 2026-06-06
tuning_method: "p95 + 50% headroom from baseline week's data (breadcrumbs excluded)"

thresholds:

  client_errors_spike:
    description: "REAL client_errors within a 1-hour window — non-breadcrumb error_codes PLUS failure-shaped op_types"
    excludes_error_codes: [event, info]   # benign telemetry breadcrumbs (~81.5% of rows)
    reincludes_failure_op_types: true     # logEvent stamps error_code='event' on genuine failures too, so failure-shaped op_types (*_failed, widget_error_fallback, *_returned_null) are re-included by regex (087, diagnose f0b9d3)
    info_at:     100   # /hour
    warn_at:     250
    critical_at: 500
    window_minutes: 60
    cron_cadence:   "*/15 * * * *"
    dedup_window_hours: 1
    tuned_from: docs/audit/2026-06-03-alert-baseline.md
    defined_in_migration: "087_alert_spike_reinclude_failure_events.sql"

  edge_function_health:
    description: "non-2xx response rate across cron_call_log over 30min"
    info_at:     0.05  # 5%
    warn_at:     0.10
    critical_at: 0.20
    window_minutes:    30
    min_call_count:    5    # don't fire on a single-call denominator
    cron_cadence:      "*/15 * * * *"
    dedup_window_hours: 1

  payment_flow_health:
    description: "subscriptions success rate over 24h"
    info_at:     0.99  # below this is info
    warn_at:     0.99
    critical_at: 0.95
    window_hours:      24
    min_attempt_count: 3
    cron_cadence:      "7 * * * *"
    dedup_window_hours: 6

# Notes on suppression / acknowledgement
# --------------------------------------
# Every cron job dedup-checks for an unacknowledged alert from the same
# source within `dedup_window_hours` before inserting. This prevents
# alert storms.
#
# Founder acknowledges via natural-language triage on session start
# (the SessionStart hook surfaces unacknowledged alerts). Agent
# updates the row via service-role MCP call:
#   UPDATE alerts SET acknowledged=true, acknowledged_at=now() WHERE id=...
