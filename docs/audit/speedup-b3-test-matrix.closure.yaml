  - id: U7-10
    title: "Abort condition (3): a PR run and a main run in flight together queue no worse than today"
    terminal_state: upstream_blocked
    blocker: >
      The condition needs a PR run and a main run in flight at the same time, and none overlapped the first PR run (no main run was in flight), so the pair cannot be
