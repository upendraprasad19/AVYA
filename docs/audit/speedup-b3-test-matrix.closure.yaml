      all, under the 20 concurrent jobs GitHub allows a free account; before this batch the pair held 5 + 7 = 12.
    reopen_when: >
      The first time a PR run and a main run are in flight together after this batch merges: run the measurement script on both and compare each job's started_at
      minus its run's created_at. Any job queued for more than a minute reverts the batch or lowers the matrix size.

