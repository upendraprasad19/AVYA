# round 2), and the local gate loop.
#
# `commit:` on a closed_in_commit row names the batch's single code commit: the commit
# that ADDS this file. A commit cannot name its own SHA; find it with
#   git log --diff-filter=A --format=%h -- docs/audit/progress-screen-pro-gate.closure.yaml
# (the merge to main is a --no-ff merge commit; the code commit is its second parent's tip).

