  - id: C6
    title: "delete the repository's now-nearly-unreachable free branch (2/day, 2048/85)?"
    terminal_state: blocked_on_user
    reason: >
      Reachable only if PRO lapses between the Add button's gate and capture()'s own isPro() read. It is also the
      client half of the quota message a free user would see. Deleting it is a product call; the recommendation is to
      keep it until C5 exists. Nothing tests the repository's caps or image tiers: F40
      (test/contracts/audit_2026_06_07_batch5_regression_test.dart) checks only that the screen's source handles
      PhotoQuotaException and calls showPaywallSheet (the progress_photo_quota_test.dart that older docs cited was never
      written). So deleting the branch would turn no test red: a reason to decide it deliberately, not a protection.

  - id: C7
    title: "should a lapsed user still VIEW and DELETE old progress photos in the app?"
    terminal_state: blocked_on_user
    reason: >
      Entry is blocked at both locks (the hub row already did this before this batch: the old Profile row gated the
      same way), so the only in-app way to remove a lapsed user's progress photos is Delete Account (a DPDP point).
      docs/architecture/subscription.md says a downgrade is a soft lock, read-only on PRO content; for these photos
      that was never implemented in the app. If the founder wants view and delete for a lapsed user, the entry gate
      becomes a write-only gate: a product decision with a user-visible effect. Once the screen is open, viewing and the
      long-press delete are not gated again (only entry and Add run the gate), so a user whose subscription lapses while the
      screen stays open keeps viewing and deleting until the next Add tap.

