      rule on the progress_photos RLS or the bucket), which is row C5 of that ledger, blocked_on_user.
    history: >
      Until 2026-10-05 this row was blocked_on_user, with this reason. A product decision with a user-visible effect,
      pre-existing and unchanged by this batch. Facts from the repo
      (not a live read): progress_photos_screen.dart has no gate, only quota handling; ProgressPhotoRepository caps
      free users at 2 photos/day and PRO at 5/day (progress_photo_repository.dart:45-46) and its quota message
      offers "Upgrade to PRO" to a free user; the progress_photos table RLS policies (migration 022, hardened by 055
      and 100) are own-row only with no PRO test; the progress-photos STORAGE bucket policies are not in the repo's
      migrations (only its size cap, migration 070), so "a free web user who types #/profile/progress-photos
      reaches a working screen" is proven for listing and inferred for upload. Decision needed from the founder:
      is the free 2/day allowance intended free-tier behavior (then the Profile row's PRO gate is the odd one
      out), or must the screen / route enforce PRO? Either answer is a real change; neither is a deferral.
      B-pass reviewer B (B1) showed what this costs until it is answered: any second way into the screen skips
      the PRO gate. Compensating controls are in this commit (plan D14): a FREE tap sweep, one mention of the
      screen in the hub under any spelling, no spelling of either destination in the Profile source, and a
      lib/ allow-list scan. They are not a substitute: if the screen or route enforces PRO itself none is needed.

