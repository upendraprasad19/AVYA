    blocker: "db-max-rows is a platform setting (measured 1000 on 2026-10-06) that the client never reads, so no test can DETECT a lowered cap; the test only DOCUMENTS the assumption by modelling a lower cap in the stub. Stopping on an EMPTY page (as the Edge Function's paged_fetch.ts does) was weighed and not adopted: it costs one extra request on every read of the fallback path (about eleven) and would loop to the 50,000-row ceiling on any stub that answers a table with the same non-empty rows whatever the offset (no existing test does that to a _fetchAllRows table today). The pre-existing assumption is not introduced by this slice."
    reopen_when: "The project's max-rows setting is lowered below 1000, or a restore_op_done / client_errors row shows a legacy-restore table whose row count equals a cap below 1000. The cap-independent alternative (Prefer: count=exact answers 206 with the total in Content-Range, documented in supabase/functions/_shared/paged_fetch.ts) needs no extra request."

