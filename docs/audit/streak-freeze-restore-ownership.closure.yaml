    terminal_state: closed_in_commit
    commit: "git log --grep='closes-diagnose: b4e7a1' (Slice A commit)"
    verification: "diagnose b4e7a1 proposed_fix 7; healAfterRestoreWhenSucceeded (heal_after_restore.dart) is attached by _onContinueAnyway after navigating, only with the Hive session open; T12 (success heals once, failed / cancelled / null / throwing never heal, a pending future waits, attach-after-go presence pin); mutations MB6 (attach removed) 1 red, MB7 (heal ignores the result) 1 red."

