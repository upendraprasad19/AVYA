    terminal_state: closed_in_commit
    commit: "git log --grep='closes-diagnose: b4e7a1' (Slice A commit)"
    verification: "RestoreFailureCollector.clear() empties the active zone sink only; the restore calls it on the single-call fault branch before the legacy Step A; T1 (clear() empties only its own zone and is a no-op outside one) and a T9 presence pin; mutations MB5a (call removed) 1 red, MB5b (clear neutered) 1 red. A behavioral drive of a faulting single-call apply is not reachable under SyncHarness (no session), so the call-site ordering is a presence pin and the effect is a unit test."

