    terminal_state: verified_clean
    notes: "A DESIGNED, DISCLOSED trade-off, not a closed defect, so it is not filed as closed_in_commit: persisting a debit against possibly incomplete schedule rows is the bug this batch removes, and the plan disclosed the liveness cost up front (plan header, 'Liveness, stated up front'). Pinned (T7b a 500 on scheduled_workouts withholds, T4b withheld still bumps the tick) and made diagnosable (the failing op is named in client_errors by _reportSyncFailure; one best-effort LOW streak_reckon_withheld event carries the reason). The state verified_clean is used here as a recorded decision with evidence, not as 'no defect'."

  - id: B1-GHOST-LOOKUP
    title: "B-pass reviewer B F1 (P2): PlanIntegrityReconciler.reconcile writes schedule_* rows AFTER the marker settled and outside any collector, through a ghost-day lookup that failed EMPTY, so a failed lookup resurrected a deleted template's day as a past planned row that the next reckon debited for good (boot, foreground and background-heal callers alike)"
