# Source of the item list: docs/plans/streak-freeze-restore-ownership.md section 3 "Terminal states"
# (founder report 2026-10-06: Home shows streak 16 with 2 freezes on account upendra), plus every
# finding of the ≥platform B-pass (three context-blind reviewers: Unit 1 code, Unit 2 code, docs/claims),
# each verified against the code before it was entered here.
#
# `commit:` values are a SHA-free recipe (`git log --grep`) because a commit cannot name its own SHA; both
# units landed in ONE commit (Slice A: they share six files, the B-pass reviewed them together, and the
# mutation proofs ran against the combined tree). OI-318 and OI-319 were minted at that commit. No push,
# build or live production write has been made; every item that needs one is blocked_on_user or says so.
# The four founder-owed items (RESIDUAL-EF-CAPS, F8, LAST-WORKOUT-DATE, WEEKS-PUSH-RPC) were DECIDED by the
# founder on 2026-10-06; their code lands in LATER commits of this same batch (slices B1, U6, C1, C2 of
# docs/plans/streak-freeze-restore-ownership-addendum-a.md) and each is closed_in_commit when its slice lands.
# Until then they stay blocked_on_user because each still waits on a per-action founder go (a live apply or
# deploy, CLAUDE.md 4.3) or on the founder approving exact copy.
#
# bpass_review points at the staged B-pass review. plan_review_record is NOT cited here: the record lands in its own
# later commit (docs/plan-reviews/ is not hash-excluded), and pointing at a file before it exists is the anti-pattern
# docs/audit/unitb-deload-reason.closure.yaml finding B3 warns against.

