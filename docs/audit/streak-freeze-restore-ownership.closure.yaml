    commit: "git log --grep='closes-diagnose: b4e7a1' (Slice A commit)"
    verification: "diagnose b4e7a1 proposed_fix 6; the lookup is tri-state (_deletedTemplateCloudIdsOrNull, null = could not answer) and reconcile routes its bundle through filterGhostScheduleEntries, which skips every tmpl_<uuid> day on null; test/contracts/streak_reckon_restore_settled_behavioral_test.dart T5 (null on a 500, {} / the id on an answered read, the restore-side wrapper still fails empty) and T11 (null skips template days and keeps the plain one, {} keeps all, an answered set drops exactly the ghost, one lookup and none for a legacy key, reconcile routes through it); mutations MB1 (null treated as empty) 1 red, MB2 (forwarder back to fail-empty) 1 red."

