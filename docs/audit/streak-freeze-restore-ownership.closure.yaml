  # ── Verified clean / recorded decision ──
  - id: F4
    title: "2026-09-26 first-PRO grant 0 to 3 then before=1 at the 18:42 consume (earlier 'lost grant' hypothesis)"
    terminal_state: verified_clean
    evidence: "Retracted as a defect hypothesis. 6 subscriptions rows since 2026-05-05; migration 095 (applied 2026-06-18 15:35 IST, backups/applied_migrations.json) backfills the flag for every user with any subscription row; the 09-14 23:08:32 subscription_state_written isPro=true produced no grant event; the 09-26 grant fired mid account swap with an empty local progress box. WHICH merge undid the 3 is UNVERIFIED (the plan says so too); the 3 to 1 outcome is consistent with the by-design same-week LOWER rule, pinned by a mirror row in Group A (phantom local {3, flag true} against cloud {1, flag true} gives 1)."

  - id: FOUNDER-LEDGER-ONE-SHORT
    title: "The founder's own freeze ledger is one freeze short (the 2026-09-17 spurious debit)"
    terminal_state: verified_clean
    notes: "A RECORDED FOUNDER DECISION, not 'no defect': the ledger IS one freeze short (re-derived against the schedule: without the 09-16 spurious debit the account would hold 3 at the 10-06 refill and 1 after the two debits, not 0). Founder decision 2026-10-06 in chat after the repair (a production UPDATE needing a cloud-row AND phone-local write) was explained: no issues, leave it like that. No production write was made or is owed; the weekly +1 refill (the 10-06 log shows before=1 after=2) is the only thing that closes the gap. Recorded here so the shortfall is a decision, not an omission."

  # ── Blocked on an external cause ──
  - id: F6
    title: "A 127 s restore on the morning of 2026-10-06 (restore_completed total_ms=127281; per-op restore_op_done 9-41 s, two 45 s ceilings)"
    terminal_state: upstream_blocked
    blocker: "Network-or-backend latency in that window, EXTERNAL to this repo and not separable from it: the evidence is device-measured per-op durations from client_errors, the phone's network and Supabase cannot be told apart afterwards, and get_advisors reports current state, not 06:45 IST. The same restore's single-call data ops took 0-355 ms. Tracked as OI-318 (OI-279 is pull-on-resume, not latency)."
    reopen_when: "A restore longer than 60 s recurs AND query_logs / get_advisors evidence is taken inside that window (OI-318)."

  - id: RESIDUAL-EMPTY-ANSWER
    title: "The marker means 'no streak-critical op REPORTED a failure', not 'every row was fetched': an empty read that returns nothing is silent"
    terminal_state: upstream_blocked
    blocker: "Empty reads that return nothing are silent (user_progress rows.isEmpty, user_profile, workout_plan, freezes rawRes == null); on the legacy fan-out path an RLS-filtered stale-token empty answer is indistinguishable from an empty table (the default single-call path is service-role and fail-closed). Telling 'empty' from 'unanswered' needs a restore-outcome record, which is OI-293 (restore outcomes observable); that is its own design with its own plan review, not a patch to this marker."
    reopen_when: "OI-293 (restore outcomes observable) lands."

  - id: RESIDUAL-ABA-SWAP
    title: "An A to B to A account swap inside ONE restore step can write A's rows into B's box with nothing reported"
    terminal_state: upstream_blocked
    blocker: "The pre-existing e5c2d1 class: restoreAbortedFor runs only between restore steps (sync_service.dart), unchanged by this batch. The marker adds no exposure beyond the restore's own."
    reopen_when: "The restore step checkpoint design changes (a per-write ownership check inside a step)."

  - id: RESIDUAL-FRESHNESS
    title: "The marker is process-lifetime and not freshness-bounded: a resume days later can reckon against rows another device completed in between"
    terminal_state: upstream_blocked
    blocker: "Exactly as the replaced tick was. Bounding it by IST date would disable the midnight-resume reckon and regress today's behaviour; the real fix is pull-on-resume (OI-279)."
    reopen_when: "OI-279 (pull on resume) lands."

  # ── Needs the founder ──
  - id: RESIDUAL-EF-CAPS
    title: "restore-user-snapshot silently caps scheduled_workouts at .range(0, 999) (ascending) and has no limit on workout_schedule_completions, so a long-history account's single-call restore can be incomplete with nothing reported"
    terminal_state: blocked_on_user
    reason: "Founder GO 2026-10-06 (chat): lift the caps. The scope grew once the single-call function was read in full: eleven reads were clamped to 1000 rows by PostgREST (not only these two), and the scheduled_workouts template embed was found readable across users under service_role (Hermes C13). The code (paged reads, a per-request page budget, owner-scoped embed) is Slice B1 of docs/plans/streak-freeze-restore-ownership-addendum-a.md and lands in a later commit of this batch; the live deploy still needs its own per-action go (CLAUDE.md 4.3) and the EF-deploy-from-a-branch-behind-main check. Closes as closed_in_commit when B1 lands."

  - id: F8
    title: "A freeze is consumed even when the streak breaks anyway, and the multi-freeze notice reads 'Streak Freeze used! 0 remaining this week.'"
    terminal_state: blocked_on_user
    reason: "Founder decision 2026-10-06: KEEP the rule (a freeze is still consumed when the streak breaks anyway) and fix the notice wording only. The copy is Slice U6 of docs/plans/streak-freeze-restore-ownership-addendum-a.md (a new lib/core/copy/streak_freeze_copy.dart, the live count at show time). Waiting on the founder approving the exact strings; closes as closed_in_commit when U6 lands."

  - id: LAST-WORKOUT-DATE
    title: "last_workout_date is overwritten by the whole-row restore (cloud-non-null-wins); a phone with a newer unpushed date is regressed by a stale cloud row and the regressed value is pushed back"
    terminal_state: blocked_on_user
    reason: "B-pass reviewer C F2 corrected this entry (it was verified_clean on a wrong premise). Writers: train_provider.dart completeWorkout (every completion) and the dev simulation; the LOCAL value is only read as the push payload (sync_profile.dart), migration 115 sets it with COALESCE(p_last_workout_date, last_workout_date) (no GREATEST), and the only reader is the rank-promotion gap gate (evaluate-rank-promotions/index.ts). So a stale restore can regress it and the push writes the regression back; it self-heals at the next completion. Founder decision 2026-10-06: widen this batch. Slice C1 of docs/plans/streak-freeze-restore-ownership-addendum-a.md (a body-only migration, date latest-wins with a future clamp, plus a client date-max restore). Needs Hermes review (SECURITY DEFINER content rule) and the founder's per-action go for the live apply; closes as closed_in_commit when C1 lands."

  - id: WEEKS-PUSH-RPC
    title: "B-pass reviewer A F5 (P3): the client now treats current_streak_weeks as monotonic on RESTORE, but the push RPC (migration 115) is a bare COALESCE for it (GREATEST for its siblings) and last_streak_week is local-only, so a reinstall re-counts the current week once"
    terminal_state: blocked_on_user
    reason: "Founder GO 2026-10-06 on the migration. Counter half = Slice C1 (GREATEST in update_user_progress_snapshot, body-only). Marker half (last_streak_week to the cloud) = Slice C2, only after the weekly-stamp fix (Slice D; founder D5 = yes, 2026-10-06, found because train_provider.dart stamps the marker on EVERY completion so a second session in a week is never counted) and its own plan-review round. Neither half is introduced by this batch: the re-count after a reinstall happens identically with the pre-fix cloud-wins restore, and max-wins only stops a restore from LOWERING the count. Recorded in lib/core/services/CLAUDE.md next to the monotonic-merge row. Each live apply needs the founder's per-action go (CLAUDE.md 4.3)."

