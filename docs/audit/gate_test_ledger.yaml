check_usage_counter_source.dart:
  mutation_proven: true
  test_path:
    - test/scripts/usage_counter_source_lib_test.dart
  evidence: >
    NEW gate 2026-09-04 (OI-162 slice 1). Blocks a TENTH quota being derived
    from a row count on ai_coach_interactions — a conversation LOG that
    rolling-context prunes nightly, which is why all nine existing quotas are
    resettable. Ships BEFORE the refactor it protects (§4.11); starts
    --warn-only. Baseline re-derived by running the matcher, not inherited:
    5 Edge Function quota sites + 9 migrations.
    2026-09-05 (slice 2): migration 129 added to `allowedMigrations` BY NAME.
    Its three counts are the one-time backfill that seeds usage_counters before
    the triggers stop reading the log — the fix for this very bug class — and
    left unlisted the gate blocked its own remedy, which is how a gate gets
    switched off instead of fixed.
    ⚠ A per-STATEMENT pattern exemption was implemented FIRST and REVERTED: the
    B-pass on 004af467 defeated it three ways in one sitting (a real quota read
    behind a no-op INSERT INTO usage_counters in a data-modifying CTE; a /* */
    block comment the stripper did not remove; and a legitimate CTE-first
    backfill that it wrongly FLAGGED). Recorded rather than quietly replaced,
    because the general lesson is the code-review skill's own: when a guard is
    a source grep, tightening the pattern never converges — an enumerated,
    grep-auditable allowlist does. Tests now 16, including "THE SAME backfill
    text in an unlisted migration IS a violation" (exemption follows the NAME,
    not the shape) and a block-comment case. The comment stripper gained a
    /* */ arm in the same change.
    SIX mutations, each confirmed APPLIED by an assert on the anchor before
    running, each reddening exactly 1 of 12 tests, tree restored identical
    afterwards and re-verified 12/12 green:
    (1) widen the quota filter to match .neq — rolling-context's two legitimate
    prune counts get flagged;
    (2) drop Dart comment stripping — a commented-out counter counts;
    (3) collapse block comments instead of preserving newlines — reported line
    numbers shift (the real bug that produced this gate's first wrong baseline,
    off by up to 25 and entirely plausible);
    (4) widen allowedEdgeFunctionSites to include the new file — proves the
    allowlist, not the matcher, is what refuses an unlisted file;
    (5) drop the `count > allowed` branch — an EXTRA counter inside an
    already-allowlisted file passes;
    (6) drop the migration allowlist membership test — a NEW migration counting
    ai_coach_interactions passes.
    ⚠ RECORDED HONESTLY: two earlier mutation attempts NEVER APPLIED (anchor
    mismatch, one from a stray \$ escape) and printed "All tests passed",
    which is proof of nothing — rule 21's named trap, caught only because each
    mutation asserts its anchor count first. Two further attempts produced a
    COMPILE error rather than a red test (removing the null-check broke Dart's
    null promotion in the following else-if); a compile failure is not a
    mutation proof, so both were replaced with forms that compile.

