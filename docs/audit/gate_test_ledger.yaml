check_oi_numbering_unique.dart:
  mutation_proven: true
  test_path:
    - test/scripts/oi_numbering_lib_test.dart
  evidence: "Baseline 23/23 green (20 at first authoring; +3 merge-placement e2e added by review round 1). FIVE mutations, each verified as actually applied before the run (a mutation that silently fails to apply reports green and proves nothing): dropping `stdoutEncoding: utf8` reddens 3; dropping the unparseable-board guard in _parseStrict reddens 1; dropping LEG 1 (the merge-base mint check) reddens 2; dropping LEG 3 (the title comparison) reddens 2; and forcing the OLD single-shape three-point selection (the naive base=merge-base(HEAD,origin/main) triple) reddens 10. The encoding mutation is the gate's own real, shipped bug -- its first live run against a branch KNOWN to be colliding reported PASS, because systemEncoding mangled the em-dash separator and 0 of 77 headings parsed. The shape mutation is its SECOND real shipped bug: with the naive triple, base == mainline at both merge placements, making legs 1 and 2 mutually exclusive and leg 3 unreachable for every input -- the gate could not fail. ⚠ SCOPE OF THIS EVIDENCE: all of it is LOCAL. Review round 2 showed CI runs this gate in a SHALLOW checkout where a merge commit reads as parentless, which re-degenerates the comparison; that is fixed by `fetch-depth: 0` on the audit-gates job in test.yml, and NO test in this repo executes the shallow shape -- it was verified by hand against a replica of actions/checkout's fetch sequence. Do not read these mutations as covering the CI environment."

