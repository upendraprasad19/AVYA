check_blast_radius_stdin_usage.dart:
  mutation_proven: true
  test_path:
    - test/scripts/blast_radius_stdin_usage_lib_test.dart
  evidence: >
    NEW gate 2026-09-19. Blocks a staged line that PIPES a producer into
    `blast_radius_from_diff.dart` without the trailing bare `-`
    (feedback_mistake_blast_radius_positional_mode.md, 5 recorded
    recurrences) — confirmed by reading blast_radius_from_diff.dart:120-149:
    the script reads stdin ONLY for `args.length==1 && args[0]=='-'`; a pipe
    with no trailing `-` is silently discarded and the script falls back to
    `git diff --cached --name-only` on the CURRENT repo, often classifying
    the wrong (empty) set. THE FIRST-DRAFT VERSION SHIPPED A REAL FALSE
    POSITIVE, caught only because the coordinating session independently
    re-verified rather than trusting the building fork's "all green" report:
    its `bareDashOnly` regex tolerated a trailing `-` only when followed by
    markdown/shell closing punctuation, so the ACTUAL, CURRENTLY-COMMITTED,
    CORRECT usage at scripts/pre-push.sh:168 (`blast_radius_from_diff.dart -
    2>/dev/null \`) would have been misclassified as misuse the moment that
    line was ever re-staged. Fixed by tokenizing the trailing content and
    requiring the FIRST token be a bare `-`, with every token after it
    restricted to shell redirection/line-continuation noise, never a genuine
    second argument. Regression test added pinning the exact pre-push.sh:168
    shape plus a BAD mirror (dash + a real extra arg). Mutation (run by the
    coordinating session, not the building fork): forcing
    `isPositionalMisuse` to always return `false` reddened 4 of 11 tests —
    exactly the 4 BAD-shape assertions; the 7 GOOD/mirror cases stayed green
    since they assert `isFalse` either way. Reverted; 11/11 green,
    `flutter analyze` clean.

