check_sot_registry_citations.dart:
  mutation_proven: true
  test_path:
    - test/contracts/sot_registry_citations_test.dart
  evidence: >
    Reverting parseConcepts from the list shape (`- concept: <name>`) to the
    mapping shape (`  <name>:`) reddens 8 of 28 tests (20 pass / 8 fail),
    measured 2026-08-10 by actually running the mutation, not asserted. The 8
    are the subprocess cases that invoke the real gate's main() in a throwaway
    git repo — so the mutation is caught at the wiring level, not only in pure
    logic. NOTE: commit d4a8de00's message claimed "3 cases red"; that number
    predates the 8 subprocess cases and is superseded by this measurement.
    The mapping shape is the exact mistake that produced a bogus "299 broken
    docs" reading while this gate was being designed: it parses to an EMPTY
    concept set, which makes every citation look dangling.

