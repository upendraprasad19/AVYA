# Gate test ledger — rule 24 (CLAUDE.md §4.4).
#
# Every scripts/check_*.dart carries EXACTLY ONE state:
#   mutation_proven: true  + test_path: (list) + evidence:   — a NEW gate
#   grandfathered: 2026-08-10                                — CLOSED list
#   test_exempt: <reason>                                    — no fixture is constructible
#
# Enforced by scripts/check_gate_test_ledger.dart — which carries NO gate
# number, per the forward-minting rule this batch ships (a new gate takes no
# number; the filename is the identity). The grandfather
# list is closed BY NAME in that script, not by this date string — writing the
# date here does not join the list.
#
# Why this exists: "Gate 44's own test never invoked main()". On 2026-08-10, 84
# gates existed and only 6 test files in the whole repo asserted a red path.

