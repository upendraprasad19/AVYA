    ⚠ Counts are ALL against the SAME 37-test baseline, re-measured after every
    suite change. They were cited at 29 and then 35 earlier in this same batch
    and went stale within hours both times — in the ledger of the gate whose
    entire subject is numbers nobody re-derives. Re-run rather than trust these.
    (1) DELETE THE HARD GROWTH BAND — every breach degrades to warn and nothing
    can ever block — 8 red (incl. the e2e asserting exitCode 1). The drift that
    motivated the gate was +427% on open_issues.md and +404% on OPEN_INDEX.md:
    two figures, corrected after round 1 caught them cited as one against the
    wrong file.
    (2) DELETE THE SHRINK FLOOR — 6 red. ADDED BY ROUND 1, which found the gate
    had no mirror at all: every negative drift was ok, so a CLAUDE.md truncated
    to ZERO BYTES reported "PASS: 3 within band". The one shrink test at the
    time exercised a proportionate 45% reclaim and stayed green under the bug.
    Floors are asymmetric on purpose: -50% warns (this batch's own legitimate
    reclaim was -45.5%), -90% blocks.
    (3) STOP FAILING OPEN — treat an unreadable artifact as a breach instead of
    SKIPPED — 4 red. Fail-open is load-bearing: a hygiene gate that can wedge
    every commit is worse than the drift it watches.
    (4) NARROW THE KEY UNION to baselines.keys, so an artifact tracked in the
    script but not yet baselined silently escapes the budget forever — 4 red.
    (5) MAKE THE REPORT DIRECTION-BLIND (shrank := false) — 2 red. ADDED BY
    ROUND 2, which found the LOGIC two-sided and the REPORT still hardcoding the
    growth thresholds and the verb "grew": the exact zero-byte fixture round 1
    built printed "grew past the 50% hard band" for a file that shrank 100% and
    crossed the -90% floor. A classifier fixed without its report is still
    wrong where the operator reads it.
    Restored: 37/37 green. Growth bands stay two-tier — soft 15% warns and never
    blocks (open_issues.md legitimately grows when an issue is filed), hard 50%
    blocks, because that is growth nobody reaches by accident.

