  - id: DEP-P2-44
    title: "log-client-error's smoke tolerated-code set omitted 401, so its smoke step false-FAILed on every deploy"
    terminal_state: closed_in_commit
    commit: *slice0
    fix_state: "fixed — .claude/deploy_via_api.js SMOKE_TOLERATED_CODES['log-client-error'] 400 -> [400, 401]"
    verification: docs/diagnoses/2026-08-10-deploy-smoke-false-fail-and-archive-mislabel-a7c3f9.md
    notes: >
      The function is verify_jwt=true, so the gateway answers the headerless
      {smoke:true} probe with 401 before the module runs — it can never return
      the 400 the entry was written for. Thirteen sibling auth-required
      functions in the same table already list 401 with exactly that rationale;
      this entry was the lone outlier. Not a one-off: it had already fired on
      the v11 and v12 deploys of this function and been hand-waved each time.
      A verification step that reports FAIL on every healthy run, complete with
      rollback instructions, teaches the operator to stop reading it.
      Proven by executing the REAL edited table with the red path: fixed
      predicate(401) -> true; pre-fix [400] predicate(401) -> FALSE.
