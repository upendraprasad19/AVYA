  - id: R2-N19
    title: "The pre-commit hook validates the WORKING TREE, so a split's later slices block the earlier one — slice 0 could not commit while slices 1-4 sat uncommitted"
    terminal_state: closed_in_commit
    commit: *slice0
    verification: "scripts/check_sot_registry_parity.dart PASS once the 3 slice-4 files were set aside"
    notes: >
      Not anticipated when the split was planned, and it cost three commit
      attempts. The hook runs `flutter test` and the check_*.dart gates against
      the tree, not the staged set, so uncommitted slice-2/3/4 code failed gates
      that slice 0's own content passes cleanly. Two of the three failures were
      REAL defects worth having (R2-N16, R2-N17). The third was an artifact: the
      SoT registry's `sync_service.dart:821-845` range for compileDailySnapshot
      is CORRECT at HEAD and stale only against the dirty tree (the method sits
      at :897 there, +76 from slice-4's edits) — so "fixing" the registry would
      have made the COMMITTED state wrong. Resolved by setting the 3 slice-4
      files aside for the commit and restoring them after.
      The generalisable rule for the remaining slices: a slice must be committed
      from a tree containing only that slice, or the gates adjudicate code the
      commit does not contain. Verify a stale-line-range failure against HEAD
      before editing the registry — the tree is not the artifact being committed.
