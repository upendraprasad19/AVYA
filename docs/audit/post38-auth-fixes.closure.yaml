# Closure ledger — post38-auth-fixes (5 units; 45 findings).
#
# ⚠ COUNTS CORRECTED 2026-08-10. This header previously opened "35 findings =
# 27 + 8 + 7" — three numbers that sum to 42, against a header that said 35 and
# a `total_findings:` that said 43. Nobody was lying; the prose was hand-edited
# as findings accrued while the LIST was the thing actually growing. Recounted
# mechanically by id prefix, which is the only number that cannot drift:
#     16  R1-*   round 1 (2026-08-07)
#     19  R2-N*  round 2 (2026-08-08) — largely defects introduced BY round 1's fixes
#      8  B*     mandatory pre-merge B-pass on d4a8de00 (2026-08-09)
#      2  DEP-*  found by RUNNING the authorised v13 deploy and reading its output (2026-08-10)
#     ---
#     45  = total_findings = closed_count
# So only 35 of 45 came from a review ROUND at all: eight came from the B-pass on
# an already-finished commit, and two from executing a deploy that had already
# reported success. Reviews are not the only instrument, and were not the most
# efficient one here.
#
# Gate 40 (validate_audit_closure.dart). One terminal_state per finding; no
# `deferred:` key.
#
# SCOPE NOTE — read this before interpreting `blocked_on_user` below.
#
# Round 1 produced 16 findings, round 2 produced 11 more, and the decisive
# signal was that round 2's findings were largely defects introduced BY round
# 1's fixes. That is §4.12.1's explicit trigger ("when successive reviews keep
# surfacing new material issues, that is the signal the unit is too large —
# split it and ship the smallest converged piece"). The founder ratified the
# split on 2026-08-08 into four independently-converging slices, each with its
# own review round, its own plan-review record, and its own merge under its own
# founder go.
#
# `blocked_on_user` here means: the finding's fix is sequenced into a NAMED
# approved slice whose merge requires the founder's go. Every such entry carries
# the slice name in `reason:`. All 45 findings live in THIS one ledger — none is
# handed to a future ledger to remember — so nothing can fall between slices.
#
# ⚠ CONVENTION, corrected after the B-pass (2026-08-08, Finding 1):
# `closed_in_commit` means THE FIX IS IN A COMMIT THAT EXISTS. Nothing else.
# The first version of this ledger marked 14 entries `closed_in_commit` +
# `commit: *slice0` whose fixes were only uncommitted working-tree edits — the
# starkest being R1-P0-1, a P0 auth defect whose own `notes:` said "the code
# ships in slice 2" while its terminal_state claimed it was already in slice 0.
# A reader trusting the ledger would have believed a P0 was safe in git history
# when it existed nowhere but one machine's working tree. Those 14 are now
# `blocked_on_user` + `reason: *sN` + an explicit `fix_state:` saying the fix is
# written but NOT in any commit.
# The general rule: a closure ledger describes GIT, not the author's intent. If
# you cannot name the commit that carries it, it is not closed.
#
# Slice 0 (this commit) closes the server-side and documentation half: migration
# 119, log-client-error v12, the b6e4f2 corrections, the board entries, and the
# new SoT-citation gate that forces slices 1–3 to register their SoT concepts.

