# Closure ledger — post38-auth-fixes (5 units; 35 findings = 27 over two review
# rounds + 8 found while scoping and committing slice 0 on 2026-08-08 — three
# of those eight came from the pre-commit suite, not from any review round)
# Gate 40 (validate_audit_closure.dart). One terminal_state per finding; no
# `deferred:` key.
#
# SCOPE NOTE — read this before interpreting `blocked_on_user` below.
#
# Round 1 produced 16 findings, round 2 produced 11 more, and the decisive
# signal was that round 2's findings were largely defects introduced BY round
# 1's fixes. That is §4.12.1's explicit trigger ("when successive reviews keep
# surfacing new material issues, that is the signal the unit is too large —
# split it and ship the smallest converged piece"). The founder ratified the
# split on 2026-08-08 into four independently-converging slices, each with its
# own review round, its own plan-review record, and its own merge under its own
# founder go.
#
# So `blocked_on_user` here means exactly one thing: the finding's fix is
# sequenced into a NAMED approved slice whose merge requires the founder's go.
# Every such entry carries the slice name in `reason:`. All 27 findings live in
# THIS one ledger — none is handed to a future ledger to remember — so nothing
# can fall between the slices.
#
# Slice 0 (this commit) closes the server-side and documentation half: migration
# 119, log-client-error v12, the b6e4f2 corrections, the board entries, and the
# new Gate 44 that forces slices 1–3 to register their SoT concepts.

