  # ── Round-2 findings, on the round-1 CORRECTIONS ────────────────────────────

  - id: R12
    title: "R5's kill-switch writer is DEBUG-ONLY — in a release APK the gate still has no writer, so R5's own closure claim was false for the shipped artifact"
    severity: P1
    terminal_state: closed_in_commit
    commit: "deps-board-equipment (claim scoped honestly; OI-95 filed for the capability gap)"
    verification: >
      app_router.dart:336 wraps the /dev route in `if (kDebugMode)`, so
      DevPanelScreen is compiled out of `--flavor prod --release`. Confirmed by
      direct grep, and `grep -rn "RemoteConfig" lib/` returns only
      sync_service.dart:254's comment stating none exists. So R5 made the
      kill-switch operable for DEVELOPMENT only; production revert of this
      platform-tier flip still requires a code change plus an APK respin —
      verbatim the cost R5 claimed to remove.
      NOT papered over and NOT re-fixed by exposing a plan-engine kill-switch to
      end users, which would be worse. The limitation is ARCHITECTURAL and applies
      to every flag in this codebase, so it is stated plainly here, in the flip
      commit, and in the plan-review record, and filed as OI-95 for the general
      capability. Accepted risk for this flip specifically: the failure mode is
      degraded plan CONTENT, not a crash or data loss, so respin latency is
      tolerable — but that is a judgement, and it is recorded as one.

