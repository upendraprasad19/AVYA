    title: "The read side had TWO copies of the enable_hold_weeks gate"
    terminal_state: closed_in_commit
    commit: *wip
    verification: *t
    notes: >
      holdStatusProvider restated `if (!PlanEngineFlags.holdWeeksEnabled)` while
