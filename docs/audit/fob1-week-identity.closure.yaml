  - id: FOB-1-R1
    title: "ai_snapshot_builder still feeds the coach the clamped-derived week"
    terminal_state: upstream_blocked
    commit: *wip
    verification: "docs/ship_dark_pending_review.yaml FOB-3 (OPEN)"
    blocker: >
      FOB-3 owns the coach snapshot and requires an ai-proxy redeploy, which is
      a separate explicit founder authorization (§4.3 — plan approval is not
      deploy approval). This batch had no such authorization.
    reopen_when: >
      FOB-3 is picked up. Its batch must adopt WeekIdentity in
      ai_snapshot_builder.dart:96 and :1221 in the SAME commit that adds the
      `hold` block, the trimSnapshotToBudget keep-set entry and the
      captain_manual.ts change, and redeploys ai-proxy.
    notes: >
      ROUTED, not deferred. FOB-1's `why:` lists ai_snapshot_builder.dart (x2),
      but FOB-3 owns the snapshot by the board's own division of OI-60 — it
      rewrites the SAME lines to add the `hold` block plus the
      trimSnapshotToBudget keep-set entry and captain_manual.ts, and requires an
      ai-proxy redeploy under its own §4.3 authorization. Touching it here would
      have shipped a half-changed snapshot contract with no redeploy behind it.
      FOB-3 remains a hard flip-on precondition, so nothing is lost.

  - id: FOB-1-R2
    title: "Inputs where the clamped 4 is HONEST — must NOT be branched"
    terminal_state: verified_clean
    commit: *wip
    verification: *t
    notes: >
      Three call sites were examined and deliberately left alone, because
      branching them would have made them WRONG. (a) journey_timeline's
      WardBar(pct: currentWeek / 4.0) — during a hold currentWeek is 4 and the
      phase's four weeks genuinely ARE elapsed, so a full bar is correct;
      feeding it an ordinal would divide an H-number by 4. (b) phase_roadmap's
      percentage and bar, derived from the program week — four of twelve program
      weeks really are done. (c) SelectedWeekNotifier.build stays clamped: hold
      rows sit at week 5+ and getWeek(5) is empty, so un-clamping renders
      "Week 5 hasn't started yet" over a week the user is training — the exact
      trap OI-125 names.

  - id: FOB-1-R3
    title: "telegram-bot/bot.py prints the clamped week"
    terminal_state: upstream_blocked
    commit: *wip
    verification: "CLAUDE.md §2 — separate project, OpenClaw VPS, not in this repo"
    blocker: >
      The file is not in this repository. telegram-bot/ is a separate project
      deployed on the OpenClaw VPS (@ICanbeFitterBot), so no commit here can
      reach it.
    reopen_when: >
      enable_hold_weeks flips ON. Until then the bot cannot observe a hold at
      all, because no user has one. At flip time the bot repo adopts the same
      rule — suppress the week number, Hn is the identity.
    notes: >
      Named in FOB-1's `why:` but not in this tree. Stated rather than silently
      dropped. It is a display-only string in a separate deployment and does not
      block the flip; whoever owns the bot repo adopts the same rule when
      enable_hold_weeks flips.

  - id: FOB-1-B1
    title: "B-pass P1 — userStatsProvider had NO dependency-graph link to the hold write"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "test/contracts/hold_week_identity_behavioral_test.dart (wiring token pins ref.watch(weekIdentityProvider))"
    notes: >
      Found by the B-pass, lens guard_without_its_mirror. UserStatsNotifier.build()
      called WorkoutScheduleService.instance.weekIdentity() as a plain singleton,
      so journey_timeline and profile_content — 2 of the 6 surfaces this batch
      fixes — were reachable only via a notifier nothing invalidates on a hold
      write. The 5 tabs live under StatefulShellRoute.indexedStack, so an
      already-mounted Profile tab is not rebuilt on tab-switch: a user who
      visited Profile before holding would see "WEEK 4 OF 4" there while Home and
      Train said "HOLDING · Hn" — reintroducing the very cross-tab contradiction
      the batch exists to close. FIXED with ref.watch(weekIdentityProvider),
      which links the graph once for every present and future call site rather
      than patching two call sites with an invalidate a third would forget.

  - id: FOB-1-B2
    title: "B-pass P2 — the surface coverage was presence-only and could not fail"
    terminal_state: closed_in_commit
    commit: *wip
    verification: test/contracts/hold_week_labels_test.dart
    notes: >
      The reviewer PROVED this rather than asserting it: it inverted the ternary
      in profile_content.dart — a defect showing "Holding · Hnull" to every
      non-holding user — and all 16 tests still passed, because the only coverage
      was a source grep for a token. FIXED by extracting all five label ternaries
      to pure functions in lib/core/utils/hold_week_labels.dart and adding a
      16-case table-driven test asserting the exact string on BOTH arms of each,
      plus a group asserting no formatter can interpolate "null". Re-running the
      reviewer's exact mutation now reddens 4 tests (it reddened 0 before).
      RESIDUAL, stated not glossed: this closes the LABEL logic, not widget
      rendering — no widget test mounts these five screens, so a surface that
      stopped calling its formatter entirely is still caught only by the
      presence-grep. That is a larger piece of work and is not a flip-on blocker.
