# Closure ledger — FOB-1 (week-identity coherence), the first of OI-60's
# remaining flip-on blockers. Gate 40 (validate_audit_closure.dart).
# One terminal_state per finding; no `deferred:` key.
# Branch: claude/oi-pending-hold-weeks-1od97o.
#
# Provenance: the founder asked what was pending on them and why the hold-week
# display fix was invisible in the webapp. The answer — the fix is on main but
# `enable_hold_weeks` is default OFF and `/dev` is kDebugMode-gated out of the
# Vercel release build (OI-95) — led to the decision to start clearing OI-60's
# flip blockers. FOB-1 was chosen because it is the ONLY remaining blocker
# completable end to end without a live-prod action: FOB-3/FOB-4 need three EF
# redeploys and FOB-5 a migration apply, each its own §4.3 authorization.
#
# This is a founder-sequenced split, not an agent deferral (§4.2): OI-60 was
# already broken into 7 pieces by explicit founder decision recorded at
# docs/audit/oi60-streak-identity.closure.yaml:6-12, and every remaining piece
# is a tracked board item that blocks the flip.

