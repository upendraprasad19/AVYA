golden_capture_script: |
  // One-time capture of the pre-write-claim prompt blocks, read at a recorded
  // origin/main SHA, independent of the new builders (coach-log-truth plan §3).
  // Usage: deno run --allow-run --allow-write capture_golden.ts <sha> <out.json>
  const [sha, out] = Deno.args;
  async function show(path: string): Promise<string> {
    const p = new Deno.Command("git", { args: ["show", `${sha}:${path}`], stdout: "piped" });
    const { stdout, success } = await p.output();
    if (!success) throw new Error(`git show failed: ${path}`);
    return new TextDecoder().decode(stdout);
  }
  function between(src: string, start: string, end: string): string {
    const i = src.indexOf(start);
    if (i < 0) throw new Error(`start not found: ${start}`);
    const j = src.indexOf(end, i + start.length);
    if (j < 0) throw new Error(`end not found: ${end}`);
    return src.slice(i + start.length, j);
  }
  async function sha256(s: string): Promise<string> {
    const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(d)].map((b) => b.toString(16).padStart(2, "0")).join("");
  }
  const aiProxySrc = await show("supabase/functions/ai-proxy/index.ts");
  const tmpl = between(aiProxySrc, "const ICBF_LOG_INSTRUCTIONS = `", "`;");
  if (tmpl.includes("${")) throw new Error("template has interpolation");
  // deno-lint-ignore no-eval
  const aiProxy: string = (0, eval)("`" + tmpl + "`");
  const mediaSrc = await show("supabase/functions/ai-media-proxy/index.ts");
  const mediaExpr = between(
    mediaSrc,
    `"\\n- For any other photo: relate your analysis to the user's fitness journey." +\n`,
    ");\n\n    if (snapshot_json)",
  );
  // deno-lint-ignore no-eval
  const media: string = (0, eval)("(" + mediaExpr + ")");
  if (!media.startsWith("\n\nFITNESS DATA LOGGING — INSTANT:")) throw new Error("media slice start");
  const swapSrc = await show("supabase/functions/_shared/day_swap_routing.ts");
  const swapTmpl = between(swapSrc, "const PRO_CAPABLE_BLOCK = `", "`;");
  // deno-lint-ignore no-eval
  const daySwapProCapable: string = (0, eval)("`" + swapTmpl + "`");
  const json = {
    sha,
    captured_by: "capture_golden.ts (coach-log-truth plan §3); see the diagnose doc for the command",
    ai_proxy: aiProxy,
    media,
    day_swap_pro_capable: daySwapProCapable,
    sha256_ai_proxy: await sha256(aiProxy),
    sha256_media: await sha256(media),
    sha256_day_swap_pro_capable: await sha256(daySwapProCapable),
  };
  await Deno.writeTextFile(out, JSON.stringify(json, null, 2) + "\n");
  console.log("ok", aiProxy.length, media.length, daySwapProCapable.length);
