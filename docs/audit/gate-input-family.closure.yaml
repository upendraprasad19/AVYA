    title: Thirteen ship-dark flags had no ledger entry, contradicting OI-53
    severity: P1
    terminal_state: closed_in_commit
    commit: "gate-input-family (uncommitted)"
    verification: >-
      OI-53 asserted the 13 workout-generator flags were "logged in
      docs/ship_dark_pending_review.yaml"; that file held only enable_hold_weeks
      (3 rows). The claim was false. Backfilled from source rather than memory —
      each build_commit is the first commit introducing that flag's string into
      plan_engine_flags.dart (`git log -S --reverse`), each branch from the
      subject of the first containing merge (`git log --merges
      --ancestry-path`). The code-imposed flip ORDER is recorded with it and was
      verified in source, not repeated from memory: enable_plateau_escalation
      "Presupposes `enable_readiness` ON", and enable_triggered_deload's
      evaluator "additionally requires readiness ON … running the eval without
      it biases toward LIFTING". enable_readiness flips first.

