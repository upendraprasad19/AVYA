  - id: BP1
    title: B-pass on the final staged diff — 3 P2, 1 P3, all fixed
    severity: P2
    commit: "gate-input-family (uncommitted)"
    terminal_state: closed_in_commit
    verification: >-
      Mandatory §4.3 pre-merge pass, and NOT a formality here: the split landed
      after round 2, so this is the only review that saw the code that actually
      ships. Findings: (1) two `_git` sites still failed open —
      `rev-list --first-parent` reported "nothing landed" on a git error, and
      `log -1 --format=%P` mis-filed a genuine MERGE as a direct commit, which
      after the OI-58a scope cut means it is never checked for a record at all.
      I had ALREADY REPORTED the rev-list site as fixed in an earlier turn and
      it had not applied — `feedback_mistake_unverified_done_claims`, the most
      recurrent class in this repo, inside the batch about gates that
      confidently return wrong answers. Neither site has a crafted trigger,
      which is why three rounds hunting reachable bypasses missed both. (2) the
      diagnose-doc's `writers:` field cited three symbols the split had DELETED,
      at line numbers past EOF in a 237-line file. (3) the control count claimed
      16/14/2 when the truth is 8/7/1, contradicting the same doc's own body.
      (4) P3, pre-existing and outside the diff: `stagedPaths()` returned `[]`
      on git failure so a catastrophic commit exited 0 — fixed anyway rather
      than left as a deferral by another name, since it is the same class OI-72
      fixes twice in that file. Full suite green at 101 after the fixes. Record:
      docs/reviews/gate-input-family-bpass.md.

  - id: RV2
    title: The gate and its CI invocation are still read from the tree they judge
    severity: P2
    terminal_state: blocked_on_user
    reason: >-
      Same control as OI-58b-residual: requiring PRs so `main` cannot be pushed
      directly. `.github/workflows/test.yml` runs the gate from the merged
      checkout, and on a push event GitHub evaluates the workflow file at the
      pushed SHA — so both the gate and its invocation are supplied by the
      commit under test, while the registry marks both `platform`. This is the
      same class OI-70 closes for docs/blast_radius.yaml, and an earlier draft
      of the diagnose-doc's "What is NOT closed" named only the merge-subject
      spoof; round-1 review caught that over-claim and it is corrected in place
      rather than widened quietly. Not fixable in-repo: pinning the script to a
      base revision still leaves the workflow step author-supplied, and would
      stop a genuine improvement to the gate from ever governing its own merge.
      Recorded rather than claimed closed.

  - id: OI-58a
    title: Single-parent commits pushed straight to main skip the gate
    severity: P0
    terminal_state: upstream_blocked
    blocker: >-
      Split out per CLAUDE.md §4.12.1 (founder-approved 2026-07-27). The
      enforcement needs a CONTENT-verified exemption designed from scratch, not
      another patch on the path-verified one; that is its own reviewed unit.
    reopen_when: >-
      The split unit ships: direct-to-main >=account landings judged per-commit,
      with an exemption that verifies every CHANGED LINE is a version line, plus
      its own ×2 review. Tracked as OI-58 in docs/audit/open_issues.md.
    reason: >-
      SPLIT OUT of this batch on 2026-07-27, founder-approved, per CLAUDE.md
      §4.12.1 ("when successive rounds keep surfacing new material issues the
      unit is too large — split it and ship the smallest converged piece").
      Three independent review rounds each found a NEW material defect in the
      enforcement written for this, every one in the same place: round 1 found a
      per-PUSH union that broke the standard release flow; round 2 found that
      the FIX for that introduced a version-bump exemption accepting any SUBSET
      of its path allow-list — confirmed by execution, a direct commit rewriting
      monthlyPriceInr and freeAiMessagesPerDay in app_constants.dart passed at
      account tier with a "version-bump exemption" note. The finding is real and
      demonstrated (be3b4baf and 8c38c855 are account-tier auth commits that
      landed unreviewed), so this is NOT a judgement that it does not matter —
      it is a judgement that the enforcement needs designing rather than
      patching. The next unit builds it with a CONTENT-verified exemption (every
      changed LINE a version line), matching the standard the Dependabot
      exemption in the same file already meets. Tracked OPEN in
      docs/audit/open_issues.md; the range walk it motivated ships here.

