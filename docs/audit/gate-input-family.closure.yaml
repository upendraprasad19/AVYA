    title: Merged branch identity comes from the merge subject, which is free text
    severity: P1
    terminal_state: upstream_blocked
    blocker: >-
      Split out with OI-58a — one-record-one-landing belongs with the unit that
      judges landings, and was built then removed again inside this batch.
    reopen_when: >-
      The split unit ships, re-adding requiresFreshRecord with its two e2e
      controls. Residual first-time spoof stays blocked_on_user (branch
      protection / require PRs).
    reason: >-
      Split out with OI-58a — one-record-one-landing was built and removed again
      in the same batch; it belongs with the unit that judges landings. Its
      residual (a first-time spoof naming a never-landed branch) is a trust
      boundary no in-repo script can close and shares the control below.

  - id: OI-70
    title: Tier engines classified a commit using the registry that commit changes
    severity: P1
    terminal_state: closed_in_commit
    commit: "gate-input-family (uncommitted)"
    verification: >-
      Fixed BEYOND the filed scope, because the filed fix was half of one. OI-70
      proposed reading `docs/blast_radius.yaml` as of HEAD^1, which closes
      self-exemption (delete your own rule) but preserves the mirror hole:
      `904e6961` landed `.github/workflows/test.yml` while the registry of the
      day graded it only via a BROADER `.github/** -> feature` rule (line 111);
      the narrower `.github/workflows/test.yml -> platform` promotion arrived a
      batch later in `9e3ce5d8` (line 96). Round-1B review corrected an earlier
      wording here that claimed no rule covered the path at all — the tier
      outcome is the same, the mechanism was misstated. Base-only would exempt
      exactly the branches that tighten the rules. Implemented as max(tier under
      range base, tier under merged tree). Both directions carry an e2e test,
      but only the self-exemption one is a revert-control: the "rule arrives
      with the change" test also fails against the pre-fix gate (which read the
      merged tree, already containing the new rule), so it is a DESIGN-LOCK on
      the rejected base-only alternative rather than proof of this change.
      Labelled as such in the test after round-1B review flagged the over-claim.

  - id: OI-71
    title: Blast-radius diff was three-dot, blind to conflict-resolution content
    severity: P1
    terminal_state: closed_in_commit
    commit: "gate-input-family (uncommitted)"
    verification: >-
      `HEAD^1...HEAD^2` is merge-base..branch-tip and excludes what the merge
      commit itself wrote. Every diff is now two-dot over the actual range, so
      the inspected set can only grow — the change can raise a tier and never
      lower one. The e2e control carries an explicit setup guard asserting the
      old three-dot diff really is blind to the planted file, so it cannot pass
      for the wrong reason. Honest note: `904e6961` was checked as a candidate
      live instance of this and is NOT one (its two-dot and three-dot file lists
      are identical); the registry-version effect above is its real explanation.

  - id: OI-72
    title: A review file satisfied the catastrophic gate without entering history
    severity: P1
    terminal_state: closed_in_commit
    commit: "gate-input-family (uncommitted)"
    verification: >-
      The hash came from `git diff --cached` (index) while the file was checked
      with `File(...).existsSync()` (working tree), so an untracked review
      passed — and being untracked, it never moved the hash it was named after.
      Three untracked docs/reviews/*-review.md files were present when this was
      found. Now read through `_stagedFileExists`/`_stagedFileContent`, helpers
      already in that same file for this exact class and applied to the SECURITY
      DEFINER check but not to the review artifact. The hash excludes
      docs/reviews/ so staging the review cannot rename it; the middle of three
      e2e controls is what proves that circle is broken.

