# Closure ledger — the gate-input family (OI-58 / OI-70 / OI-71 / OI-72) + riders
#
# §4.2 structural invariant: every entry carries a terminal_state; the schema
# has no `deferred:` key. Gate 40 recomputes the tally and fails if any item is
# non-terminal.
#
# One thesis across four open issues: the merge-to-main gates derived their
# inputs from author-controllable or post-merge state. OI-58 was folded in over
# its own "own reviewed unit" note (founder-approved 2026-07-27) because its fix
# replaces the exact line OI-71 patches — splitting them meant writing the range
# derivation twice.
#
# OI-58 is recorded as TWO findings, because its two faces have different
# terminal states. The single-parent bypass is closed in code. The deliberate
# merge-subject spoof is not closeable by a script whose every input is authored
# by the person being checked; its realistic form is closed and the residual is
# blocked_on_user with the specific action named.

batch: gate-input-family
date: 2026-07-27
blast_radius: platform
diagnose_docs:
  - docs/diagnoses/2026-07-27-keystone-gate-derives-inputs-from-controllable-state-a7f3d1.md
  - docs/diagnoses/2026-07-27-review-artifact-satisfies-gate-without-entering-history-b2e6c4.md
total_count: 13
closed_count: 13

findings:
  - id: RV1
    title: Round-1 independent review — 3 P1, 3 P2, 3 P3, all fixed in-branch
    severity: P1
    terminal_state: closed_in_commit
    commit: "gate-input-family (uncommitted)"
    verification: >-
      One independent context-blind round on gate correctness returned nine
      findings; every one was re-verified by me against the code or by execution
      before being acted on, and every one is fixed with its own regression test
      (7 new tests, `round-1 review regressions` group). The two that matter
      most are method failures, not code failures. P1-1: the version-bump
      exemption was evaluated per-PUSH while the baseline justifying hard-fail
      over --warn-only ("3 of 60, 1 exempted") was measured per-COMMIT — under
      the shipped code the real release push (2c4cbddd bump + 6a364656 docs, the
      two halves of APK +37) FAILED, verified by running the gate over
      3bca83a8..HEAD. P1-2: the rewrite deleted the old `if (diff.isEmpty)
      die(...)` guard while `_git()` returned '' on any failure, so an errored
      diff read as feature-tier. Also fixed: P2-1 unresolvable PUSH_BEFORE
      narrowing silently (force-push shape), P2-2 content escalation read from
      the working tree rather than the commit's own tree, P2-3 one-record-one-
      landing blind to merges earlier in the same push, P3-1 record fields not
      frontmatter-scoped, P3-2 CWD-relative pathspec, P3-3 stale CI comment.

  - id: RV1b
    title: Round-1B independent review — 1 P1, 6 P2, 4 P3, all fixed in-branch
    severity: P1
    commit: "gate-input-family (uncommitted)"
    terminal_state: closed_in_commit
    verification: >-
      A second independent round on a different surface (tests + factual claims).
      Its highest-value output was three FALSE STATEMENTS OF MINE, each
      re-verified by me before acting. (1) I wrote that 904e6961's registry had
      no rule covering .github/workflows/test.yml so it fell through to
      default_tier; it has `.github/** -> feature` at line 111 — I had grepped
      that registry for `workflows` and `scripts/` and never for `.github/**`,
      the second incomplete-grep conclusion in this batch. Tier outcome
      unchanged; mechanism was wrong in four places. (2) "Five untracked
      docs/reviews/*-review.md files" — there are three; the other two are
      `-bpass.md` and invisible to the gate. Corrected in five places. (3) One
      of the eight controls was vacuous: the OI-70 "rule arrives with the
      change" test also fails against the pre-fix gate, so it is a DESIGN-LOCK
      on the rejected base-only alternative, not a revert-control — the file
      header claiming all tests were revert-controls is corrected and each kind
      is now labelled. Also fixed: this ledger failed its own Gate 40 (no
      `commit:` fields); the ship-dark ledger still carried an unresolved
      "(uncommitted — fill sha at commit)" placeholder for hold-display-fixes
      (ff13623e / merge 342820b3) despite R1 existing to make that file true;
      .claude/skills/code-review/SKILL.md documented the staging hash as
      sha256(git diff --cached) when the gate uses git sha1 hash-object AND now
      excludes docs/reviews, so a review named by following it could never match
      (CLAUDE.md 5.1 skill self-evolution); four file:line citations had
      drifted; the freshness-safety window was 25 merges when 182 were
      available (widened — conclusion strengthened, zero false positives across
      all of history); and two controls asserted only an exit code where the
      pre-fix gate exited 1 for a different reason, now asserting the reason.

  - id: R4
    title: CI job wiring for the pushed-range base
    severity: P3
    commit: "gate-input-family (uncommitted)"
    terminal_state: closed_in_commit
    verification: >-
      .github/workflows/test.yml:191-199 passes PUSH_BEFORE from
      github.event.before to the gate, and its comment now explains why
      fetch-depth: 0 is still load-bearing for a DIFFERENT reason than before
