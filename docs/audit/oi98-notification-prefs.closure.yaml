    commit: *wt
    verification: "information_schema.columns — notification_preferences | jsonb | is_nullable=YES | column_default=null"
    notes: >
      Applied live via MCP apply_migration under explicit founder authorization
      ("122 apply"), §4.3. NULLABLE with NO DEFAULT is load-bearing: NULL means
      "no record" and must stay distinguishable from {} — collapsing those two
      is the root of OI-98, so a DEFAULT '{}'::jsonb would have re-created the
      bug in its new home on day one.

