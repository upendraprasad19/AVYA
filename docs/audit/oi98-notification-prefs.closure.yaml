# ORIGIN. OI-98 filed this as a reinstall bug. It is that, but the dominant
# failure needed no reinstall at all: all ten server readers took the user's
# NEWEST user_daily_snapshots row with no fall-through, and FOUR Edge Functions
# write that row — three of which create a preference-less one when the day has
# none. Measured live at batch start: 3 of the 5 users who had ever stored a
# preference were being ignored outright.
#
# ⚠ THE DECISION THAT SHAPED THE BATCH. Two earlier revisions tried to patch the
# preferences INSIDE the snapshot blob and were each blocked by independent
# review, on a different leak from the same root cause. A wholesale-replaced
# document cannot represent "I know these three settings and nothing about the
# other seven", which is exactly a reinstalled device's state — so the container
# was wrong, not the patch. Founder chose to move the data. That deleted more
# work than it added: no multi-row reduce, no newest-row-wins, no shadowing, and
# NO new detector gate, because the failure mode stops existing rather than
# needing to be caught.

