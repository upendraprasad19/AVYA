  - id: MIG-123
    title: "Per-key additive write for the new column — jsonb merge RPC"
    terminal_state: blocked_on_user
    reason: >
      §4.3 — applying a migration to the prod project requires explicit
      per-action founder authorization. The authorization given covered
      migration 122; 123 is a separate apply and has not been requested yet.
      Until it is applied the RPC call fails at runtime, so the client half of
      BP-1's fix is written and tested but not yet live.
    notes: >
      `merge_notification_preferences(jsonb)` — jsonb `||` (right wins per key),
      SECURITY INVOKER and keyed on `auth.uid()` so the caller's own RLS
      applies and a user cannot write another's row. REVOKE is FROM PUBLIC, not
      from `anon`/`authenticated`, which inherit through PUBLIC and would make a
      per-role revoke a no-op. Rejects a non-object payload and no-ops on `{}`.

