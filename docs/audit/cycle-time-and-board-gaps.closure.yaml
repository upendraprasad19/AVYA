  - id: F-6
    title: "The `/update-docs` skill instructed writing a 'Follow-ups deferred' section — the exact semantic §4.2 bans — inside the skill that walks the end-of-batch checklist; and it never mentioned worktree retirement, the row §4.13 names as retirement's ONLY trigger"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "Both fixed in .claude/skills/update-docs/SKILL.md: step 9 now requires a terminal state per node and routes genuine non-closure to the OI board; new node 27 carries the retirement command, the four-leg predicate and the run-from-primary constraint. check_no_deferral_euphemism.dart widened from staged-diff-only to a FULL sweep of CLAUDE.md + every .claude/skills/**/SKILL.md, and now passes."
