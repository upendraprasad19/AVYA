  - id: F-3
    title: "`commandInvokesGitSubcommand` anchored at `^git`, so ANY environment prefix bypassed the raw-git block entirely; and `commandUsesWrapper` was a bare substring check, so merely NAMING safe_commit.sh disarmed the guard"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "16-case behavioural probe, all passing: `FOO=1 git commit -m x`, `env FOO=1 git push`, `command git commit`, `\\git commit`, `env -i PATH=/bin git commit` are now all detected; `echo \"use safe_commit.sh\" && git commit -m x` no longer counts as using the wrapper, while all 7 real invocation forms still do. 30 new assertions in test/contracts/git_safety_lib_test.dart. `sudo`/`nohup` deliberately NOT stripped — over-stripping risks a false BLOCK, the one failure mode this hook must not have."
    notes: "Consequence worth stating plainly: the documented hatch `ALLOW_RAW_GIT=1 git commit` had been 'working' only because the hook could not SEE the prefixed command — a detection miss, not an authorization check, which made an accidental bypass indistinguishable from an approved one. And `FOUNDER_APPROVED_NO_VERIFY=1 git commit --no-verify` genuinely did NOT work: the `--no-verify` match is unanchored so the deny still fired, while the env read looked at the hook process's own environment, which an inline prefix never sets. Both hatches now read the inline assignment via inlineEnvAssignment(), so the documented incantation IS the mechanism."

