  - id: R1-1
    title: "BLOCKING — this batch DISARMED the git-safety hook: naming a hatch variable anywhere granted it"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "inlineEnvAssignment matched `(?:^|\\s)NAME=` ANYWHERE in a statement, so a MENTION granted the hatch. Verified against the REAL hook with a working control (plain `git commit` -> exit 2). Three shapes were BLOCKED before this batch and ALLOWED after it: a raw force-skip push with FOUNDER_APPROVED_NO_VERIFY=1 appearing only in a trailing shell COMMENT (this one disarms the hook ENTIRELY: the skip flag matches, the hatch reads approved, and the raw-push check never runs); ALLOW_RAW_GIT=1 inside a commit MESSAGE; and ALLOW_RAW_GIT=1 in a preceding echo. FIXED: the assignment must now lead the prefix chain of the SAME statement that invokes git. 15/15 e2e cases green (4 bypasses blocked, 3 controls blocked, 6 legitimate hatches + wrappers still allowed). Mutation-proven on both legs: restoring the match-anywhere regex reddens 4 tests, dropping the same-statement-is-git check reddens 1."
    notes: "This is the SAME class the same commit fixed 20 lines above for commandUsesWrapper, whose docstring reads 'merely NAMING the wrapper anywhere disarmed the guard'. Fixed one detector, introduced the identical hole in its neighbour, in one commit — feedback_mistake_guard_without_its_mirror, the repo's most-recurrent class, committed inside the fix for it. Both detectors now carry a mention-does-not-count test; the old test 'finds it on any statement, not just the first' had PINNED the broken behaviour."

  - id: R1-2
    title: "BLOCKING — the new fifth hook was not installed and Gate 32 could not tell"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "`.git/hooks/` held 4 hooks + pre-merge-commit.sample; Gate 32 hardcoded `hooks/pre-commit` and printed PASS regardless. It mattered more than a missing hook usually would: the reviewer traced that this hook is the ONLY thing anywhere catching a landed OI collision — build_oi_index.dart's duplicate check runs from pre-commit.sh only when the board is STAGED, a --no-ff merge never fires the local pre-commit hook, and it is invoked NOWHERE in CI. So merging would have left the documented defect exactly as true. FIXED both halves: Gate 32 rewritten to DERIVE the hook list by parsing install_hook lines out of setup-hooks.sh (a restated roster rots silently, and always in the reassuring direction), and all five hooks installed. Gate 32 now PASSES naming all five."
    notes: "Its first draft flagged 3 false positives — installed hooks are `cp` copies and do not reference their source path. The anchor is now the source's own first comment line. Deliberately NOT a content-hash comparison: that is OI-104's freshness check, and folding it in would hard-FAIL every commit whenever a hook is edited before the installer re-runs — i.e. during the batch that improves a hook — with a remedy that writes to the COMMON git dir shared by every live session."

  - id: R1-3
    title: "MATERIAL — the new collision gate was a structural no-op at 2 of its 3 documented placements"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "base was merge-base(HEAD, origin/main) and mainline was origin/main, so base == mainline whenever HEAD is at or ahead of origin/main — the state at BOTH the pre-merge-commit placement and CI-on-main. Leg 1 (n NOT IN base) and leg 2 (n IN mainline) then become mutually exclusive and leg 3 is unreachable FOR EVERY INPUT. Proven by construction, not merely reproduced. FIXED: the three points are now chosen from context — mid-merge uses HEAD/MERGE_HEAD/their merge-base; at a merge commit HEAD^1/HEAD^2/their merge-base; otherwise the original branch triple. Three new e2e tests execute a real CLEAN merge (main mints OI-2 on the open board, the branch mints OI-2 on the CLOSED board, so git always combines them without conflict — the shape every real incident took) and assert the gate BLOCKS at both merge placements and PASSES on a non-colliding merge. Mutation: forcing the old triple reddens 10 tests."
    notes: "Every prior e2e scenario ended on `git checkout feature`, so deleting the gate's invocation from pre-merge-commit.sh reddened NOTHING. Also split VACUOUS from UNDETERMINED: when the mainline side minted no number the base lacked, no collision is expressible and that is a genuine PASS (now stated as 'PASS (vacuous)' naming what it read), not a skipped check — putting UNDETERMINED on an ordinary merge would teach the reader to ignore the word."

  - id: R1-4
    title: "MATERIAL — pre-merge-commit.sh's `git add` could not reach the merge commit and left the index dirty"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "git computes the merge commit's TREE BEFORE running the hook, so the regenerated OPEN_INDEX.md landed nowhere (`git ls-tree -r HEAD` confirmed it absent) and was merely left STAGED for the next unrelated commit to sweep in — the cross-session index-mixing shape §4.13 exists to prevent, on the PRIMARY worktree shared by every session, and the exact outcome the hook's own comment claimed to prevent. FIXED: the hook now only READS, restores OPEN_INDEX.md to exactly what the merge produced, and reports (without blocking) when the committed index is stale. New test/scripts/pre_merge_commit_e2e_test.dart executes the real hook as a real git hook: blocks a colliding clean merge, allows a non-colliding one, and asserts NOTHING is left staged or dirty."
    notes: "The restore's first version handled only the file-EXISTED path; the e2e test caught that when OPEN_INDEX.md does not pre-exist the generator creates it and the hook left it untracked on every merge. The common case in this repo is the one that hid the bug."

