  - id: R2-1
    title: "BLOCKING — the collision gate is a no-op in CI, and the round-1 fix RELABELLED that no-op as a checked answer"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "test.yml's audit-gates job (the only job running this gate) used actions/checkout with no fetch-depth, i.e. depth 1. In a shallow clone git reports a merge commit as PARENTLESS, so the merge-shape arm never fires, the branch arm compares HEAD against an origin/main that IS HEAD, and the comparison degenerates exactly as before — now printing 'PASS (vacuous) ... this is a checked answer, not a skipped one', which is worse than the original bug because it reassures. Reproduced end-to-end in a throwaway repo whose main tip is a merge commit carrying a real cross-branch OI-2 collision, with Check A deliberately isolated OUT (both sides mint OI-2 on the OPEN board in widely separated regions, so the merge is clean and only the cross-branch predicate can fire): merged board holds 2 `## OI-2` headings; full clone -> the check runs; --depth 1 clone -> 'PASS (vacuous)'. FIXED on both sides: fetch-depth: 0 on the audit-gates checkout, AND the gate now refuses to call a vacuous result checked when the CI signature is present (shallow AND HEAD == the mainline ref AND no second parent)."
    notes: "The narrowing took three attempts and the first two were wrong in instructive ways. (1) Blanket 'shallow => UNDETERMINED' disabled the check in the REAL repository — this working clone reports is-shallow=true while resolving its merge parents perfectly well, so that traded a false PASS for a permanent SKIPPED: the same loss of coverage wearing an honest label. (2) Narrowing to 'shallow AND branch-arm AND <2 parents' still fired for any branch that has merged main in — the normal local state. What actually identifies the broken case is HEAD and the mainline ref being the SAME COMMIT, which a --depth 1 checkout of main produces and a feature branch never does."

  - id: R2-2
    title: "BLOCKING — the hatch was still granted by a mention on its own LINE inside a heredoc or multi-line commit message"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "splitStatements splits on every newline, so a line inside a heredoc body or an embedded-newline -m message became its own 'statement'; if it happened to START with the incantation, round 1's leading-prefix walk accepted it. Round 1 fixed WHERE in a statement the assignment may sit and never asked whether the 'statement' was executable text at all. Verified against the real hook, A/B against the pre-batch merge-base with controls in both directions: a heredoc body line and a multi-line commit message body line both went BLOCK (pre-batch) -> ALLOW (after round 1) -> BLOCK (now). The heredoc case disarms the whole hook, since the skip-hooks handler exits 0 as soon as it believes it is approved. FIXED with splitExecutableStatements — a quote- and heredoc-aware splitter used ONLY on the ALLOW path; the DENY detectors keep the broad splitter, because over-splitting there can only produce an extra (loud, recoverable) block. 25/25 across both case matrices; mutation (pointing the ALLOW path back at splitStatements) reddens 3."
    notes: "Round 1's tests all used SINGLE-LINE messages, which is why nothing reddened. Multi-line commit messages are this repo's only commit convention — the Co-Authored-By trailer alone guarantees one — so a commit message EXPLAINING the hatch policy would have unlocked it. The new splitter fails toward the deny path by construction: an unbalanced quote yields MORE statements, never fewer."

  - id: R2-3
    title: "MATERIAL — 'derive, don't restate' moved the rot into the parser; Gate 32 could still PASS with a hook missing"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "The install_hook regex requires both arguments double-quoted. Mutation: leave one destination unquoted AND delete that hook -> 'PASS: all 4 hook(s) installed', rc=0. A partial parse read as a complete one — the same reassuring-direction failure the hardcoded list had, one level down. FIXED by cross-checking the structured parse against an independent count of `install_hook` invocations; a mismatch is UNDETERMINED, never PASS. Re-ran the same mutation: now reports '5 invocation(s) but only 4 could be parsed', rc=0 without claiming anything."
