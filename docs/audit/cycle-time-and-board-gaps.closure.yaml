findings:
  - id: T-1
    title: "Every hook invoked Dart through `flutter/bin/dart`, a wrapper that takes the SDK update lock and shells out to git on the Flutter checkout on EVERY call — 17 call sites across 4 hooks, and the lock SERIALIZES the parallel gate loop so its cost scaled with the job count instead of dividing by it"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "Real-hook A/B, same worktree, same gates, both exit 0 and both reporting all gates passed: 182149 ms (wrapper, forced via DART_BIN_OVERRIDE) -> 98447 ms (SDK exe). Second pair under load: 399370 -> 163744. Isolated cause measured directly: bare `dart --version`, which does no work at all, costs 3357/3665/8048 ms via the wrapper and 216/151/220/206/103 ms via the SDK exe. Fix is scripts/_dart_bin.sh, sourced by all five hooks. Mirror test test/scripts/dart_bin_resolver_test.dart (9 tests) — mutation-proven: reverting the gate-loop line to bare `dart run` reddens the pre-commit case, deleting the `. _dart_bin.sh` source line reddens the commit-msg case."
    notes: "TWO hypotheses tested and REFUTED, recorded in _dart_bin.sh's header so nobody re-runs them: (a) Windows Defender — the SDK exe is scanned identically and costs 280 ms, so the cost is the wrapper's own work; (b) the hook's GIT_DIR leak reaching dart.bat's `git rev-parse` — wrapper costs 3916-4113 ms without the leak and 4029-4201 ms with it. Also refuted: raising PRE_COMMIT_GATE_JOBS. It bought ~20% while the wrapper was in the path (lock contention, not parallelism headroom) and nothing measurable after. The approved plan listed that as lever T3; the measurement killed its premise and it was NOT shipped."

