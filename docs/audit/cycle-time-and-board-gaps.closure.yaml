findings:
  - id: T-1
    title: "Every hook invoked Dart through `flutter/bin/dart`, a wrapper that takes the SDK update lock and shells out to git on the Flutter checkout on EVERY call — 17 call sites across 4 hooks, and the lock SERIALIZES the parallel gate loop so its cost scaled with the job count instead of dividing by it"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "Real-hook A/B, same worktree, same gates, both exit 0 and both reporting all gates passed: 182149 ms (wrapper, forced via DART_BIN_OVERRIDE) -> 98447 ms (SDK exe). Second pair under load: 399370 -> 163744. Isolated cause measured directly: bare `dart --version`, which does no work at all, costs 3357/3665/8048 ms via the wrapper and 216/151/220/206/103 ms via the SDK exe. Fix is scripts/_dart_bin.sh, sourced by all five hooks. Mirror test test/scripts/dart_bin_resolver_test.dart (9 tests) — mutation-proven: reverting the gate-loop line to bare `dart run` reddens the pre-commit case, deleting the `. _dart_bin.sh` source line reddens the commit-msg case."
    notes: "TWO hypotheses tested and REFUTED, recorded in _dart_bin.sh's header so nobody re-runs them: (a) Windows Defender — the SDK exe is scanned identically and costs 280 ms, so the cost is the wrapper's own work; (b) the hook's GIT_DIR leak reaching dart.bat's `git rev-parse` — wrapper costs 3916-4113 ms without the leak and 4029-4201 ms with it. Also refuted: raising PRE_COMMIT_GATE_JOBS. It bought ~20% while the wrapper was in the path (lock contention, not parallelism headroom) and nothing measurable after. The approved plan listed that as lever T3; the measurement killed its premise and it was NOT shipped."

  - id: T-2
    title: "The approved plan's headline time lever (T1: add Windows Defender exclusions) rested on an untested hypothesis"
    terminal_state: verified_clean
    verification: "Refuted before any change was made. `dart --version` via the SDK exe costs 103-220 ms on the same machine, with the same Defender real-time protection ON (Get-MpComputerStatus -> RealTimeProtectionEnabled: True). If AV scanning were the cost, both binaries would pay it. No exclusions were added and none are needed."
    notes: "The plan committed to closing T1 either way in one measurement. This is that closure. OI-106's 3.9x local-vs-CI gap therefore still has no tested explanation — the wrapper finding does not explain it either, since CI does not use the wrapper for `dart run` in the gate loop. OI-106 remains OPEN and untouched."

  - id: F-1
    title: "No mechanism anywhere detected an OI number minted by two branches for two different issues — `build_oi_index.dart:114-115` states it outright: there is no allocator, numbers are minted by eyeballing a tail split across two files"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "New gate scripts/check_oi_numbering_unique.dart + pure scripts/oi_numbering_lib.dart. Proven against REAL data, not only fixtures: run against the live colliding branch `oi-session-coordination` it reports OI-128 naming two different issues, prints both titles, and names the next free number (OI-130). 20 tests in test/scripts/oi_numbering_lib_test.dart. Mutation-proven on FOUR legs, each verified as actually applied before its run: dropping stdoutEncoding utf8 reddens 3, dropping the unparseable-board guard reddens 1, dropping LEG 1 (merge-base) reddens 2, dropping LEG 3 (title comparison) reddens 2. Ledger entry added; check_gate_test_ledger passes at 89 gates."
    notes: "Closes the MINT-TIME half of OI-112 and resolves its stated open decision (pre-commit reads a possibly-stale origin/main vs CI is authoritative but late) by doing BOTH with different authority. THREE-point predicate, because a two-point HEAD-vs-main comparison calls every ordinary title edit a collision. The gate shipped with its own bug and it was caught by running it against known-bad real data: Process.runSync defaults to systemEncoding, which mangled the em-dash separator so 0 of 77 headings parsed and the gate reported PASS against an EMPTY mainline board. Fixed at the instance (pin utf8) AND the class (_parseStrict refuses to read an unparseable board as a clean one, and the final verdict says SKIPPED rather than PASS when any input was undetermined)."

  - id: F-2
    title: "`pre-merge-commit` was never installed, so a CLEAN auto-merge ran NO hook at all — the exact shape of the OI collision class, and two places in the repo asserted the opposite"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "Verified absent: `.git/hooks/` held exactly 4 non-sample hooks (commit-msg, pre-commit, pre-push, prepare-commit-msg) against git 2.53.0, which invokes pre-merge-commit for an auto-created merge commit. scripts/pre-merge-commit.sh added and installed by setup-hooks.sh (now FIVE hooks). Runs the two board gates only (~2 s), NOT the 75-gate loop — a merge needs board integrity, not a re-scan of a tree already gated on both sides."
    notes: "The false claims were corrected in the same change: docs/audit/open_issues.md:2426-2428 (OI-112) and docs/diagnoses/2026-08-13-...-b7e3d1.md:56-58, both asserting 'a corrupt board cannot LAND — the merge commit regenerates the index and the gate fires'. Neither was supported by the installed hook set. This is why detection of the 0e4d97cd collision took 3 days 0h 34m and came from a human, not a gate."

  - id: F-3
    title: "`commandInvokesGitSubcommand` anchored at `^git`, so ANY environment prefix bypassed the raw-git block entirely; and `commandUsesWrapper` was a bare substring check, so merely NAMING safe_commit.sh disarmed the guard"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "16-case behavioural probe, all passing: `FOO=1 git commit -m x`, `env FOO=1 git push`, `command git commit`, `\\git commit`, `env -i PATH=/bin git commit` are now all detected; `echo \"use safe_commit.sh\" && git commit -m x` no longer counts as using the wrapper, while all 7 real invocation forms still do. 30 new assertions in test/contracts/git_safety_lib_test.dart. `sudo`/`nohup` deliberately NOT stripped — over-stripping risks a false BLOCK, the one failure mode this hook must not have."
    notes: "Consequence worth stating plainly: the documented hatch `ALLOW_RAW_GIT=1 git commit` had been 'working' only because the hook could not SEE the prefixed command — a detection miss, not an authorization check, which made an accidental bypass indistinguishable from an approved one. And `FOUNDER_APPROVED_NO_VERIFY=1 git commit --no-verify` genuinely did NOT work: the `--no-verify` match is unanchored so the deny still fired, while the env read looked at the hook process's own environment, which an inline prefix never sets. Both hatches now read the inline assignment via inlineEnvAssignment(), so the documented incantation IS the mechanism."

