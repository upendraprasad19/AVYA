    commit: *wip
    verification: "All three reproduced with a control first. (a) _isQuotingTheBan exempted any line containing the substring `banned` — a word §4.2 and the skills use constantly, so a real deferral instruction in the same sentence was invisible; now ONLY the explicit `deu-quote` marker exempts, and the three sites that legitimately quote the rule carry it. (b) _governingDocs() yielded [] when CLAUDE.md and .claude/skills were absent while the PASS message still asserted the set was swept; the gate now COUNTS what it read, says so ('15 governing document(s) swept in full'), and reports UNDETERMINED — never PASS — at zero. (c) a non-zero `git diff --cached` short-circuited the WHOLE gate including the sweep, whose entire purpose is to see what a staged diff cannot; the sweep now always runs. 5 new tests + a positive control, 12 green."
