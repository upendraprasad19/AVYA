      1000-line Edge Function re-rots on the next edit, and this finding is its
      own proof. Comment-only, so no redeploy — but the deployed bundle is now
      comment-drifted from source, so the next ai-proxy deploy's SHA delta is
      expected (relevant only to the byte-identical deploy flow).
  - id: FOB-7c
    title: "ai-media-proxy snapshot cap + FC7 untrusted-data wrapper reported missing"
    terminal_state: verified_clean
    commit: *wip
    verification: "supabase/functions/ai-media-proxy/index.ts:589 (10000-char cap) + :595 (fenceAsData nonce fence)"
    notes: >
      The FOB text is STALE on both counts — no code change needed. Both halves
      are present and documented in that file's own comment block as a
      two-stage closure: an escaping-only fix first, then a later B-pass
