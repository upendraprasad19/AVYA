      rounds, both of which were specifically instructed to attack
      "already-fixed" dismissals hardest, since a confident dismissal is where a
      real bug would hide. Recorded here because
      ship_dark_pending_review.yaml's flip_on_blockers has NO per-item status
      field — FOB-7's four residuals are a single prose `why:` blob — so this
      ledger is the only clean place to carry the terminal state.
