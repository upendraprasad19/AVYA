# Closure ledger — sot-gate-test-stderr
# Gate 40 (validate_audit_closure.dart). One terminal_state per finding; no
# `deferred:` key. closed_count == total_findings.
#
# WHAT PRODUCED THESE: one unexplained main-CI failure on 2026-10-04 (run 37203140849,
# `Expected: <0> Actual: <254>` from a spawned `dart run` gate, stderr never printed), a
# founder go for a test-only diagnostic fix (2026-10-05), two context-blind plan-review
# rounds (docs/plan-reviews/sot-gate-test-stderr.md), three mutation rounds in sandbox
# copies, and the local gate loop. No diagnose-doc: the commit is `test(contracts):`, not `fix:`.
#
# `commit:` on a closed_in_commit row names the batch's single commit: the commit that ADDS
# this file. A commit cannot name its own SHA; find it with
#   git log --diff-filter=A --format=%h -- docs/audit/sot-gate-test-stderr.closure.yaml
# (the merge to main is a --no-ff merge commit; the code commit is its second parent's tip).

