  - id: C3
    title: "the cause of the 2026-10-04 exit 254 (the second sighting of an unexplained spawn-level 254; a7f3d1 was the first)"
    terminal_state: upstream_blocked
    blocker: >
      Not reproducible: 200 of 200 concurrent local spawns exit 0, the file passes under CI=true, the re-run was green,
      and the last 30 failed CI runs hold no unit-test failure and no Actual: <254>. The neighbouring causes are excluded
      by reading (4f2a9e GIT_* leak, c3f8e1 CI environment, c3f9a7 timeout); the hypotheses nobody has tested are a
      concurrent implicit pub get / .dart_tool rewrite and launcher races under load.
    reopen_when: >
      A CI run (or a local run) of ANY test whose spawned `dart` exits 254 fails again. This file's log now carries the
      process's stderr under the failing test; another spawn test's log does not yet (row C5), so read whatever that log
      offers and, if it offers nothing, say so before reasoning about the cause. Do not add a retry first: it would hide
      that evidence.

