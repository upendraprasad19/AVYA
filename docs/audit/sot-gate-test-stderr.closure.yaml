  - id: C5
    title: "the same one call in the OTHER spawn tests, starting with test/scripts/gate_input_family_e2e_test.dart (where a7f3d1's July sighting was recorded)"
    terminal_state: blocked_on_user
    reason: >
      The founder's go named the one failing test ("a one-line, test-only fix so the failure message includes the error
      text if it ever repeats"). Round 2 showed that a7f3d1's sighting (2026-07-27) predates this test file, so the same
      blind spot has already bitten a different test, whose exit-code assertions (r.code, reason strings that never print
