      exit codes (254 = the VM could not compile or load the script, 255 = an uncaught exception).

  - id: C7
    title: "found at the push of the Progress-screen PRO-gate batch: test/scripts/contract_sweep_e2e_test.dart fails 5 of its 7 tests whenever the pre-push sweep runs it, because it inherits CONTRACT_SWEEP_NESTED=1"
    terminal_state: blocked_on_user
    reason: >
      Cause reproduced 2026-10-05. scripts/contract_sweep.dart:31 sets CONTRACT_SWEEP_NESTED=1 on its own `flutter test`
      spawn; the test's _env() (lines 66-76) removes only GIT_*, GITHUB_* and PUSH_BEFORE, so the runner under test
      inherits the flag and exits 0 as "nested" (scripts/contract_sweep.dart:68) without spawning the stub. With
      CONTRACT_SWEEP_NESTED=1 in the environment the file gives 2 passed / 5 failed (the 2 tests that set the flag
      themselves stay green); with no CONTRACT_SWEEP_* variable set it is 7 of 7, as in the full suite and in CI. The sweep
      selects the file whenever a push changes docs/sot_registry.yaml (its content arm keys on the basename of every changed
      non-test, non-prose file, and the fixture writes a file of that name), so every registry-touching push prints
      `WARN: flutter test exit 1` under --warn-only, and OI-220's flip criterion ("one clean batch under --warn-only")
      cannot be met while that holds. The repair is one prefix in the test's environment filter, a pin for it in
      test/contracts/gate_e2e_env_hermetic_test.dart, and a mutation proof. It is a recurrence of the class behind
      feedback_mistake_git_hook_env_leak, so it takes the full diagnose-doc and the two plan reviews (CLAUDE.md sections
      4.4 rule 22 and 4.12), and merging it redeploys the web app. A third pull request beyond the two the founder
      approved needs the founder's go; nothing was changed in that test.

