      predicate reads equipment_needed off the row it was copied from — the same
      datum one step apart, so a WRONG row value passes both. Terminal as
      verified_clean rather than fixed: the genuine independence comes from Gate
      B's prose evidence, which B2 just widened from 117 rows to all 292. A third
      independent source of truth does not exist short of human review, which is
      what Gate B automates. Recorded so no future reader mistakes the oracle for
      independent verification.
