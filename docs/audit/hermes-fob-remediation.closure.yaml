  - id: VC-security
    title: "every security claim the batch made about migration 120"
    terminal_state: verified_clean
    evidence: >
      Live ACL {postgres=X/postgres,service_role=X/postgres}, identical to both
      siblings, proven by ROLE ASSUMPTION inside Postgres rather than by reading
      the catalog: anon_DENIED / authenticated_DENIED / service_role_EXECUTED_ok.
      The file replays safe from scratch against BOTH pg_default_acl grantor
      entries (postgres AND supabase_admin), which the author had not checked.
      search_path pinning sufficient — every table reference is schema-qualified
      AND only pg_database_owner holds C on public, so there is no landing site.
      Every public table has RLS; the definer bypass is aggregate-only. Both
      sibling definer RPCs carry cross-account guards. Security advisor clean.
      OI-78 confirmed still exactly 3 — no 4th instance was added.

  - id: VC-ist
    title: "the IST boundary arithmetic and the 7d window convention"
    terminal_state: verified_clean
    evidence: >
      The double `at time zone` is the correct inverse pair, proven live with a
      boundary table: at 23:59:59 IST yesterday the predicate returns false,
      ground truth returns false, and the UTC-midnight variant returns true — it
      avoids the exact bug shape it was suspected of having. Delta against
      reference 00:00:00. holds_started_7d's rolling window is a verbatim match
      to the 093/101 house convention, which carries the rationale comment.
      Manifest pair-update, replay fidelity (live body byte-identical) and
      migration-120 numbering all clean.

