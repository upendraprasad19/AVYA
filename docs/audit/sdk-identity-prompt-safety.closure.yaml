  - id: B10
    title: The denylist could never be completed, so the design was replaced
    severity: P0
    terminal_state: closed_in_commit
    commit: f402938e
    verification: >-
      Round 2 defeated the character class with five more BMP characters AND
      astral Tag characters that a non-`u` regex structurally cannot match -- each
      Tag char maps to an ASCII byte, so that was a covert channel, not a fence
      trick. The stated premise ("strip category Cf") was also wrong: U+3164 is
      Lo and U+FE00-FE0F are Mn. Replaced with (a) per-call nonce delimiters, so
      forgery requires guessing an unpredictable token, and (b) an allowlist with
      the `u` flag. The two are COUPLED: an allowlist without \p{M} destroys
      Devanagari, and with \p{M} the old adjacency fence would break -- the nonce
      is what allows the policy to be permissive enough for Indic text. Measured
      both ways; both properties asserted.

  - id: B11
    title: Two more raw system-prompt sites, invisible to the file-level gate
    severity: P0
    terminal_state: closed_in_commit
    commit: f402938e
