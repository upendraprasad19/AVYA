  - id: B14
    title: Six smaller defects folded from rounds 1 and 2
    severity: P2
    terminal_state: closed_in_commit
    commit: f402938e
    verification: >-
      Surrogate-pair truncation could emit a lone high surrogate (TextEncoder
      turns it into U+FFFD); the [...truncated] marker was user-forgeable;
      sanitizeJsonForPrompt threw uncaught on BigInt and circular input;
