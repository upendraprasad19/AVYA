  - id: B4
    title: JSON.stringify sites were assumed safe; measurement showed a residual lever
    severity: P2
    terminal_state: closed_in_commit
    commit: 842e813c
    verification: >-
      A Deno probe settled it rather than reasoning about it: JSON.stringify
      escapes LF/CR/C0 but passes U+2028/U+2029/U+0085 through RAW, and those
      render as line breaks to a model. Stringified sites are therefore a real
      but NARROWER exposure needing a different fix — sanitizeJsonForPrompt
      escapes exactly those three and preserves the JSON structure, where
      sanitizeBlock would have destroyed it. A BASELINE test pins the
      measurement so a future V8 change surfaces instead of silently invalidating
      the premise.

  - id: B5a
    title: FC7's untrusted-data boundary was half a fix in ai-proxy
    severity: P1
    terminal_state: closed_in_commit
    commit: 842e813c
    verification: >-
      Recurrence of 9c2d4a. FC7 added an instructional boundary around
      ai-proxy's snapshot concatenation -- correct, but structural escaping was
      never added. Closed with sanitizeJsonForPrompt, then superseded by the
      nonce fence in f402938e.

  - id: B5b
    title: ai-media-proxy had neither half, and the merged B5 entry hid it
    severity: P0
    terminal_state: closed_in_commit
    commit: 57d9dfb8
    verification: >-
      SPLIT OUT BECAUSE THE MERGED ENTRY WAS FALSE. B5 originally covered both
      functions and asserted "Both now carry both [halves]". The B-pass proved
      otherwise: ai-media-proxy still wrapped client-controlled snapshot_json in
      a HARDCODED <user_snapshot> tag, and `<`, `>`, `/` are all \p{P}/\p{S} --
      allowed through by design -- so a field containing the literal closing tag
      closes the fence early. sanitizeJsonForPrompt only re-escapes the three
      Unicode separators; it was never going to close a guessable delimiter.
      It also had NO snapshot size cap despite CLAUDE.md 4.4 rule 18 requiring
      one on every AI endpoint. Both closed: nonce fence + a 10,000-char cap
      throwing a typed 400.

      Kept as its own entry so a partial fix can never again hide behind a
      claim about a pair. A terminal_state asserts real resolution (4.2's
      closed==N invariant); asserting it for two functions when only one was
      fixed is exactly the over-reporting that invariant exists to prevent.

  - id: B15
    title: The coverage gate could not fail -- three real fixes reverted, two passed
    severity: P0
    terminal_state: closed_in_commit
    commit: 57d9dfb8
    verification: >-
      The B-pass reverted three genuine fixes and the gate stayed green for two
      of them (food_parser's fence and ai-media-proxy's principal marker). Root
      cause was the APPROACH, not one bug: v3 traced identifiers to their
      declarations, and every tracing rule needed a text window that either bled
      into unrelated code (false PASS) or truncated the value (false FAIL). Five
      tuning rounds did not converge.

      Rebuilt (v4) on a blunter, checkable contract: a prompt value must be
      VISIBLY safe at its own assignment -- an interpolation-free literal or a
      recognised marker. No tracing. A DECLARATION is now itself a site, which
      removes the ES6-shorthand ambiguity outright; value extraction is a
      balanced-expression scan rather than a window, so multi-line values read
      correctly without bleeding.

      THE DURABLE PART: the gate now TESTS ITSELF. Six synthetic snippets --
      every false-pass shape from v1/v2/v3 -- are asserted rejected, and eight
      legitimate shapes asserted accepted. Every hole this gate ever had would
      have been caught on its first run by that test. Four negative controls,
      each reverting a real fix, now fail the gate by name.

  - id: B6
    title: The fix itself nearly introduced a silent conversation truncation
    severity: P2
    terminal_state: closed_in_commit
    commit: 94f0bf9e
    verification: >-
      Caught by self-review AFTER 842e813c landed. Both conversation sites took
      sanitizeBlock's default kBlockMaxLen of 8,000 chars; neither had ANY
      character cap before, so the fix silently introduced one. Measured rather
      than guessed — ai_coach_interactions by user and IST day, 47 user-days:
      max 5,668 chars, p95 1,801, avg 541, ZERO above 8,000, max 9 turns/day.
      So not an active regression, but 1.4x headroom is too thin: the upstream
      bound is .limit(30) turns and ai-proxy caps one user_message at 5,000
      chars. The failure mode is what made it worth fixing — truncation is
      disclosed to the model but invisible to us, so daily-snapshot would extract
      a profile from half a conversation and write it to user_profile. Both sites
      now pass maxLen 32000 explicitly (~5.6x observed max, ~18x p95).

  - id: A5
    title: The first sign-out fix was itself a regression that killed provider invalidation
    severity: P0
    terminal_state: closed_in_commit
    commit: 39a092d1
    verification: >-
      Review round 1. unbindSessionIdentity nulled all three static
      onStateChanged callbacks, but app.dart:45/59/76 is the ONLY install site
      in lib/ (grep-verified) and ICanBeFitterApp is constructed once per
      process, so initState runs ONCE for the app's lifetime and
      _ensureLocalUser never re-installs. Nulling on sign-out therefore killed
      invalidation permanently for every later sign-in in the same process --
      silently, because every call site uses `onStateChanged?.call()`. That
      reintroduced APK #12.2, #12.4 and OI-37. OI-51's sub-finding 4 is wrong on
      its premise: the closure captures the process-lived ProviderScope ref, not
      a user, so the correct number of clears on the sign-out path is ZERO.
      Reverted; the test now asserts the INVERSE with the three bug ids in its
      failure reason.

