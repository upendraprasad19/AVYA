  - id: HOOK-1
    title: "The installed git hook is a COPY of scripts/pre-push.sh: each clone keeps the old behaviour until `sh scripts/setup-hooks.sh` is re-run"
    terminal_state: blocked_on_user
    reason: >
      check_hooks_installed.dart only WARNS on drift. After this batch merges, `sh scripts/setup-hooks.sh` must run on every clone: this machine
      (the agent runs it from Bash, which has `sh`, once the founder gives the merge go) and the VPS clone (founder; the founder's PowerShell has no `sh`).
      Documented in docs/architecture/hooks.md.

  - id: OI275-A
    title: "OI-275 acceptance A (a version-only diff classifies below account so pre-push skips the suite)"
    terminal_state: verified_clean
    evidence: >
      Not built as worded, deliberately (plan section 3): after this batch a bump's BRANCH push is analyze-only and the merge happens on GitHub, so a
      content-aware classifier would help only a direct push of a bump to main, which keeps the full suite by design (fail-safe). It would also add an
      env var needing a spawn_env_manifest classification and a second classifier path next to a gate with four prior failed attempts. B2 delivers the
      remaining value (no plan-review record / B-pass for a bump merge). Recorded on the OI-275 board entry.

