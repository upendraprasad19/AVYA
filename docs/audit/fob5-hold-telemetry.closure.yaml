  - id: FOB-5-K
    title: "the a9d3f1 anon-exec regression test pins migration 103 BY NAME and is blind to 120"
    terminal_state: closed_in_commit
    commit: *wip
    verification: test/contracts/admin_metrics_functions_role_revoke_test.dart
    notes: >
      Found by the B-pass, and it is the mirror of FOB-5-E rather than a repeat
      of it. E fixed the LIVE ACL and hardened the .sql file; K is about the
      GUARD. admin_metrics_functions_role_revoke_test.dart asserts that
      migration 103 carries the role revokes — but 103 is no longer the
      migration that owns the ACL. Migration 120 DROPs and recreates
      founder_metrics_engagement, so on any replay past 120 the protection comes
      from 120's own revoke lines; delete them and the anon-readable
      business-metrics leak reopens while the existing test stays green. That is
      a guard whose subject moved out from under it.
      Closed by a second test in the same file, written against the MIGRATION
      SET rather than a named file: every migration numbered >103 that creates
      or drops a public.founder_metrics_* function must re-assert the
      anon+authenticated revoke for each function it touches. Cutoff is >103
      because 101 IS the historical bug (creates all three with no role revoke)
      and 103 is its fix — neither may be rewritten. Future-proof: 121, 122 …
      are covered on arrival with no edit.
      Mutation-proven BOTH ways: deleting migration 120's revoke line reddens
      the new test (control green, mutant red, restored green, verified
      byte-identical after restore), and the scan carries a `checked > 0`
      assertion so it cannot silently pass by matching nothing — the Gate-44
      shape rule 24 exists to make impossible.

      ⚠ CORRECTED 2026-08-20 (Hermes P1-C). The paragraph above is accurate but
      was over-read as "this guard holds". It proved the guard catches a DELETED
      revoke. Two independent reviewers then found three mutations it did NOT
      catch, all of which reset the ACL and ship an anon-executable SECURITY
      DEFINER function on replay:
        * the revoke HOISTED above the DROP+CREATE (position, not presence —
          default privileges reapply at CREATE, so an earlier revoke is
          discarded);
        * `drop function if exists public.fn;` with no arg-list parens;
        * `create or replace function fn()` unqualified, resolving to public
          via search_path.
      A fourth mutation went the other way: `from authenticated, anon` —
      identical SQL, identical effect — falsely REDDENED, because the role list
      was matched as an ordered pair.
      The `checked > 0` guard did not help and could not: migration 120 keeps
      the count above zero forever, so a future migration written either way is
      silently unscanned while the assertion still passes.
      All four are fixed and re-mutated in commit 665790f. The lesson kept: a
      mutation set built only from "delete the protection" proves the guard sees
      ABSENCE, and says nothing about whether it sees a REORDERING or a
      RESPELLING of the same protection.

  - id: FOB-5-L
    title: "nothing connected the Dart event name to the SQL predicate that reads it (cross-language writer/reader drift)"
    terminal_state: closed_in_commit
    commit: *wip
    verification: test/contracts/hold_telemetry_writer_reader_parity_test.dart
    notes: >
      §4.1 names writer/reader drift the DEFAULT suspect class, and this seam is
      unusually exposed to it because the two halves are not even in the same
      language: Dart emits 'hold_week_started' into user_message via
      Map.toString(), and migration 120 reads it with
      `user_message like '%hold_week_started%'`.
      Rename the event in Dart and NOTHING fails — the Dart tests still pass
      (they assert whatever the writer now emits), the SQL stays valid, the
      migration still applies, and all three hold_* columns silently return 0
      forever. The failure is invisible precisely when it would be introduced:
      0 is the CORRECT reading while enable_hold_weeks is OFF, so "broken" and
      "working as intended" are the same number.
      Closed by a parity test that reads BOTH sides and compares them. Three
      cases: the emitted name must be the matched name; exactly 3 predicates
      must key off it (a 4th column left on a stale string would read 0 beside
      working siblings — the hardest shape to spot); and AppEventsService's
      _channel literal must be the channel the hold metric filters on AND must
      stay OUT of the coach-message channel set.
      Mutation-proven on all three legs, files verified byte-identical after
      restore: renaming the event in Dart only reddens 2; leaving one column on
      a stale string reddens 1; readmitting app_event into the coach-message set
      (which would reinstate the 5.3x overcount FOB-5-A removed) reddens 1.
