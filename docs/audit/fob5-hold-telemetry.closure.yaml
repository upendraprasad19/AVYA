  - id: FOB-5-I
    title: "the telemetry emit could fail a COMMITTED hold and skip its durability push"
    terminal_state: closed_in_commit
    commit: *wip
    verification: *t
    notes: >
      Introduced by this batch. The emit sat inside holdWeek's try, whose finally
      only clears the mutex, so a SYNCHRONOUS throw from AppEventsService.log
      would escape after the hold was already committed to Hive — surfacing a
      materialized hold to the caller as a failure AND skipping the durability
      push that runs past the finally. The code comment asserted "log never
      throws", but that is a property of a different file that nothing pinned,
      and this batch had just added a new statement to that very method. Closed
      with a local try/catch so the invariant is enforced at the call site.
      Mutation-proven: the regression test sets debugCapture to an UNMODIFIABLE
      list so add() throws UnsupportedError; removing the try/catch reddens it on
      the holdWeek() await itself.

