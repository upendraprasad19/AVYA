  - id: F20
    title: "Gate non-vacuity — a gate that passes because it checks nothing is the failure mode this repo has already shipped (2026-07-29, a9f2c6: three gates exited 0 while doing nothing)"
    terminal_state: verified_clean
    evidence: "Negative control run: injecting `supabase.from(\"users\").select(\"id\")` into expiry-reminder makes the gate exit 1 and name the file:line; removing it returns exit 0. The gate also fails closed (exit 1) if CRON_REGISTRY.md ever parses to zero functions, rather than reporting a vacuous pass. 5 explicit `// oi79-ok:` waivers, each with a written justification, and the count is printed on every clean run so they cannot accumulate unseen."
