    verification: "notification_prefs_server_guard_test.dart gained `_latestDescSnapshot()`, which accepts the literal form OR the `{ column: \"snapshot_date\", ascending: false }` descriptor and is used by BOTH affected assertions; audit_2026_06_07_batch6_server_test.dart:84 got the equivalent two-form check for completed_at. NOT a relaxation — negative-controlled twice: (a) flipping the descriptor to `ascending: true` (ordering still PRESENT, merely inverted) fails the date-pin test, (b) deleting the completed_at sort key fails F43. Both source files restored byte-identical after the controls (`git diff --stat` empty). The `.eq(\"snapshot_date\"` date-pin prohibition is untouched. Verified NOT a real regression first: weekly-recap-ready:53 reads prefs from the snapshotMap built at :177-191, which carries snapshot_date DESC — the guard is live, the assertion was stale."
