  - id: F23
    title: "check_unbounded_cron_reads reported rolling-context/index.ts:269 as an unbounded read when it is correctly paged — a multi-line GENERIC ARGUMENT (`fetchAllPages<{ id: string; ... }>(`) puts the helper name 8 lines above the `.from(`, outside the 6-line lookback"
    terminal_state: closed_in_commit
    commit: "oi79-paged-cron-reads branch (uncommitted at authoring; SHA back-filled at commit)"
    verification: "F18's tooth biting a second time: that finding fixed the PATTERN (`fetchAllPages\\s*\\(` -> `\\b`) and left the DISTANCE wrong. Fixed structurally — see F24. Clean-tree run is green and rolling-context is no longer flagged."
  - id: F24
    title: "MY FIRST FIX FOR F23 WAS WRONG and introduced a false NEGATIVE. Widening the lookback 6->15 lines made the gate inherit bounded-ness downward: an unpaged read a few lines BELOW a paged one was silently skipped"
    terminal_state: closed_in_commit
    commit: "oi79-paged-cron-reads branch (uncommitted at authoring; SHA back-filled at commit)"
    verification: "Caught by building the negative control that specifically targeted the widening (the first control I wrote was too weak — it planted the read 23 lines away, outside even the new window, so it proved nothing and I said so). The real control: `.from(\"users\").select(\"id\")` injected 11 lines under expiry-reminder's fetchAllPages -> gate reported OK. In a safety gate a false negative is strictly worse than the false positive it was meant to cure. Replaced line-distance entirely with `_helperCallRanges()` + `_matchingParen()`: a read is bounded iff its offset falls INSIDE the helper call's balanced-paren argument list (string literals skipped so a paren in a `label:` cannot unbalance it). Both directions re-verified after the rewrite — clean tree PASSES (F23's multi-line generic recognised), injected-below-helper read FAILS naming expiry-reminder/index.ts:73. Line distance is retained ONLY for `// oi79-ok:` waiver lookup, where prose distance is the right unit."
  - id: F25
    title: "paged_fetch.ts's own docstring example cited `coach_memory.gte(\"score\")` — no such column; the real one is `dropout_risk_score` (re-engagement/index.ts:146). A copy-paste-ready example naming a column that does not exist"
    terminal_state: closed_in_commit
    commit: "oi79-paged-cron-reads branch (uncommitted at authoring; SHA back-filled at commit)"
    verification: "Corrected to dropout_risk_score and deliberately kept on ONE line so check_schema_column_refs keeps validating it. Worth stating plainly: that gate does NOT strip comments, and this is the second time this batch a comment reached a source-grep matcher (cf. F19, where I fixed exactly that in my own gate). Here it is NOT a defect — it made a doc example schema-checked and caught a real documentation error. Left as-is rather than 'fixed': changing the parser of the gate that guards 841 column refs across lib/ + Edge Functions, to suppress a behaviour that just did useful work, would be a net loss. Judgement informed by F24 — a late, small-looking gate change is exactly what went wrong there."

