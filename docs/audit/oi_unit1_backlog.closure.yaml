      e.toString().contains('function'), which that message satisfies, so it
      calls markTestSkipped. CI stays GREEN while three live-DB tests silently
      evaporate — trading a P3 attack surface for a silent coverage hole.
    reopen_when: >-
      pgvector_test.dart's catch distinguishes a permission error from a
      missing-function error (or the test is moved to a service-role path, or
      deliberately deleted), AND the founder gives the separate explicit go for
      a live migration apply that §4.3 requires.
    reason: |
      Two further prerequisites recorded so the next session does not
      rediscover them:
      (1) use migration 117's role list (REVOKE FROM PUBLIC, anon, authenticated),
      NOT 091's PUBLIC-only form, which migrations/CLAUDE.md documents as
      insufficient because Supabase grants EXECUTE to anon/authenticated DIRECTLY
      via pg_default_acl — and note 046:50 holds an explicit prior GRANT to
      `authenticated` on morning_alert_pick_quarter that a PUBLIC-only revoke
      cannot touch;
      (2) the phrase "security definer" anywhere in the migration's FILENAME OR
      BODY, comments included, escalates it to catastrophic tier via
      blast_radius_content_rules_lib.dart — plan for that or phrase around it
      deliberately, do not discover it at push time.

