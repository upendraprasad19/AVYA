  - id: OI-98
    title: notification preferences are push-only; a reinstall overwrites the server copy with all-enabled
    terminal_state: blocked_on_user
    reason: |
      Found while writing OI-75's registry entry — Gate 11 demanded a
      `restore_methods:` list and there was nothing truthful to put in it.
      notification_preferences is written into the snapshot (sync_service.dart:842)
      and never read back; the only snapshot_json read (:1763-1776) selects
      fitness_summary. So on reinstall userBox is empty, emissionMap() emits every
      key enabled (its documented default), and that OVERWRITES the server's stored
      preferences — an active destruction of the user's choices, not a silent
      non-restore, and the ABSENT => SEND rule means it always fails toward
      sending MORE.
      Held for a decision rather than fixed here for two reasons. (1) The exact
      ordering on a real reinstall — whether any restore repopulates userBox before
      the first pushSnapshotNow — was NOT traced, and the fix design depends on it.
      (2) The durable fix is arguably to distinguish "never set" from "set to
      enabled" in the emitted shape, which is a server-contract question, not a
      client one — and this is an `account`-tier sync-path change, a different
      review posture from this feature-tier unit.

