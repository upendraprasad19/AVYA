  - id: OI-78
    title: 3 public-schema RPCs retain the PUBLIC-default-ACL EXECUTE gap
    terminal_state: upstream_blocked
    blocker: >-
      test/edge_functions/pgvector_test.dart's error-swallow must be tightened
