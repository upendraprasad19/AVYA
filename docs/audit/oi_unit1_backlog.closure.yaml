  - id: OI-96
    title: community promotion has two mechanisms; the trigger may starve the cron's copy step
    terminal_state: blocked_on_user
    reason: |
      Needs a PRODUCT decision before any code moves: should the SECURITY
      DEFINER trigger own promotion, or the cron? Both use threshold 10, and the
      cron skips rows the trigger has already flagged `approved = true` — the
      step that copies into food_database / exercise_library and notifies the
      submitter sits AFTER that skip. Read literally the trigger always wins and
      the copy never runs.
      Explicitly recorded as UNPROVEN: with 0 approve votes ever cast the
      interaction has never executed, so this is a reading of two definitions,
      not an observed failure. Filed with the reproduction steps needed to
      confirm it, plus a separable traceability gap — the trigger is defined
      cloud-only and appears in no migration, so its body is recoverable only by
      querying pg_proc.

