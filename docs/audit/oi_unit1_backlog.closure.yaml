# docs/audit/oi_unit1_backlog.closure.yaml
#
# Closure ledger for the Unit 1 backlog batch (branch claude/work-session-3rqcp5,
# 2026-08-07). Required by CLAUDE.md §4.2: any batch of >= 4 findings/units
# produces a ledger where EVERY entry carries a terminal_state and no entry
# carries a `deferred:` key, so closed == N is structural rather than asserted.
#
# NOTE for whoever audits this: Gate 40 (validate_audit_closure.dart) SKIPS when
# no closure file exists — omitting this ledger would have been a silent
# invariant violation, not a red gate. It is written because the rule requires
# it, not because a script demanded it.
#
# SCOPE. The user asked about 9 backlog items. Two independent context-blind
# plan reviews (§4.12) found material defects in six of seven actionable ones,
# and the user then scoped this session to Unit 1. The remaining items are NOT
# deferred — §4.2 bans that, including its euphemisms. They are recorded below
# with the terminal state they actually have: `blocked_on_user` where a human
# action is the only thing that can advance them, and `upstream_blocked` where a
# named prerequisite must land first. Each names its blocker and its
# reopen_when explicitly, so no entry can read as "we ran out of time".

batch: oi-unit1-backlog
branch: claude/work-session-3rqcp5
date: 2026-08-07
blast_radius: platform
closed_count: 15
total_count: 15

# Same convention as oi-mechanism.closure.yaml: the ledger is authored in the
# same commit as the fixes, so no SHA exists yet at authoring time.
_commit: &wip "claude/work-session-3rqcp5 (uncommitted at authoring)"

