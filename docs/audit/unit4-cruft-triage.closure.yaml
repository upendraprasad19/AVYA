  - id: U4-1
    title: "2 qualification-exam plan docs existed ONLY as untracked files in the primary working tree — never committed anywhere in git history, so a `git clean` or a disk loss would have destroyed them outright"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "`git log --all --oneline -- <path>` returned EMPTY for both files, confirming they were in no branch, no stash, no reflog-reachable commit. They were also already staged (`A `) in the `qualification-exam-plans` worktree, and those staged copies were confirmed md5-identical to the primary copies (4505a51d… / 8510f51b…) before consolidating here — so nothing was lost by committing from this branch instead of that one."
    notes: "Committed to their normal location docs/superpowers/plans/, NOT archived — they are plan documents for work that is still live (the `qualification-exam` branch is one of only 4 branches not merged into main)."

  - id: U4-2
    title: "68 files of Edge Function payload-backup churn sitting uncommitted — 57 untracked (new deploy versions + 12 entirely new function directories) plus 11 tracked files deleted from the working tree"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "Synced file-by-file from the `git status --untracked-files=all` list rather than by a wholesale directory copy (a wholesale copy cannot express the 11 deletions). Staged result reconciles exactly: 55 A + 9 D + 2 R = 66 entries, where the 2 renames each consume one addition AND one deletion — 55+2 = 57 additions, 9+2 = 11 deletions. git paired those 2 as renames at 66% similarity (an old payload version renamed to a new version name)."
    notes: "These are deploy-history artifacts of the documented host-shell deploy flow (CLAUDE.md §0), not junk."

