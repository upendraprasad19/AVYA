    notes: "Archived rather than committed live because each is a point-in-time artifact of landed work; keeping them at their original paths would imply they are current guidance. SAFETY CHECK on moving `docs/plan-reviews/opt-a-rls-initplan.md` — that directory is read by the keystone gate, so this was verified rather than assumed: the `opt-a-rls-initplan` branch is ALREADY MERGED into main (so its landing is long since pushed and outside any future pushed range), and the gate reads records via `git show <merge>:<path>` from the merge commit's own tree — this file was never committed, so no merge tree ever contained it and nothing that already passed can retroactively fail. The other two candidate branch names (`community-review-fix`, `unit3-web-ux`) do not exist as branches at all."

  - id: U4-5
    title: "`.gitignore` rule for the deno-materialised zod artifact could NEVER match what deno actually produces — written as `node_modules/zod/` with a trailing slash, which in gitignore semantics matches a DIRECTORY only, while deno writes a 34-byte symlink STUB (an ordinary text file) on this Windows/Git-Bash stack"
    terminal_state: closed_in_commit
    commit: *wip
    verification: "Before: `git check-ignore -v node_modules/zod` returned NO match. After dropping the trailing slash: matches at `.gitignore:163`. Confirmed by creating a file at that exact path, running check-ignore, and removing it. Separately confirmed the 142 deliberately-vendored node_modules files remain tracked and unaffected (`git status --porcelain node_modules/` empty)."
    notes: "The original plan proposed DELETING node_modules/zod. That would have been cosmetic — the next local deno run recreates it, and the entry would reappear as untracked noise exactly as it has been. Widening the pattern is the durable fix, so the stub is left in place. The block's own repair line already read `rm -f node_modules/zod` (`-f`, i.e. a file), so the file-shape was known; only the pattern was wrong."

