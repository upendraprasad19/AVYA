  - id: U4-4
    title: "13 superseded review/audit artifacts untracked in the primary folder: 7 quarterly-audit per-lens deltas, 1 plan-review record, 5 review outputs for already-merged work"
    terminal_state: closed_in_commit
    commit: *wip
