# Closure ledger — day-swapper-sync-load batch (OI-237)
# Gate 40 (validate_audit_closure.dart). One terminal_state per finding; no
# `deferred:` key. `closed_in_commit` entries cite the specific SHA(s) that
# landed the fix (see each commit's own diagnose-doc for the full mutation
# evidence); a batch this large cites per-finding SHAs rather than one
# branch-wide pointer, since the six bugs and ~26 review findings each landed
# in different tasks across three waves.
#
# Findings come from four sources: the six diagnose-docs' own bugs (Task 1),
# plan-review round 1 on the drafted plan (16 findings, 2 P0/8 P1/6 P2),
# round 2 on the hardened plan (21 findings, 1 P0/7 P1/13 P2), round 3 scoped
# to the round-2 corrections (3 findings), and the plan-time deviations that
# changed behaviour from the spec (D2, D3, D5, D7, D8, D9 — D1/D4/D6/D10-D19
# are process/API-shape notes with no independent finding to close here; see
# docs/superpowers/plans/2026-09-26-day-swapper-sync-load.md's own deviations
# list for all 19). Plan-review findings whose fix changed the PLAN TEXT
# before any implementer wrote code are `verified_clean` (no fix commit
# exists because the shipped code never had the defect); findings whose fix
# is a discrete post-hoc code change are `closed_in_commit`.
#
# bpass_review was deliberately left `pending (Task 33)` until the review file
# existed (pointing at a file before it exists is the anti-pattern
# docs/audit/unitb-deload-reason.closure.yaml finding B3 warns against). Task
# 33 wrote it in the same commit as this line; its 12 findings carry their own
# terminal statuses there (10 fixed in 2675345b, 2 verified_clean).

