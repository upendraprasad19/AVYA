          would 400 on the 10K server limit for historical queries.
      - file: lib/features/ai_coach/providers/ai_coach_provider.dart
        line_range: 439-697
        method: AiCoachNotifier._sendMessage retry path + media path
        semantic: pass-through
        fields_read: [<full context map>]
        notes: |
