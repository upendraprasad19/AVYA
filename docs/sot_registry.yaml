      PROGRAM week (getProgramWeek, 1..12 — "true deployment progress"), NOT a
      stored counter. The Hive progress['current_week'] field remains a frozen
      constant 1 (six literal-1 writers, no incrementer) and is deliberately
      vestigial: it is re-hydrated by the restore merge but read by nobody (the
      two Train fallbacks train_provider.dart:531/760 are dead code because
      getCurrentWeekNumber() floors at 1). SAME-NAME divergence is intentional:
      the cloud column = program week 1..12; the Hive field = frozen 1.
      Kill-switch disable_program_week_projection (default-ON) restores the
      pre-fix behaviour byte-identically. Diagnose c9f4a2. NOTE the accepted
      coherence split — the in-app Train banner shows phase week (1..4) while
      this column + the coach snapshot show program week (1..12); reconciling
      the banner is week-model work, out of scope here.
    writers:
