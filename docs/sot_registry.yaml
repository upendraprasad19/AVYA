        method: resolve (decay seam) + _detrainingFactor
        notes: base = top.weight × _detrainingFactor(top.dateStr); replaces top.weight in all 4 reps-rule refs; Epley from original; behind detrainingDecayEnabled
      - file: lib/shared/repositories/plan_engine/plan_engine_flags.dart
