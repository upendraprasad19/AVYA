      Every exit branch — success / Gemini failure / JSON parse failure —
      MUST `await` the placeholder UPDATE to a terminal `model_used` value
      (real label / 'failed_gemini' / 'failed_parse'). Pre-fix only the
      success path UPDATEd fire-and-forget, and the 2 failure paths just
      returned err() → 8 stuck `pending` rows accumulated 2026-05-11→15.
