  - concept: ai_proxy_placeholder_resolution
    domain: ai_coach
    description: |
      `ai-proxy` food_text_analysis branch reserves a placeholder row
      BEFORE calling Gemini (so the rate-limit trigger can count atomically).
      Every exit branch — success / Gemini failure / JSON parse failure —
      MUST `await` the placeholder UPDATE to a terminal `model_used` value
      (real label / 'failed_gemini' / 'failed_parse'). Pre-fix only the
      success path UPDATEd fire-and-forget, and the 2 failure paths just
      returned err() → 8 stuck `pending` rows accumulated 2026-05-11→15.
    writers:
      - file: supabase/functions/ai-proxy/index.ts
        line_range: 190-380
        method: resolvePlaceholder helper inside food_text_analysis branch
        notes: |
          The helper closes the placeholder on every exit. Awaited (not
          fire-and-forget) — one extra round-trip is worth the orphan
          elimination.
    reader_manifest_complete: true
    readers:
      - file: lib/core/services/sync/sync_coach.dart
        line_range: 60-205
        method: _syncCoachInteractions (push side cross-channel dedup)
        semantic: flag-check
        fields_read: [id, channel, user_message, created_at]
        notes: |
          5-min SELECT lookback on push so a client Hive entry doesn't
          create a sibling row for an already-resolved server placeholder.
          Skip-on-real-UUID guard prevents double-write entirely.
      - file: lib/features/ai_coach/repositories/ai_coach_repository.dart
        line_range: 462-540
        method: saveInteraction (60s client dedup window)
        semantic: flag-check
        fields_read: [user_message, mode, media_url, created_at]
        notes: |
          Client-side dedup: same (user_message, mode, media_url)
          within 60s of an existing entry UPDATEs instead of inserting.
          Companion to the server-side placeholder dedup.
      - file: lib/features/ai_coach/providers/ai_coach_provider.dart
        line_range: 76-130
        method: ChatHistoryNotifier (display surface)
        semantic: historical-series
        fields_read: [model_used, ai_response, created_at]
        notes: |
          Consumer of resolved placeholder rows. failed_gemini / failed_parse
          terminal model_used values render as error bubbles with retry CTA.
    regression_test: test/contracts/ai_proxy_placeholder_resolution_test.dart
    cloud:
      table: ai_coach_interactions
      columns: [model_used, ai_response, tokens_used]
    class_constraints: |
      Placeholder-row pattern: any reservation BEFORE an external call
      must resolve on EVERY exit branch. Fire-and-forget shortcuts produce
      orphan classes — explicitly banned for this surface.

  # ─────────────────────────────────────────────────────────────
  # OI-02 canonical READ services — 2026-05-17
  #
  # Mirror the writer-side WorkoutWriteService / NutritionWriteService /
  # HealthWriteService pattern. The PR-cumulative-bug surfaced on
  # APK +27 (2026-05-16) was the canonical instance of the gap these
  # close: the per-set MAX semantic was re-implemented in 2 places and
  # diverged silently. Centralising prevents the next divergence.
  # ─────────────────────────────────────────────────────────────

  - concept: workout_read_service
    domain: workout
    description: |
      Canonical READ service for workout-domain Hive surfaces.
      Owns the per-set MAX semantic (best reps / duration / weight),
      `exlog_*` row IST date extraction, and the indexed
      exercise-logs-for-date lookup. Every reader that needs "best
      single-set value across a logged exercise" delegates here.
    writers:
      - file: lib/core/services/workout_read_service.dart
        line_range: 1-182
        method: WorkoutReadService (static + instance methods)
        notes: |
          Reads only — the "writer" label here is the canonical owner
          of the per-set MAX semantic. Storage writers (the row
          producers) are listed under `exercise_personal_records`,
          `workout_receipt_rendering`, etc.
    reader_manifest_complete: true
    readers:
      - file: lib/features/train/repositories/workout_repository.dart
        line_range: 610-700
        method: loadAllExercisePRs
        semantic: per-set
        fields_read: [via WorkoutReadService.bestPerSetReps / .bestPerSetDuration / .bestPerSetWeight]
      - file: lib/features/train/screens/train_screen.dart
        line_range: 885-895
        method: _buildExpandedExercises
        semantic: per-set
        fields_read: [via WorkoutReadService.bestPerSetReps / .bestPerSetDuration]
    regression_test: test/contracts/workout_read_service_per_set_semantic_test.dart
    class_constraints: |
      No file outside this service may re-implement `bestPerSet*` for
      `exlog_*` rows. The pre-OI-02 state had `loadAllExercisePRs`
      inline math + file-private `_bestPerSetReps` / `_bestPerSetDuration`
      in `train_screen.dart` — both deleted in the OI-02 batch.

  - concept: nutrition_read_service
