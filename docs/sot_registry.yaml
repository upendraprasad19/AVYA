        line_range: 783-918
        method: restoreFromCloudForUser
        semantic: aggregated
        fields_read: [<orchestrates all _restore* methods>]
        notes: |
          Canonical post-auth restore funnel. Pulls user_profile +
          user_progress + workout_logs + exercise_logs + scheduled
          + templates + streaks + nutrition_logs + water + saved meals
          + measurements + sleep + steps + custom items + interactions
          + coach_memory + 3 restore-completeness surfaces (freezes,
          inbox, diet plan) + rank_promotions (last 20). Folds
          SubscriptionService.verifyFromServer(force: true) as final
          step. Uses _safeRestoreOp wrapper to keep one surface's
          failure from aborting the rest.
