        fields_read: [authUid, hiveOwner]
        notes: |
          Watches authStateProvider + hiveSessionOwnerProvider for reactivity.
          authUid is read LIVE from SupabaseService.currentUser (the SAME source
          wrapUserScopedBox uses, so the gate and the box agree) — NOT via the
          cached currentUserProvider. OBS-6 residual (a7f2e1, 2026-07-02):
          currentUserProvider is a plain non-reactive Provider that caches on
          first read and is never invalidated → on an account switch it stayed
          stale → authUid != hiveOwner → token stuck '<anon>' → every mixin tab's
