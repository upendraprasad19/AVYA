    domain: workout
    behavioral_test_path: test/contracts/hold_display_read_path_test.dart
    description: |
      How a materialized hold week becomes VISIBLE (hold-display batch, Slices
      2-6). holdWeek() stamps is_hold + hold_ordinal on each schedule_* row;
      this is the read half.

      Hold weeks are addressed by ORDINAL and DATE, never by week index. The
      writer stamps week = 4 + ordinal, but CurrentPlanData.weeks only ever
      holds the phase's 4 weeks (train_provider hardcodes totalWeeks = 4 for
      phase <= 1), so getWeek(5) is empty — a hold week is invisible to every
      week-index-keyed reader. That is why the today card takes a date-sourced
      branch and the H chips never drive selectedWeekProvider.

      The deload cadence is NOT stored: the writer computes `n % 4 == 0` only
      to pick a source week. isDeloadHold(n) is the display-side half of that
      contract and MUST mirror it.

