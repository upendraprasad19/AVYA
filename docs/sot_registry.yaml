# Source-of-Truth Registry
# =========================
# Machine-readable index of every "single reader / single writer" concept
# in the AVYA codebase. Each entry names the canonical writer(s) and
# reader(s) by file:line and the regression test that pins them.
#
# Bootstrapped 2026-05-06 (APK Test #12.6 batch) from CLAUDE.md sections:
#   - "Source of Truth Rules (NON-NEGOTIABLE)"
#   - "Hive field-name contract"
#   - "Sync fan-out contract"
#   - "Restore-completeness sync"
#   - "Single-source-of-truth files" bullet list
#
# Process rule (CLAUDE.md §6 + feedback_source_of_truth_audit.md):
# Every bugfix involving a render/state mismatch must NAME the writer(s)
# AND reader(s) by file:line BEFORE proposing a fix. Patching only the
# reader is the recurring anti-pattern (Tests #8 → #12, same class).
#
# Updating this file:
#   1. New SoT-bearing concept added → append entry here in same PR.
#   2. Writer or reader file/line moved → update entry.
#   3. Field rename in a WriteService → update class_constraints AND the
#      regression test in test/contracts/.
#
# Enriched 2026-05-10 (Task 2.1 — APK Test #13 process-discipline batch):
#   - 19 existing concepts: added hive/cloud/sync_methods/restore_methods/
#     provider_invalidation_set/telemetry/ist_sites/forbidden_legacy_patterns
#     fields where grep-confirmed truthful.
#   - 14 new concepts appended (total: 33).
#
# Reader-side audit 2026-05-16 (post APK +27 install bug batch):
#   - `readers:` arrays previously listed 1-2 sample readers each. Now
#     enumerate EVERY callsite that reads the concept's storage key,
#     with explicit semantic per reader.
#   - New required field per reader: `semantic` ∈ {per-set, cumulative,
#     latest, max, first-only, flag-check, display-only,
#     pass-through, historical-series, aggregated}.
#   - New required field per concept: `reader_manifest_complete: true`
#     once exhaustive enumeration done. Gate
#     `scripts/check_reader_manifest_complete.dart` fails when a code-
#     grep-found reader is missing from a manifest-complete concept.
#   - Bootstrapped from 3-agent reader inventory dispatched 2026-05-16
#     (workout/nutrition/health-profile-AI domains).

concepts:

  - concept: workout_receipt_rendering
    domain: workout
    description: |
      Per-set chip Wrap rendered after a completed workout.
      Reads from Hive exlog_* keys via the indexed lookup; deduplicates
      exercises by name, sums sets, takes max weight. Optional
      workout_log_id filter scopes a multi-session day.
    writers:
      - file: lib/core/services/workout_write_service.dart
        line_range: 1-260
        method: logExercise
        notes: stamps workout_log_id on every exlog row (Test #12 / Task A-3)
    reader_manifest_complete: true
    readers:
      - file: lib/features/train/widgets/workout_receipt_card.dart
        line_range: 288-497
        method: WorkoutReceiptData.fromExerciseLogs
        semantic: aggregated
        fields_read: [exercise_name, logging_type, weight_kg, reps_completed, set_number, sets_completed, sets, sets_detail, duration_seconds, distance_km, is_pr, volume_kg, workout_log_id, updated_at_ms, logged_at_ms, date]
        notes: |
          Canonical reader. Builds per-session receipt from
          exercise_log_index_<istDate> with workoutBox `date == dateKey`
          fallback (APK Test #16.1 Agent A defence for rogue restore-
          writer fix). Dedupes by exercise_name (sum sets, max weight).
          Computes sessionLabel "SESSION N" when >1 workout_log_id per day.
      - file: lib/features/home/screens/home_screen.dart
        line_range: 670-695
        method: home "View Card" button handler
        semantic: pass-through
        fields_read: [via WorkoutReceiptData.fromExerciseLogs(DateTime.now())]
      - file: lib/features/home/widgets/day_detail_sheet.dart
        line_range: 370-385
        method: DayDetailSheet "View Workout Card" calendar entry
        semantic: pass-through
        fields_read: [via WorkoutReceiptData.fromExerciseLogs(date)]
      - file: lib/features/train/screens/active_workout_screen.dart
        line_range: 1015-1030
        method: active-workout completion handoff
        semantic: pass-through
        fields_read: [via fromExerciseLogs(workoutDate) with fromActiveWorkout fallback]
      - file: lib/features/train/widgets/workout_receipt_sheet.dart
        line_range: 1-100
        method: WorkoutReceiptSheet.show
        semantic: display-only
        fields_read: [receiptData.exercises, totalVolumeKg, totalSets, prs, sessionLabel, workoutName, tagline]
      - file: lib/features/home/widgets/day_detail_sheet.dart
        line_range: 457-475
        method: _hasExerciseLogsForDate (OI-05 cheap probe)
        semantic: flag-check
        fields_read: [exercise_log_index_<istDate>, date]
        notes: Cheap "did the user actually log" probe used to gate snackbar copy on completed days with no logs.
      - file: lib/features/train/repositories/workout_repository.dart
        line_range: 96-110
        method: legacy exlog_* date scan (`_ensureExlogDateIndex` fallback path)
        semantic: aggregated
        fields_read: [date, exercise_name]
        notes: Builds the lazy secondary date-keyed index for legacy rows lacking exercise_log_index_<date>.
      - file: lib/features/ai_coach/repositories/ai_coach_repository.dart
        line_range: 905-940
        method: AI snapshot recent_logs builder
        semantic: aggregated
        fields_read: [date, exercise_name, sets, weight_kg, reps_completed, logging_type]
        notes: Reads exlog_* rows for the AI snapshot's recent_logs section.
      - file: lib/shared/repositories/plan_engine/progression_resolver.dart
        line_range: 40-90
        method: ProgressionResolver weight scan
        semantic: max
        fields_read: [date, exercise_name, weight_kg, logging_type]
        notes: Walks the last 28 days of exlog_* rows to seed starting weights for the next phase.
    reader_allow_files:
      - { file: lib/core/services/exlog_key_migrator.dart, reason: "v8 key-rewrite migrator — touches every exlog_* row" }
      - { file: lib/core/services/logging_type_repair_migrator.dart, reason: "one-shot logging_type repair sweep over exlog_*" }
      - { file: lib/core/services/sync/sync_workout.dart, reason: "cloud sync writer for workout domain — scans exlog_* prefix" }
      - { file: lib/core/services/sync_service.dart, reason: "orchestrator — fan-out across exlog_* + wlog_* during weeklyFullSync" }
      - { file: lib/features/auth/screens/restoring_screen.dart, reason: "checks ExlogKeyMigrator flag (config.get('exlog_key_migration_v8')) — not an exlog_* row reader" }
      - { file: lib/core/services/workout_read_service.dart, reason: "OI-02 canonical READ service — exposes exerciseLogsForIstDate + per-set MAX primitives delegated to by every other reader" }
    regression_test: test/contracts/receipt_scoping_test.dart
    hive:
      box: workoutBox
      key_prefix: "exlog_"
      key_formula: "'exlog_${istDateStr(date)}_${exerciseName.hashCode.toUnsigned(32).toRadixString(16)}'"
    cloud:
      table: workout_log_exercises
      # Audit 2026-05-12 P3-G — `volume_kg` does NOT exist on workout_log_exercises
      # (verified information_schema). Removed.
      columns: [exercise_id, workout_log_id, set_number, reps, weight_kg, logging_type, is_pr, completed_at]
    sync_methods: [_syncExerciseLogs]
    restore_methods: [_restoreExerciseLogs]
    provider_invalidation_set: [currentPlanProvider, workoutStatsProvider, calendarWeekProvider, streakProvider, todayWorkoutProvider, allExercisePRsProvider]
    telemetry:
      failure_op_types: [upsert_exercise_log, restore_exercise_logs]
    class_constraints: |
      Dedup by exercise_name. Legacy rows (no workout_log_id) always
      pass through. workoutLogId filter only excludes rows whose own
      workout_log_id field disagrees.

  - concept: workout_log_edit_surface
    domain: workout
    description: |
      Single edit surface for completed-workout logs. 4 entry points
      route through it: receipt sheet Edit button, Home View Card,
      calendar day detail, Train expanded view.
    writers:
      - file: lib/features/train/widgets/edit_workout_log_sheet.dart
        line_range: 1-9999
        method: EditWorkoutLogSheet.save
        notes: |
          Save responsibilities:
            1. Rewrite Hive log map in place
            2. Recompute volume_kg = weight_kg × reps_completed
            3. Chronologically rescan is_pr flags
            4. Invalidate full provider batch (currentPlan, workoutStats,
               calendarWeek, streak, todayWorkout, allExercisePRs)
            5. Fire syncWorkoutData() + pushSnapshot() (fire-and-forget)
    reader_manifest_complete: true
    readers:
      - file: lib/features/train/widgets/workout_receipt_card.dart
        line_range: 288-497
        method: WorkoutReceiptData.fromExerciseLogs
        semantic: aggregated
        fields_read: [exercise_name, logging_type, weight_kg, reps_completed, set_number, sets_completed, sets, sets_detail, duration_seconds, distance_km, volume_kg, is_pr]
        notes: |
          Reads the edited Hive log row immediately after EditWorkoutLogSheet.save
          writes back; field names must match the WorkoutWriteService contract
          (set_number, sets[], reps_completed, weight_kg, volume_kg).
      - file: lib/features/train/widgets/edit_workout_log_sheet.dart
        line_range: 62-71
        method: _EditWorkoutLogSheetState._loadRows
        semantic: pass-through
        fields_read: [via WorkoutRepository.getExerciseLogsForDate(widget.date) → id, plus shape that EditLogExerciseRow.fromLog ingests]
        notes: |
          Self-loop reader: the sheet reads back the rows it just wrote.
          Filters to `log['id'] is String` (Hive key injected by the
          repository) and constructs per-row EditLogExerciseRow models.
      - file: lib/features/train/widgets/edit_workout_log_sheet.dart
        line_range: 904-975
        method: EditLogExerciseRow.fromLog
        semantic: per-set
        fields_read: [exercise_name, logging_type, sets, sets_detail, set_number, sets_completed, reps_completed, weight_kg, duration_seconds, duration_sec, distance_km]
        notes: |
          Dual-name reader (canonical sets[] OR legacy sets_detail) added
          in Test #15.3 Bug 6 (`e1f8a2`). Per-set duration accepts both
          `duration_sec` (canonical) and `duration_seconds` (legacy/restore).
      - file: lib/features/train/widgets/workout_receipt_sheet.dart
        line_range: 70-95
        method: WorkoutReceiptSheet Edit button
        semantic: pass-through
        fields_read: [routes through EditWorkoutLogSheet.show(date)]
      - file: lib/features/train/screens/train_screen.dart
        line_range: 950-970
        method: Train expanded view Edit button
        semantic: pass-through
        fields_read: [routes through EditWorkoutLogSheet.show(day.date!)]
      - file: lib/features/home/widgets/day_detail_sheet.dart
        line_range: 457-475
        method: _hasExerciseLogsForDate
        semantic: flag-check
        fields_read: [date, exercise_log_index_<istDate>]
        notes: Probe used by calendar-day detail to gate the View Workout Card button.
      - file: lib/features/ai_coach/repositories/ai_coach_repository.dart
        line_range: 905-940
        method: AI snapshot recent_logs builder
        semantic: aggregated
        fields_read: [exlog_* row maps]
      - file: lib/features/train/repositories/workout_repository.dart
        line_range: 96-110
        method: legacy exlog_* date scan
        semantic: aggregated
        fields_read: [date]
      - file: lib/shared/repositories/plan_engine/progression_resolver.dart
        line_range: 40-90
        method: ProgressionResolver weight scan
        semantic: max
        fields_read: [date, exercise_name, weight_kg]
    reader_allow_files:
      - { file: lib/core/services/exlog_key_migrator.dart, reason: "v8 key-rewrite migrator — touches every exlog_* row" }
      - { file: lib/core/services/logging_type_repair_migrator.dart, reason: "one-shot logging_type repair" }
      - { file: lib/core/services/sync/sync_workout.dart, reason: "cloud sync writer scans exlog_* prefix" }
      - { file: lib/core/services/sync_service.dart, reason: "orchestrator — fan-out includes exlog_*" }
      - { file: lib/core/services/workout_write_service.dart, reason: "canonical writer for exlog_* rows — listed as writer above; touches its own prefix during rescan" }
      - { file: lib/features/auth/screens/restoring_screen.dart, reason: "checks migrator config flag — not an exlog_* row reader" }
      - { file: lib/core/services/workout_read_service.dart, reason: "OI-02 canonical READ service for exlog_* rows" }
    regression_test: test/contracts/edit_log_field_normalization_test.dart
    hive:
      box: workoutBox
      key_prefix: "exlog_"
    sync_methods: [_syncExerciseLogs, _syncWorkoutLogs]
    provider_invalidation_set: [currentPlanProvider, workoutStatsProvider, calendarWeekProvider, streakProvider, todayWorkoutProvider, allExercisePRsProvider]
    telemetry:
      failure_op_types: [upsert_exercise_log, upsert_workout_log]
    class_constraints: |
      Field names written MUST match WorkoutWriteService contract:
      set_number, sets[], reps_completed, weight_kg, volume_kg.
      Pre-Test-#12 bug: edit sheet wrote sets_completed → receipt
      rendered "0 sets · N reps".

  - concept: exercise_logs_read_path
    domain: workout
    description: |
      Indexed O(1) read of all exlog_* rows for a given IST date.
      Falls back to a once-built date-keyed map for legacy rows.
    writers:
      - file: lib/core/services/workout_write_service.dart
        line_range: 1-260
        method: logExercise
        notes: appends to exercise_log_index_YYYY-MM-DD on every write
    reader_manifest_complete: true
    readers:
      - file: lib/features/train/repositories/workout_repository.dart
        line_range: 497-536
        method: WorkoutRepository.getExerciseLogsForDate
        semantic: aggregated
        fields_read: [exercise_log_index_<dateKey>, exlog_* row maps, exercise_name, id (injected from Hive key)]
        notes: |
          Canonical reader. Tries O(1) index lookup first; falls back
          to lazy-built date-keyed secondary index (`_ensureExlogDateIndex`)
          for legacy entries without exercise_log_index_<date>. Injects
          Hive key as `id` field on both paths (Bug F fix — required by
          EditWorkoutLogSheet's `log['id'] is String` filter).
      - file: lib/features/train/widgets/edit_workout_log_sheet.dart
        line_range: 62-71
        method: _EditWorkoutLogSheetState._loadRows
        semantic: pass-through
        fields_read: [via WorkoutRepository.getExerciseLogsForDate(widget.date)]
      - file: lib/features/train/screens/train_screen.dart
        line_range: 830-833
        method: _buildExpandedExercises (Train expanded day card)
        semantic: pass-through
        fields_read: [via WorkoutRepository.getExerciseLogsForDate(day.date!)]
      - file: lib/features/train/screens/train_screen.dart
        line_range: 1160-1165
        method: Train day-detail sheet renderer
        semantic: pass-through
        fields_read: [via WorkoutRepository.getExerciseLogsForDate(day.date!)]
      - file: lib/features/home/widgets/day_detail_sheet.dart
        line_range: 457-475
        method: _hasExerciseLogsForDate
        semantic: flag-check
        fields_read: [exercise_log_index_<istDate>]
    reader_allow_files:
      - { file: lib/core/services/exlog_key_migrator.dart, reason: "ExlogKeyMigrator deletes orphaned exercise_log_index_* entries during v8 rewrite" }
    regression_test: test/contracts/format_date_key_ist_test.dart
    hive:
      box: workoutBox
      key_prefix: "exercise_log_index_"
      key_formula: "'exercise_log_index_${istDateStr(date)}'"
    ist_sites:
      - { file: lib/core/utils/date_utils.dart, line: 27, fn: formatDateKey }
      - { file: lib/core/services/workout_write_service.dart, line: 774, fn: wlogKey }
    forbidden_legacy_patterns:
      - { pattern: "workoutBox\\.keys.*manually.*date", reason: "O(n) scan — use the index key instead" }
      - { pattern: "DateTime\\.now\\(\\)\\.toIso8601String\\(\\)\\.substring\\(0,\\s*10\\)", reason: "UTC date, disagrees with IST-keyed reader; use istDateStr(DateTime.now())" }
      - { pattern: "\\.now\\(\\)\\.year.*\\.now\\(\\)\\.month.*\\.now\\(\\)\\.day", reason: "Local-date extraction disagrees with IST key; use istDateStr(DateTime.now())" }
    class_constraints: |
      Date keys are IST-anchored via formatDateKey → istDateStr.
      Never iterate workoutBox.keys manually to find logs for a date.

  - concept: scheduled_workouts_mutations
    domain: workout
    description: |
      All schedule mutations (generate, clean-sync on template edit,
      reschedule on days/week change). Owns schedule_YYYY-MM-DD keys.
    writers:
      - file: lib/core/services/workout_schedule_service.dart
        line_range: 137-9999
        method: WorkoutScheduleService (whole class)
    reader_manifest_complete: true
    readers:
      - file: lib/core/services/workout_schedule_service.dart
        line_range: 577-619
        method: WorkoutScheduleService.getScheduleForDate
        semantic: latest
        fields_read: [schedule_<date>.status, completed_at, exercises, workout_name, workout_focus, week_number, template_id]
        notes: |
          Canonical reader for the schedule_<date> Hive row. Guards
          against stale `completed_at` mismatching the requested date
          (Test #13 Bug 5.3 — do NOT call .toLocal() before _dateKey).
      - file: lib/features/home/providers/home_provider.dart
        line_range: 75-100
        method: calendarWeekProvider per-day fetch
        semantic: pass-through
        fields_read: [via WorkoutScheduleService.getScheduleForDate(date)]
      - file: lib/features/home/providers/home_provider.dart
        line_range: 435-445
        method: todayWorkoutProvider
        semantic: pass-through
        fields_read: [via WorkoutScheduleService.getScheduleForDate(DateTime.now())]
      - file: lib/features/home/providers/home_provider.dart
        line_range: 575-580
        method: aiInsightProvider (next-workout consistency hint)
        semantic: pass-through
        fields_read: [via WorkoutScheduleService.getScheduleForDate(now)]
      - file: lib/features/home/widgets/weekly_calendar.dart
        line_range: 40-55
        method: WeeklyCalendar 7-day fetch
        semantic: pass-through
        fields_read: [via service.getScheduleForDate(day)]
      - file: lib/features/home/widgets/swap_sheet.dart
        line_range: 78-90
        method: SwapSheet week + source
        semantic: pass-through
        fields_read: [via _scheduleService.getScheduleForDate(d/widget.sourceDate)]
      - file: lib/features/train/repositories/workout_repository.dart
        line_range: 350-1060
        method: WorkoutRepository (5 call-throughs)
        semantic: pass-through
        fields_read: [via _schedule.getScheduleForDate(date) at :351, :357, :364, :972, :1055]
    reader_allow_files:
      - { file: lib/core/services/scheduled_workouts_resync_migrator.dart, reason: "one-shot resync sweep over schedule_* keys" }
      - { file: lib/core/services/sync/sync_workout.dart, reason: "cloud sync writer scans schedule_* prefix" }
    regression_test: test/workout_write_service/upsert_scheduled_test.dart
    hive:
      box: workoutBox
      key_prefix: "schedule_"
      key_formula: "'schedule_${istDateStr(date)}'"
    cloud:
      table: scheduled_workouts
      columns: [user_id, scheduled_date, workout_name, status, exercises, week_number, template_id]
      unique_constraint: "(user_id, scheduled_date)"
    sync_methods: [_syncScheduledWorkouts, _syncScheduleCompletions]
    restore_methods: [_restoreScheduledWorkouts, _restoreScheduleCompletions]
    provider_invalidation_set: [currentPlanProvider, calendarWeekProvider, todayWorkoutProvider]
    ist_sites:
      - { file: lib/core/services/workout_write_service.dart, line: 778, fn: scheduleKey }
    forbidden_legacy_patterns:
      - { pattern: "workoutBox\.put\('schedule_", reason: "Never write schedule keys directly from a widget — use WorkoutScheduleService" }
    class_constraints: |
      Never write schedule_YYYY-MM-DD keys directly from a widget or
      repository. Every reschedule on days/week change MUST preserve
      completed entries and regenerate from today.

  - concept: nutrition_total_calories
    domain: nutrition
    description: |
      Totals on every nlog_* row are computed from items[] with
      per-item Atwater fallback (raw > 0 ? raw : 4P+4C+9F). Never
      read result['total_calories'] at top level of an AI response.
    writers:
      - file: lib/core/services/nutrition_write_service.dart
        line_range: 53-148
        method: logMeal
        notes: |
          Computes totalCals/Protein/Carbs/Fat/Fiber from items[].
          Atwater fallback applied per FoodItem.kcalWithFallback.
    # audit-2026-05-16 reader-side — full enumeration of every code-grep
    # reader of nlog_* total_calories on Hive. AI tool-intent readers
    # (tool_dispatcher / tool_confirm_card / prelog_diff) read the
    # pre-write intent payload, NOT a stored nlog_* row, so they are
    # not readers of this SoT.
    reader_manifest_complete: true
    readers:
      - file: lib/features/nutrition/widgets/todays_meals_card.dart
        line_range: 138-150
        method: _PopulatedSlotCard.build
        semantic: aggregated
        fields_read: [total_calories, created_at]
        notes: |
          Sums total_calories across all nlog_* items in a slot to
          render the slot's kcal label. Earliest created_at is the
          slot time.
      - file: lib/features/nutrition/widgets/meal_section.dart
        line_range: 25-100
        method: MealSection.build
        semantic: aggregated
        fields_read: [total_calories, total_protein, total_carbs, total_fat, food_name, quantity_g]
        notes: |
          Legacy expansion-tile meal section. Sums total_calories
          for the header label; renders per-item tiles using the same field.
      - file: lib/features/nutrition/widgets/saved_meals_section.dart
        line_range: 45-60
        method: SavedMealsSection.build (chip kcal)
        semantic: display-only
        fields_read: [total_calories]
        notes: Reads saved-meal preset rows (is_saved_meal=true), not pure nlog_*.
      - file: lib/features/nutrition/widgets/log_food_modes/search_mode_body.dart
        line_range: 260-300
        method: SearchModeBody (history tile + relog)
        semantic: display-only
        fields_read: [total_calories]
      - file: lib/features/nutrition/screens/nutrition_screen.dart
        line_range: 655-665
        method: _confirmAndDeleteLog (delete confirmation chip)
        semantic: display-only
        fields_read: [total_calories, total_protein]
      - file: lib/features/nutrition/screens/nutrition_screen.dart
        line_range: 938-948
        method: _showEditMacrosSheet (edit macros bottom sheet)
        semantic: display-only
        fields_read: [total_calories, total_protein, total_carbs, total_fat, total_fiber]
      - file: lib/features/nutrition/repositories/nutrition_repository.dart
        line_range: 45-77
        method: dailyMacros
        semantic: aggregated
        fields_read: [total_calories, total_protein, total_carbs, total_fat, total_fiber, date, is_saved_meal]
        notes: Sums daily totals; skips is_saved_meal=true template rows.
      - file: lib/features/nutrition/repositories/nutrition_repository.dart
        line_range: 129-188
        method: computeWeeklyReportData
        semantic: aggregated
        fields_read: [total_calories, total_protein, date]
      - file: lib/features/nutrition/repositories/nutrition_repository.dart
        line_range: 196-245
        method: getDailyMacros (last-N-days bucketing)
        semantic: historical-series
        fields_read: [total_calories, total_protein, total_carbs, total_fat, date]
        notes: |
          Per-day map; also accepts legacy top-level 'calories' /
          'protein' / 'carbs' / 'fat' fallback for restored rows.
      - file: lib/features/nutrition/repositories/nutrition_repository.dart
        line_range: 497-509
        method: getCaloriesForDate
        semantic: aggregated
        fields_read: [total_calories, date]
      - file: lib/features/nutrition/providers/nutrition_provider.dart
        line_range: 1493-1545
        method: WeeklyNutritionNotifier.build
        semantic: historical-series
        fields_read: [total_calories, total_protein, date, is_saved_meal]
      - file: lib/features/nutrition/providers/nutrition_provider.dart
        line_range: 987-1021
        method: FoodLogNotifier.deleteFoodLog (audit log capture)
        semantic: display-only
        fields_read: [total_calories, calories, food_name, name, meal_type, date]
        notes: |
          Reads pre-delete log entry to stash audit row in
          'recent_deletes' bucket; falls back to legacy 'calories' key.
      - file: lib/features/home/providers/home_provider.dart
        line_range: 650-677
        method: RecentFoodLogsNotifier.build
        semantic: display-only
        fields_read: [total_calories, total_protein, total_carbs, total_fat, food_name, meal_name, name, date]
      - file: lib/features/ai_coach/repositories/ai_coach_repository.dart
        line_range: 978-997
        method: _getTodayNutrition
        semantic: aggregated
        fields_read: [total_calories, total_protein, total_carbs, total_fat, total_fiber, date]
        notes: |
