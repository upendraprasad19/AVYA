      - { pattern: "const\\s+\\w*[Ww]ater\\w*\\s*=\\s*3000", reason: "Never hardcode 3000 as water constant; use WaterTargetService.instance.currentTargetMl()" }
    class_constraints: |
      Never hardcode 3000. Floor 2500 ml per founder direction
      2026-05-04. Onboarding seed must route through
      WaterTargetService.computeFromProfile(profile).

