      success_op_types: []
      failure_op_types: []
    class_constraints: |
      Required payload fields: error_code, error_message, op_type,
      retry_count, client_version, platform. Optional: user_id
      (omitted pre-auth). Never throw from within ErrorTelemetry —
      telemetry must be silent. HIGH_PRIORITY_OP_TYPES (crash_*,
