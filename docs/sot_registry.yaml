  - concept: rank_monotonic_current_code
    domain: profile
    behavioral_test_required: false  # Behavioural test ships in same batch.
    behavioral_test_path: test/contracts/rank_no_demotion_behavioral_test.dart
    description: |
      `user_profile.current_rank_code` + `current_rank_achieved_at` are
      denormalizations of the highest-ordinal row in `rank_promotions`
      per user. Per spec § rank-permanence: once earned, a rank is
      never revoked by recompute. Writers (client + server cron) MUST
      only update the denormalization UPWARD; any code path that would
      lower it is a P0 monotonic-field-recompute bug (debugging skill
      §2.19, diagnose 3a7b9f 2026-05-27).

      Pre-fix the client `evaluateAndPromote` checked
      `currentCode != qualified.code` and unconditionally overwrote;
      the server cron `evaluate-rank-promotions` had the same bug at
      its denorm-sync block. When a user broke a sailor-track streak
      gate (e.g. SD1 requires streak >= 7), `_qualifiedRankCode`
      recomputed to SD2 and the user was silently demoted. Migration
      075 healed `user_profile.current_rank_code` from
      `rank_promotions` max-ordinal (with the matching historical
      `achieved_at`).
    writers:
      - file: lib/core/services/rank_service.dart
        line_range: 138-194
        method: RankService.evaluateAndPromote
        notes: |
          Wraps the cloud user_profile.update + local Hive
          updateProfileFields + onStateChanged invocation + pending
          promotion stamp inside `if (shouldPromote(currentCode,
          qualified))`. Helper at line 61 is the canonical comparator
          and the unit under behavioral test.
      - file: supabase/functions/evaluate-rank-promotions/index.ts
        line_range: 319-340
        method: evaluate-rank-promotions cron sync block
        notes: |
          Mirrors the client guard server-side. Reads existing
          current_rank_code, looks up its ordinal via LADDER, only
          issues the .update() when winner.ordinal > currentOrdinal.
          Deployed as v7 2026-05-27. Line range shifted from 227-251
          due to OPT-E's batch pre-fetch + chunking-helper insertions
          above this block (2026-07-08) — block logic unchanged.
    reader_manifest_complete: true
    readers:
      - file: lib/core/services/rank_service.dart
        line_range: 39-60
        method: RankService.getCurrentRank
        semantic: read
        fields_read: [current_rank_code, current_rank_achieved_at]
        notes: |
          Reads UserRepository.getProfile() (Hive userBox['profile'])
          and renders the RankInfo for Profile + Home rank widgets.
      - file: lib/core/services/rank_service.dart
        line_range: 138-145
        method: evaluateAndPromote (self-read for guard)
        semantic: read
        fields_read: [current_rank_code]
        notes: Reads cloud user_profile to derive currentOrdinal before guard.
    cloud_table: user_profile
    cloud_columns:
      - current_rank_code
      - current_rank_achieved_at
    hive:
      box: userBox
      key: profile
      fields: [current_rank_code, current_rank_achieved_at]
    regression_test: test/contracts/rank_no_demotion_behavioral_test.dart
    telemetry:
      failure_op_types:
        - rank_service_evaluate_and_promote
        - rank_service_local_profile_update
        - rank_service_pending_promotion_stamp
    class_constraints: |
      Any future writer to user_profile.current_rank_code MUST route
      through `RankService.shouldPromote(currentCode, qualified)` or
      an equivalent ordinal-compare guard. Direct
      `.update({current_rank_code: ...})` without the guard
      regresses diagnose 3a7b9f.

      Same monotonic-field-recompute class applies to:
        - user_progress.total_workouts_done — closed in same batch via
          GREATEST(existing, recomputed) in
          supabase/functions/weekly-recalc/index.ts:266-298 (v16).

  - concept: singleton_lifecycle_registry
    domain: core_services
    behavioral_test_path: test/contracts/singleton_lifecycle_registry_behavioral_test.dart
    description: |
      Process-wide callback registry that bridges static `.instance`
      singletons (which live outside the Riverpod graph) into the
      HiveUserSession user-swap signal.

      Problem (tech-debt audit 2026-05-20 / A7, score 14): seven core
      services are static singletons holding mutable in-memory state
      (cached HTTP clients, completers, stream subscriptions, in-flight
      payment callbacks, restore-progress labels). When HiveUserSession
      flips to a new user, the singleton instance survives and its
      stale state can leak into the new session.

      Solution (narrow scaffold, NOT full Riverpod conversion): each
      singleton calls SingletonLifecycleRegistry.register(name, hook)
      in its private constructor; HiveUserSession invokes
      SingletonLifecycleRegistry.notifyUserChanged() after each of the
      three locked mutator paths (open / close / delete). Every hook
      fires; per-singleton `_onUserChanged` resets the mutable state.

      Full Riverpod migration of the seven singletons is a follow-up
      batch — converting them in place would touch hundreds of caller
      sites. This registry is the stepping stone.
    writers:
      - { file: lib/core/services/sync_service.dart, line: 82, method: "SyncService._() constructor → _registerLifecycle()", notes: "Resets _realtimeSubscription / _healthSyncCompleter / restoreProgressLabel / _restoreCancelled." }
      - { file: lib/core/services/subscription_service.dart, line: 17, method: "SubscriptionService._() constructor → _registerLifecycle()", notes: "Re-fires onStateChanged so Riverpod consumers re-read the new user's PRO state." }
      - { file: lib/core/services/workout_schedule_service.dart, line: 177, method: "WorkoutScheduleService._() constructor → _registerLifecycle()", notes: "All state in workoutBox / userBox; reset hook is a no-op placeholder." }
      - { file: lib/core/services/usage_counter_service.dart, line: 13, method: "UsageCounterService._() constructor → _registerLifecycle()", notes: "Counters live in per-user userBox; reset hook is a no-op placeholder." }
      - { file: lib/core/services/ai_service.dart, line: 54, method: "AiService._() constructor → _registerLifecycle()", notes: "Reset closes + drops the cached http.Client via dispose()." }
      - { file: lib/core/services/razorpay_service.dart, line: 26, method: "RazorpayService._() constructor → _registerLifecycle()", notes: "Reset nulls _onSuccess / _onFailure / _pendingPlan." }
      - { file: lib/core/services/seed_service.dart, line: 36, method: "SeedService._() constructor → _registerLifecycle()", notes: "Seeds are shared-box; reset is a no-op placeholder." }
    reader_manifest_complete: true
    readers:
      - { file: lib/core/services/hive_user_session.dart, line: 255, method: "_openForUserLocked → SingletonLifecycleRegistry.notifyUserChanged()", semantic: pass-through, fields_read: [registered callback table], notes: "Fires after static owner fields + listenable flip to the new user." }
      - { file: lib/core/services/hive_user_session.dart, line: 387, method: "_closeAllLocked → SingletonLifecycleRegistry.notifyUserChanged()", semantic: pass-through, fields_read: [registered callback table], notes: "Sign-out path." }
      - { file: lib/core/services/hive_user_session.dart, line: 424, method: "_deleteAllFilesForCurrentUserLocked → SingletonLifecycleRegistry.notifyUserChanged()", semantic: pass-through, fields_read: [registered callback table], notes: "DPDP delete-account / factory-reset path." }
    hive:
      box: in_memory_only
      key_prefix: ""
      key_formula: |
        Not Hive-backed. Pure in-memory Map<String, void Function()>.
        Registry state is intentionally not persisted — every cold start
        the seven singletons re-register from their private constructors.
    cloud:
      table: null
      columns: []
    sync_methods: []
    restore_methods: []
    provider_invalidation_set: []
    telemetry:
      failure_op_types: [singleton_lifecycle_callback]
    class_constraints: |
      A7 cross-account-leak class — prevents stale in-memory state from
      a previous user's session bleeding into the next sign-in:
        - SyncService realtime sub firing into the new user's Riverpod tree
        - AiService http.Client holding a tail of inflight requests
        - RazorpayService _onSuccess callback re-entering the new user's
          paywall closure if the previous user abandoned checkout
        - SubscriptionService PRO pill rendering against pre-flip box
          state for one frame
      Enforced by:
        - test/contracts/singleton_lifecycle_registry_test.dart — pins
          register/notify behavior + source-greps every wired singleton
          + asserts 3 notify call sites in HiveUserSession.
      Follow-up: Riverpod conversion. Once each singleton is a Provider,
      the registry hook can be replaced by
      `ref.listen(authUserIdProvider, (_, __) => state.reset())` and
      this registry deleted.

