      - { pattern: "\\[.sets_detail.\\]\\s*=", reason: "Writing old field name sets_detail; correct field is sets[] — read-fallbacks are allowed but new writes must use sets[]" }
    class_constraints: |
      exlog_* row fields: exercise_name, date, sets[], set_number,
      reps_completed, weight_kg, volume_kg, logging_type, is_pr,
      source, updated_at_ms, optional notes, optional workout_log_id,
      optional exercise_id (W3.3 Batch 11-A — the exercise_library row id,
      forward-only; absent on legacy/restored/coach-conversational rows).
      COLLISION NOTE: this Hive `exercise_id` (library id) is a DIFFERENT
      concept from the cloud workout_log_exercises.exercise_id, which is a
      NAME-derived onConflict identity. The Hive library id MUST NOT be
      projected upward into the cloud column (would shift the natural key →
      duplicate rows) — pinned by test/contracts/sync_exlog_no_library_id_test.dart.
      See the `exercise_id_history` concept.

  - concept: exercise_id_history
    domain: workout
    behavioral_test_path: test/contracts/exlog_exercise_id_behavioral_test.dart
    description: >
      W3.3 (Batch 11-A) — FORWARD-ONLY id-keyed exercise history. New `exlog_*`
      rows carry the library `exercise_id`; ProgressionResolver matches a plan
      exercise to logged history by id — INCLUSIVE with name (id-matched ∪
      name-matched, the MORE-RECENT of the two wins) — so a rename/swap no longer
      SPLITS an exercise's weight history. Ship-dark `enable_exercise_id_history`
      (PlanEngineFlags.exerciseIdHistoryEnabled, DEFAULT OFF → the id-index is
      never built → name-only, byte-identical). Forward-only: legacy / restored /
      no-id rows match by name (restore does NOT reconstruct the Hive exercise_id
      — sync_workout `_restoreExerciseLogs` builds logMap WITHOUT it, so restored
      rows fall to the name index, which is correct). HIVE-LOCAL: the cloud
      onConflict key stays name-derived (see the collision note on
      hive_field_name_exlog). The WRITE side (stamping exercise_id) is
      unflagged-additive; only the READ switch is gated. No migration / no restore
      entry (Hive-read-only; the exercise_library id is already present client-side).
    writers:
      - file: lib/core/services/workout_write_service.dart
        method: logExercise (optional exerciseId param → entry['exercise_id'])
        notes: >
          STICKY: resolvedExerciseId = exerciseId ?? existing['exercise_id'], so a
          null-id re-log (coach-conversational / legacy repo path) keeps the id a
          prior schedule-log wrote for the same key. Written only when non-null.
      - file: lib/features/train/providers/train_provider.dart
        method: ExerciseData.exerciseId thread (schedule-map build + copyWith + active-workout log call + swap reconstruction) + SwapExerciseData.id
        notes: >
          ExerciseData gains `exerciseId` (from schedule map `exercise_id`),
          preserved through copyWith (else the 1×/sec elapsed-timer copy drops it),
          passed to logExercise on completion; the ActiveWorkoutNotifier swap
          reconstruction carries the swapped-IN ExerciseData's id (or null → name
          fallback). SwapExerciseData gains an optional `id` so the manual swap
          PICKER path can supply the swapped-in library id.
      - file: lib/features/train/screens/active_workout/swap_sheets.dart
        method: _showExercisePickerSheet / _showSwapSheet / _openCreateAndAutoSwap
        notes: >
          B-pass 3c9f18f0d42d#1 — the three manual `ExerciseData(...)` builders
          thread the library id: add-path from the picked row `exerciseData['id']`,
          swap-path from `swapEx.id`, create-swap from `newExercise['id']`
          (usually null for a brand-new custom → name fallback, correct).
      - file: lib/features/train/widgets/exercise_swap_sheet.dart
        method: SwapExerciseData construction (library + custom list builders)
        notes: >
          Both list builders pass `id: ex['id']` from the ExerciseRepository seed
          row (the row already carries its id — Hive key == id) into SwapExerciseData.
      - file: lib/features/ai_coach/services/tool_dispatcher.dart
        method: _executeLogSet
        notes: >
          Stamps exerciseId ONLY when the coach-supplied id resolves to a real
          library exercise (resolvedName != null); otherwise null → name fallback.
    readers:
      - file: lib/shared/repositories/plan_engine/progression_resolver.dart
        method_or_widget: ProgressionResolver.resolve — id-index (lastSessionById/allById) + inclusive id-OR-name match
        semantic: >
          flag ON → builds a parallel id-keyed index of most-recent + all sessions
          (only non-empty ids); the plan-match loop takes the MORE-RECENT of the
          id-matched and name-matched session and unions both session lists for the
          graded 2-consecutive gate. flag OFF → indices null → name-only (verbatim).
      - file: lib/shared/repositories/plan_engine/plan_generator.dart
        method_or_widget: build exerciseIds {exerciseName: PlannedExercise.exerciseId} → ProgressionResolver.resolve(exerciseIds:)
        semantic: pass-through — threads each plan exercise's library id to the resolver (parallel to repRanges).
    contract_test_path: test/contracts/exlog_exercise_id_behavioral_test.dart

