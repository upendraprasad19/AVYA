        method: self-contained
        semantic: display-only
        fields_read: [waterTargetProvider]
      - file: lib/features/home/screens/home_screen.dart
        line_range: 475-481
        method: _buildQuickActions (Water quick-action state machine)
        semantic: display-only
        fields_read: [waterTargetProvider]
        notes: |
          Drives the Done/Idle state of the home Water QuickActionButton.
      - file: lib/features/home/widgets/water_quick_sheet.dart
        line_range: 35-70
        method: WaterQuickSheet (_openEditTarget + build)
        semantic: display-only
        fields_read: [waterTargetProvider, WaterTargetService.instance (singleton)]
        notes: |
          Reads the singleton directly for the edit sheet's initial
          value; reads the provider for the live progress bar. Calls
