        method_or_widget: _selectCandidateName mirror (keeps the pure-Dart cascade tracer in lockstep; QueryV4Mirror unchanged)
        semantic: mirror
      - file: test/contracts/injury_substitute_preference_behavioral_test.dart
        method_or_widget: drives real generateV4 — ON re-ranks vs OFF, post-filter safety, injury-gated inertness, uncurated fallthrough
        semantic: behavioral
    contract_test_path: test/contracts/injury_substitute_preference_behavioral_test.dart

  - concept: cross_phase_variety
    domain: workout
    behavioral_test_path: test/contracts/cross_phase_variety_behavioral_test.dart
    description: >
      W3.4 (Batch 11-B) — cross-phase VARIETY. On a genuine FRESH phase advance
      (pins==null), `WorkoutScheduleReadService.previousPhaseNamesByDay()` reads the
      just-finished phase's per-day A/B picks (getWeek(1)/getWeek(2), LOWERCASED,
      the SAME rows repeatPinsFrom reads but WITHOUT the G5 gate) and threads them as
      `previousPhaseByDay` → generateV4 → pickV4 (indexed per-day avoidA/avoidB) →
      _fillSlots → _cascadeFill → `_selectCandidate._preferNovel`, which prefers a
      same-`movement_pattern` sibling NOT used last phase. SOFT bias: feeds
      _selectCandidate ONLY, NEVER queryV4/pickedNames/excludeNames — so it can never
      hard-empty a slot (BOUNDED: falls to pool.first when only last-phase picks
      remain). Composes with ①.1d: injury-sub selects the pool (outer), variety breaks
      ties WITHIN it (inner "prefer-injury-sub-then-variety"). Ship-dark
      `enable_cross_phase_variety` (PlanEngineFlags.crossPhaseVarietyEnabled) — the
      SERVICE-layer gate is inside previousPhaseNamesByDay (OFF → returns {} → no
      getWeek reads → avoidNames empty → byte-identical). NO migration/restore entry
      (reads existing schedule_* rows). NOTES: shared `_exerciseNamesOfRow` /
      `_namesByDayIndex` parsers (extracted from repeatPinsFrom — one parser, #1 drift
      class). attempt-5 (universal pool) is NOT variety-eligible (never calls
      _selectCandidate — stays as safe as today). daysPerWeek/split-shape change across
      advance → day-index misalignment is a HARMLESS no-op (a stale avoid-name that
      matches no pattern-locked candidate falls to .first). L6 _applyHistoryAdjustments
      (phase≥2) may re-swap a novel pick toward a demoted exercise (still
      injury-filtered → safe). buildPinnedDays UNCHANGED (variety ⟂ pins). Covers only
      the pickV4 branch (mutually-exclusive with the repeat-content buildPinnedDays branch).
    writers:
      - file: lib/core/services/workout_schedule_read_service.dart
        method: previousPhaseNamesByDay (flag-gated getWeek reader) + _exerciseNamesOfRow / _namesByDayIndex (shared parsers) + generateAndSchedule/autoGenerateNextPhaseIfNeeded thread
      - file: lib/shared/services/pro_phase_advance.dart
        method: >
          runGraduationPhaseAdvance — computes previousPhaseByDay (pins==null) →
          generateAndSchedule. Unit B / b4e9c7 (2026-08-03) relocated this from
          graduation_screen.dart `_onPro`; the computation is byte-identical.
      - file: lib/shared/repositories/plan_engine/plan_generator.dart
        method: generate/generateV4 previousPhaseByDay → pickV4 (NOT buildPinnedDays)
      - file: lib/shared/repositories/plan_engine/exercise_selector.dart
        method: pickV4 (indexed loop → avoidA/avoidB) / _fillSlots / _cascadeFill avoidNames thread + _selectCandidate._preferNovel
    readers:
      - file: test/plan_generator/v4_diagnostic/cascade_tracer.dart
        method_or_widget: _selectCandidateName + _preferNovelName mirror (trace gains avoidNames; QueryV4Mirror unchanged)
        semantic: mirror
      - file: test/contracts/cross_phase_variety_behavioral_test.dart
        method_or_widget: drives real generateV4 (full_gym/advanced) — variety changes the SET, null=deterministic, bounded, injury-safe
        semantic: behavioral
    contract_test_path: test/contracts/cross_phase_variety_behavioral_test.dart

  - concept: volume_titration
    domain: workout
    behavioral_test_path: test/contracts/volume_titration_behavioral_test.dart
    description: >
      W2.7 (Batch 9) — phase-boundary volume titration. At a genuine FRESH phase
      advance, each MAJOR MUSCLE GROUP's weekly direct-set volume is nudged ±1, clamped
      to [MEV=8,MRV=20] sets/group/week, from phase-N evidence: the per-group e1RM trend
      (VolumeTitration.resolveDeltas, reusing the shared sessionMaxE1rm Epley loop) + a
      GLOBAL readiness soreness damper (readiness is a single daily axis, NOT per-muscle —
      governs the +1 direction only). SAFE polarity: −1 (trim) fires on demonstrated
      e1RM DECLINE alone; +1 (add) requires POSITIVE readiness recovery evidence (≥3
      check-ins AND not persistently beat-up), so with readiness ship-dark (0 rows)
      titration only ever TRIMS. Deltas key + clamp on the MAJOR GROUP (shared
      muscleGroupOf, extracted from the scorecard's _muscleToGroup) so [8,20] is a
      science-valid per-group band, not a per-fragmented-sub-token one. TWO inert seams:
      (1) enable_volume_titration DEFAULT OFF → resolveDeltas {}; (2) OPT-IN — the
      orchestrator applies it only when the caller passes applyVolumeTitration:true, and
      the two advance callers pass `pins == null` so a REPEAT (low-adherence) advance
      never gains volume; every other caller (coach-regen / edit-profile / previews /
      hotel / onboarding) defaults false → untouched. applyToWeeks with {} deltas returns
      the SAME list reference → byte-identical. Composes with the 7-B-1 deload stash: the
      deload week's stashed workingSets is titrated symmetrically (workingSets!=null
      self-gates the deload flag) so a triggered un-deload restores the titrated peak (F1).
      No migration / no restore entry (Hive-read-only; exlog + readiness already sync+restore).
    writers:
      - file: lib/shared/repositories/plan_engine/volume_titration.dart
        method: VolumeTitration.resolveDeltas / applyToWeeks
        notes: >
          resolveDeltas: flag+phase>=2 gate; trailing-35-IST-day exlog e1RM trend (shared
          sessionMaxE1rm) aggregated exercise→major-group via muscleGroupOf on library
          primary_muscles; readiness recovery (>=3 rows, <40% beat-up); −1 on any
          group-declining, +1 only if recovered, else hold; sorted-group deterministic.
          applyToWeeks: empty→identical ref; per-group ±1 on weeks 0-2 visible sets + the
          deload wk-3 workingSets, clamped [8,20], one exercise bumped once/week (dedup).
      - file: lib/shared/repositories/plan_engine/plan_generator.dart
        method: generateV4 / generate (applyVolumeTitration param + post-apply pass)
        notes: >
          generateV4 runs the titration post-pass AFTER PeriodizationEngine.apply (before
          sequencing) gated on `applyVolumeTitration`; generate() forwards the bool. Default
          false → pass not entered → byte-identical. Threaded through
          WorkoutScheduleReadService.generateAndSchedule (passed `pins == null` by
          autoGenerateNextPhaseIfNeeded + graduation_screen._onPro).
      - file: lib/core/utils/e1rm.dart
        method: sessionMaxE1rm
        notes: >
          shared MAX-Epley helper extracted from DeloadE1rmScan (byte-identical; pinned by
          deload_eval_behavioral_test) — one Epley loop for both W2.4 deload + W2.7 titration.
      - file: lib/shared/repositories/plan_engine/muscle_groups.dart
        method: muscleGroupOf
        notes: >
          library-token→major-group map, content byte-identical to the scorecard's
          _muscleToGroup (which now delegates here); .toLowerCase().trim() parity.
    readers:
      - file: test/contracts/volume_titration_behavioral_test.dart
        method_or_widget: drives applyToWeeks (pure) + resolveDeltas (Hive-seeded)
        semantic: >
          applyToWeeks — identical-ref inertness, per-group ±1 clamp [8,20], multi-group
          dedup, deload workingSets symmetry; resolveDeltas — flag/phase gates, −1 on
          decline, +1 only with recovery evidence (0/sparse/systemic-sore readiness → hold),
          deterministic. e1rm_test.dart pins the shared Epley helper.
    contract_test_path: test/contracts/volume_titration_behavioral_test.dart

  - concept: plateau_escalation
    domain: workout
    behavioral_test_path: test/contracts/plateau_escalation_behavioral_test.dart
    description: >
      W3.5 (Batch 12-A, PRO) — plateau escalation rung-2 (+sets). At a genuine FRESH
      phase advance a plateaued MAJOR MUSCLE GROUP earns +1 weekly direct set, MERGED
      into the W2.7 titration delta map so ONE clamped `applyToWeeks` pass applies both.
      A "plateau" = a COMPOUND lift whose MAX-Epley e1RM is FLAT ((max−min)/max ≤ 5%)
      across ≥3 dated sessions spanning ≥28d within a trailing 63-IST-day window
      (`PlateauScan.plateauedGroups`, reusing the shared `buildE1rmByDate` +
      `ExerciseRepository.isCompoundByExactName` + `muscleGroupOf`).
      `mergePlateauSetDeltas(existing, phase)` `putIfAbsent`s +1 ONLY where titration
      left a group ABSENT → a declining group's −1 ALWAYS wins (no double-bump; never
      adds volume to a fatiguing/declining group), and the [MEV=8,MRV=20] clamp inside
      `applyToWeeks` caps it. rung-1 (deload when plateaued+fatigued) needs NO code — it
      is ALREADY delivered by W2.4's `readiness.good` keep in `deload_evaluator` (a
      plateau keep-term there would be provably dead: it can only engage when
      `readiness.good` is already false). rung-3 (rotation) is Batch 12-B. THREE inert
      seams: (1) `enable_plateau_escalation` DEFAULT OFF → merge returns the input map
      unchanged (same ref) → applyToWeeks identity → byte-identical; (2) ALSO gated on
      `enable_readiness` (mirrors DeloadEvaluator — the fatigue gate needs readiness
      rows); (3) OPT-IN `applyPlateauEscalation` — the two fresh-advance callers pass
      `pins == null`; every other caller defaults false. Fatigue = persistent readiness
      red/yellow (≥3 rows in 14d, strict majority `level != green`) — the SAME
      data/window/predicate as `deload_evaluator._readinessGood`, so a fatigued plateau
      routes to the deload rung, not +sets. `phase >= 2` self-gate (PRO — free is phase
      1; the fresh-advance callers are PRO-gated → inherits the server-verified
      phases_2_to_12 gate). No migration / no restore entry (Hive-read-only; exlog +
      readiness already sync+restore). No scorecard/mirror wiring (generator_matrix /
      cascade_tracer untouched → frozen D3 baseline unmoved).
    writers:
      - file: lib/shared/repositories/plan_engine/plateau_scan.dart
        method: PlateauScan.plateauedGroups / mergePlateauSetDeltas / isFlat
        notes: >
          plateauedGroups: flag + readinessEnabled + phase>=2 + !fatiguePresent gates,
          then buildE1rmByDate(63d) → ≥3 sessions / ≥28d span / isFlat(≤5%) / compound →
          muscleGroupOf(primary_muscles). mergePlateauSetDeltas: putIfAbsent(+1) into the
          titration deltas (never overrides ±1). Crash-safe (any read failure → {}).
      - file: lib/shared/repositories/plan_engine/plan_generator.dart
        method: generateV4 / generate (applyPlateauEscalation param + Stage-4.5 merge)
        notes: >
          Stage 4.5 merges mergePlateauSetDeltas into the titration base map then applies
          ONCE via VolumeTitration.applyToWeeks, gated on the applyPlateauEscalation
          opt-in (threaded through WorkoutScheduleReadService.generateAndSchedule; passed
          `pins == null` by autoGenerateNextPhaseIfNeeded + graduation_screen._onPro).
          Default false → block not entered → byte-identical.
      - file: lib/shared/repositories/plan_engine/e1rm_history.dart
        method: buildE1rmByDate
        notes: >
          shared exlog_* → per-exercise MAX-Epley e1RM-by-date builder (Batch 12-A),
          extracted byte-identical from DeloadE1rmScan + VolumeTitration inline loops;
          the plateau detector reads it with a 63d cutoff.
      - file: lib/shared/repositories/exercise_repository.dart
        method: isCompoundByExactName
        notes: >
          shared main-lift predicate (getByExactName + _fieldContains('compound')),
          extracted from DeloadE1rmScan._isCompound; used by the plateau detector.
    readers:
      - file: test/contracts/plateau_escalation_behavioral_test.dart
        method_or_widget: seeds exlog_* + readiness_*, drives plateauedGroups / mergePlateauSetDeltas / applyToWeeks — detector gates, no-double-bump, declining∧flat safety, MRV clamp, byte-identical-off
        semantic: behavioral
      - file: test/plan_generator/plateau_scan_test.dart
        method_or_widget: PlateauScan.isFlat pure flatness-threshold unit test
        semantic: pure
    contract_test_path: test/contracts/plateau_escalation_behavioral_test.dart

  - concept: plateau_rotation
    domain: workout
    behavioral_test_path: test/contracts/plateau_rotation_behavioral_test.dart
    description: >
      W3.5 (Batch 12-B, PRO) — plateau escalation rung-3 EXERCISE ROTATION. At a genuine
      FRESH phase advance the plateaued COMPOUND lifts (same detector as rung-2 — flat
      MAX-Epley e1RM ≥3 sessions ≥28d, 63-day window) are SOFT-avoided in the cascade so
      each rotates to a same-`movement_pattern` sibling next phase.
      `PlateauScan.plateauedExerciseNames({phase})` (per-exercise sibling of
      plateauedGroups, LOWERCASED, SAME gates: enable_plateau_escalation +
      enable_readiness + phase>=2 + !fatigue) → computed in `generateV4` (guarded
      `applyPlateauEscalation && pins == null`) → `pickV4 plateauAvoidNames` → UNIONED
      GLOBALLY into every day's avoidA/avoidB → `_fillSlots`/`_cascadeFill`/
      `_selectCandidate._preferNovel` (the SAME 11-B seam). SOFT + BOUNDED: feeds
      _selectCandidate ONLY (never queryV4/excludeNames) on a guaranteed-non-empty pool
      → never empties a slot / wrong pattern / disturbs the attempt-5 injury floor;
      falls to `pool.first` (the stuck lift RETAINED) on a shallow pool. Ship-dark:
      reuses `enable_plateau_escalation` (NO new flag), INDEPENDENT of 11-B's
      `enable_cross_phase_variety`. DEFAULT OFF / opt-in false → plateauAvoid `{}` → the
      union `{...listA, ...{}}` ≡ `listA.toSet()` → byte-identical. Rotation is a SWAP
      (slot-count-neutral); a rotated-in sibling may carry ±1 base default_sets (bounded,
      pre-existing 11-B). rung-2 (+sets) and rung-3 (rotation) BOTH fire (no cross-gate);
      the +1 lands on the fresh sibling's group, MRV-clamped. rung-1 explainability NOT
      built (terminal: out-of-scope + causally imprecise + breaks pure-compute). No
      migration/restore (Hive-read-only). cascade_tracer `_preferNovelName` +
      generator_matrix UNCHANGED → frozen D3 baseline unmoved. ⚠ L6
      `_applyHistoryAdjustments` (phase≥2, demoted/customs) may re-add a rotated lift —
      consistent with rung-3 being SOFT.
    writers:
      - file: lib/shared/repositories/plan_engine/plateau_scan.dart
        method: PlateauScan.plateauedExerciseNames
        notes: >
          per-exercise sibling of plateauedGroups — same buildE1rmByDate + isFlat +
          isCompoundByExactName scan, collects name.toLowerCase(); same gates; crash-safe {}.
      - file: lib/shared/repositories/plan_engine/plan_generator.dart
        method: generateV4 (plateauAvoid compute + pickV4 arg)
        notes: >
          `plateauAvoid = (applyPlateauEscalation && pinnedExercisesByDay == null)
          ? plateauedExerciseNames(phase) : {}` at Stage 2; passed as pickV4
          plateauAvoidNames. Default false / pins → {} → byte-identical.
      - file: lib/shared/repositories/plan_engine/exercise_selector.dart
        method: pickV4 (plateauAvoidNames param + avoidA/avoidB union)
        notes: >
          new `Set<String> plateauAvoidNames = const {}`; unioned GLOBALLY into every
          day's avoidA/avoidB alongside 11-B previousPhaseByDay names → _preferNovel.
          Empty → same set as .toSet() → byte-identical. Only generateV4 passes it.
    readers:
      - file: lib/shared/repositories/plan_engine/exercise_selector.dart
        method_or_widget: _preferNovel (soft avoid-names tiebreak on a non-empty pool)
        semantic: soft-bias
      - file: test/contracts/plateau_rotation_behavioral_test.dart
        method_or_widget: seeds exlog_* flat plateaus for the baseline plan's compounds → rotation (non-vacuous) + independence + ship-dark + slot-count-invariance + bounded + injury-safe + fatigued-no-rotation + gates
        semantic: behavioral
    contract_test_path: test/contracts/plateau_rotation_behavioral_test.dart

  - concept: repeat_content_scheduling
    domain: workout
    behavioral_test_path: test/contracts/repeat_content_scheduling_test.dart
    description: >
      ⑧ Batch 8 (W2.5 repeat-content) — UNIT 2-int: the PRODUCTION caller of the 2-cap
      pinned-selection capability. On a phase advance (autoGenerateNextPhaseIfNeeded,
      N→N+1) with repeatContent:true AND enable_adherence_gate ON, the just-finished
      phase's exercise SELECTION is pinned into the new phase (variant-A names from
      week 1 → weeks 1/3, variant-B from week 2 → weeks 2/4) at DETRAINED loads (2-cap's
      tail decay), stamped phase=N+1. Extraction (repeatPinsFrom) reads getWeek(1)/
      getWeek(2) BEFORE generateAndSchedule overwrites plan_start; keyed by
      workout_day_index; union of A+B day indices spanned; a gap index → empty entry →
      buildPinnedDays fresh-fills. G5 FAITHFULNESS GATE: pin only when the prior
      generation's last_phase_profile {plan_goal, equipment, days_per_week, effective_exp}
      equals the NEW phase's — effective_exp because effectiveLevel(exp,phase) WIDENS with
      phase (a beginner 2→3 gets different frames); mismatch/absent → FRESH.
      generateAndSchedule stamps last_phase_profile at generation (flag-gated) as the next
      advance's baseline. SHIP-DARK: no surface passes repeatContent:true (UNIT 3 wires it);
      flag OFF → no extraction, no gate, no config write, repeatContent inert →
      byte-identical. Kill-switch PlanEngineFlags.adherenceGateEnabled (enable_adherence_gate).
    writers:
      - file: lib/core/services/workout_schedule_read_service.dart
        method: generateAndSchedule (pinnedExercisesByDay param → generate(); last_phase_profile write)
        notes: >
          param forwarded to PlanGenerator.generate (null every existing caller →
          byte-identical); last_phase_profile = {plan_goal: FitnessGoals.of(goal).planGoal,
          equipment, days_per_week, effective_exp: PlanGenerator.effectiveLevel(exp,phase)}
          written to configBox iff adherenceGateEnabled.
      - file: lib/core/services/workout_schedule_read_service.dart
        method: autoGenerateNextPhaseIfNeeded (repeatContent) + _buildRepeatPins / repeatPinsFrom
        notes: >
          repeatContent flag; _buildRepeatPins reads configBox last_phase_profile + getWeek(1/2)
          BEFORE the plan_start overwrite → delegates to the PURE repeatPinsFrom (G5 gate +
          extraction, @visibleForTesting); pins passed to generateAndSchedule. phase=newPhase.
      - file: lib/core/services/workout_schedule_service.dart
        method: autoGenerateNextPhaseIfNeeded facade (repeatContent forward; ⑧ 3-a2 record return)
        notes: >
          the REAL production path routes splash + the Home/Train PhaseGeneratingCard through the
          shared advanceProPhaseIfExpired helper (lib/shared/services/pro_phase_advance.dart). ⑧ 3-a2:
          the return became a record `({bool generated, bool repeated})` — `repeated == pins != null`
          (a faithful G5 repeat was applied) — read by the helper to set phase_repeat_nudge_pending;
          callers updated to `.generated` (the helper + simulation_service.dart:546). OFF → repeated:false.
      - file: lib/shared/repositories/plan_engine/plan_engine_flags.dart
        method: PlanEngineFlags.adherenceGateEnabled
        notes: enable_adherence_gate, try/catch→false (ship-dark default OFF), mirrors triggeredDeloadEnabled.
    readers:
      - file: lib/core/services/workout_schedule_read_service.dart
        method_or_widget: generateAndSchedule's 4-week row-writer consumes the pinned Phase
        semantic: the schedule_* rows carry the pinned exercises stamped phase=N+1
      - file: test/contracts/repeat_content_scheduling_test.dart
        method_or_widget: pure repeatPinsFrom (G5 + extraction) + Hive generateAndSchedule wiring
        semantic: >
          match→A/B pins by index · effectiveExp/planGoal/equipment/days MISMATCH→null ·
          absent/empty→null (crash-guard) · gap-index→empty-entry+B-only spanned · pins→wk1/wk2
          rows · last_phase_profile flag-gated. TRIGGER (repeatContent) is WIRED by UNIT 3-a2 (the
          splash-default `adherenceGateEnabled && currentPhaseCompletionRate() < 0.8` in
          advanceProPhaseIfExpired); the return became a record read for the repeat nudge.
    contract_test_path: test/contracts/repeat_content_scheduling_test.dart

  - concept: phase_repeat_nudge
    domain: workout
    behavioral_test_path: test/contracts/phase_repeat_nudge_test.dart
    reader_manifest_complete: false  # Gate-18's detector matches .get/.put/.startsWith, NOT
    # MigratedKey.read/write — a `true` here would pass vacuously (feedback_source_grep_false_confidence).
    # The writer→reader contract is pinned by the behavioral test instead.
    description: >
      ⑧ Batch 8 (W2.5) — UNIT 3-a2: the local-only "you repeated — step it up?" nudge. When a PRO
      phase advance actually REPEATS last phase's plan (adherence-gate flag ON + low completion),
      advanceProPhaseIfExpired flags phase_repeat_nudge_pending=true; Home surfaces a dismissible,
      non-shaming banner and clears the flag ONLY on the explicit dismiss (never in build) so it
      survives Home rebuilds. User-scoped (MigratedKey → userBox; registered in
      UserConfigMigrator.userScopedKeys) + cross-account gated — the write requires
      HiveUserSession.currentOwnerFullId != null (the codified expiry-banner P0 belt: a non-null uid
      does NOT imply the owner opened, and a null owner makes MigratedKey fall back to the
      device-shared configBox → cross-account leak). Local-only: never synced/restored (a userBox flag
      is not walked by any sync fan-out). SHIP-DARK: only ever SET when the gate drove a repeat →
      enable_adherence_gate OFF ⇒ never written ⇒ never surfaces.
    writers:
      - file: lib/shared/services/pro_phase_advance.dart
        method: markPhaseRepeatNudgePending (⑧ 3-b — SHARED writer, cross-account gated on currentOwnerFullId != null)
        notes: >
          MigratedKey.write('phase_repeat_nudge_pending', true) — user-scoped + cross-account gated
          (the belt lives INSIDE this shared writer). Called by advanceProPhaseIfExpired (splash/card,
          on result.repeated) AND the graduation choice sheet's repeat branch
          (runGraduationPhaseAdvance, on pins != null — same predicate as repeated). ⑧ 3-b.
          Unit B / b4e9c7 (2026-08-03): the graduation caller moved from
          graduation_screen.dart `_onPro` into runGraduationPhaseAdvance, in the
          SAME file as this writer. The `ref.invalidate(phaseRepeatNudgeProvider)`
          that used to sit beside it could NOT follow — phaseRepeatNudgeProvider
          lives in lib/features/home/. `lib/shared -> lib/features` is a
          CONVENTION, not a gated rule (four imports already breach it and no
          check_*.dart enforces it) — the split is justified by which layer
          owns the work, not by an invariant. GraduationAdvanceResult.repeatNudgeFlagged is the seam:
          this writer still does the Hive write, the SCREEN does the invalidate.
          Drop the flag and the nudge is written but does not surface until the
          next app launch. Pinned by test/contracts/advance_choice_test.dart,
          which also asserts pro_phase_advance.dart never names the provider.
    readers:
      - file: lib/features/home/providers/home_provider.dart
        method_or_widget: phaseRepeatNudgeProvider (PhaseRepeatNudgeNotifier)
        semantic: >
          build() reads MigratedKey.read<bool>('phase_repeat_nudge_pending') ?? false; dismiss()
          writes false + state=false — cleared ONLY on dismiss (never in build) so it survives rebuilds.
      - file: lib/features/home/screens/home_screen.dart
        method_or_widget: _buildRepeatNudge → PhaseRepeatNudgeBanner (dismissible, non-shaming)
        semantic: renders iff the flag is true; onDismiss → phaseRepeatNudgeProvider.notifier.dismiss().
    contract_test_path: test/contracts/phase_repeat_nudge_test.dart

  - concept: graded_progression
    domain: workout
    behavioral_test_path: test/contracts/progression_resolver_graded_test.dart
    description: |
      W2.1 (Batch 3b-ii) — ProgressionResolver.resolve()'s progress/hold/back-off
      rule becomes REP-RANGE-aware (from the ⑦a base): reps ≥ hi → progress, within
      → hold, below lo → back off ONLY on the top-2 most-recent DISTINCT calendar
      days BOTH below lo (2-consecutive gate; de-dupe by (y,m,d) so a same-day re-log
      can't trip it). Beginner auto-linear window (RAW fitness_experience=='beginner'
      AND training-age from onboarding_completed_at < 120 days → always progress).
      Rep-ranges are threaded via a new `repRanges` param (name→PlannedExercise.repRange
      from the call site). **Kill-switch `enable_graded_progression` (default OFF,
      ship-dark §4.6 — W2.1 can INCREASE load, not the safe direction)** → resolve()
      uses the verbatim fixed-10/5 rule (byte-identical, incl. the shipped ⑦a decay
      which is INDEPENDENT: base/est1rm stay on the single-most-recent lastSession,
      unchanged). Shared `parseRepRange` (models.dart) used by BOTH resolve() AND
      PeriodizationEngine._applyWave (no 2nd parser — #1 bug class; inertness pinned by
      periodization_wave_reps_invariant_test.dart). training-age via DateTime.tryParse
      (null onboarding_completed_at ⇒ not-linear, never throws).
    writers:
      - file: lib/shared/repositories/plan_engine/progression_resolver.dart
        method: resolve (graded branch) + _gradedSuggestion + _top2DistinctDays + _backOff
        notes: ON-branch rep-range banding + 2-consecutive gate + beginner-linear; OFF = verbatim fixed-10/5; top-2 is ADDITIVE (never feeds base/est1rm)
      - file: lib/shared/repositories/plan_engine/models.dart
        method: parseRepRange
        notes: shared "lo-hi" → (int,int)? parser (both positive, lo≤hi, else null); one parser for resolve + periodization
      - file: lib/shared/repositories/plan_engine/plan_engine_flags.dart
        method: gradedProgressionEnabled
        notes: kill-switch enable_graded_progression, default OFF (ship dark), own try/catch → false
      - file: lib/shared/repositories/plan_engine/plan_generator.dart
        method: generateV4 (Stage 0 repRanges map)
        notes: builds name→repRange from populated + threads it into resolve()
    reader_manifest_complete: true
    readers:
      - file: lib/shared/repositories/plan_engine/periodization_engine.dart
        method: apply (previousWeights) + _applyWave (parseRepRange)
        semantic: pass-through
        notes: consumes the graded suggested weight; _applyWave now uses the shared parseRepRange (behavior-preserving on real data)
    contract_test_path: test/contracts/progression_resolver_graded_test.dart

  - concept: session_detraining_cut
    domain: workout
    behavioral_test_path: test/contracts/session_detraining_cut_test.dart
    description: |
      ⑦(b) (Batch 3, remaining half) — on STARTING a workout after a training gap,
      the active-workout last-logged-weight PREFILL is scaled by
      detrainingFactorForGap(WorkoutRepository.getDaysSinceLastWorkout()) for that
      SESSION only (never persisted, no plan regen), and a non-shaming "welcome
      back" banner shows. Applies ONLY to the lastWeight prefill branch — NOT the
      prescribed exercise.weight branch, which already carries ⑦a decay (disjoint
      inputs → no double-count). The factor lives on ActiveWorkoutData and MUST be
      threaded through copyWith (else the 1×/sec elapsed-timer copyWith reverts it
      to 1.0 within a frame — round-2 F1). The overload indicator compares the
      entered weight against the CUT TARGET (last×factor) so an unedited reduced
      prefill reads neutral → not red ↓; the progressive-overload "TRY:" hint is
      suppressed while the cut is active ("never shame"; the factual "LAST:" line
      stays). Trigger gap uses local DateTime.now() (getDaysSinceLastWorkout),
      unlike ⑦a's IST-string gap — day-granularity tolerates the sub-day skew; a
      gap ≤7d (incl. -1 no-history / 0 logged-today) → factor 1.0 → no cut, no
      banner. Kill-switch configBox['enable_session_detraining_cut'] DEFAULT OFF
      (ship dark §4.6 — changes the interactive logging UI). NOTE: the _metaText
      subtitle prints the ⑦a-decayed PRESCRIPTION (exercise.weight) which can
      exceed the cut prefill — a static prescription, pre-existing prefill-vs-
      prescription split, NOT a shame directive (round-2 F3).
    writers:
      - file: lib/features/train/providers/train_provider.dart
        method: ActiveWorkoutNotifier.startWorkout + ActiveWorkoutData.copyWith
        notes: startWorkout sets sessionDetrainingFactor = detrainingFactorForGap(getDaysSinceLastWorkout()) when sessionDetrainingCutEnabled; copyWith threads the field (F1) or the 1×/sec timer reverts it to 1.0
      - file: lib/core/utils/detraining.dart
        method: detrainingFactorForGap
        notes: shared reduce-only band table (also ⑦a); ≤7→1.0 / 8-21→0.925 / 22-35→0.825 / >35→0.5
      - file: lib/shared/repositories/plan_engine/plan_engine_flags.dart
        method: sessionDetrainingCutEnabled
        notes: kill-switch enable_session_detraining_cut, DEFAULT OFF (ship dark), own try/catch → false
    reader_manifest_complete: true
    readers:
      - file: lib/features/train/screens/active_workout/exercise_card.dart
        method: _ExerciseCardState._initControllers (prefill) + the LAST/TRY hint Builder
        semantic: scale-and-suppress
        notes: lastWeight prefill × widget.data.effectiveLoadFactor(ex) (lastWeight branch ONLY; ⑥ 6-B — min of ⑦b gap-cut ∧ readiness deload, == sessionDetrainingFactor when readiness null); "TRY:" line hidden when effectiveLoadFactor(ex) < 1.0 (⑥ 6 B-pass P2-1); "LAST:" kept
      - file: lib/features/train/screens/active_workout/overload_indicator.dart
        method: _OverloadIndicator.build
        semantic: compare-vs-target
        notes: target = lastWeight × loadFactor (fed widget.data.effectiveLoadFactor(ex), ⑥ 6 B-pass P2-1; parse/toString round-trip → == exactly); factor 1.0 → byte-identical to pre-⑦b
      - file: lib/features/train/screens/active_workout/screen.dart
        method: build (resume banner)
        semantic: visibility
        notes: non-shaming resume banner shown iff sessionDetrainingFactor < 1.0
    contract_test_path: test/contracts/session_detraining_cut_test.dart

  - concept: physique_focus_bringup
    domain: workout
    behavioral_test_path: test/contracts/physique_focus_bringup_test.dart
    description: |
      ⑤ (Batch 4, Option 1) — the user's self-selected `physique_focus`
      (userBox['profile'], tokens balanced/glutes_legs/chest_shoulders_arms/
      strength) now shapes the plan: CENTRALLY translated to lowercased
      muscle-substring tokens and fed to `effectiveBodyFocus`
      (via TrainingHistoryAnalyzer.resolveBodyFocus at the plan_generator.dart:148-155
      seam), which PeriodizationEngine turns into +1 SET
      per matching exercise (primaryMuscles.any(contains); break → max +1/ex).
      Explicit focus takes PRECEDENCE over the auto weakMuscles() laggard signal
      and applies at ALL phases; balanced/strength/absent → [] → falls back to
      weakMuscles() (phase≥2) exactly as before. Read via a try/catch
      TrainingHistoryAnalyzer.physiqueFocusMuscles() helper (degrades to [] on
      null/corrupt/unopened profile, mirroring weakMuscles) so NO Hive coupling
      enters plan_generator. Kill-switch `enable_physique_focus_bringup` DEFAULT
      OFF (ship dark §4.6 — +1-set INCREASES prescribed volume) → seam
      byte-identical to pre-⑤ (focus=[] → verbatim `bodyFocus.isEmpty && phase>=2
      ? weakMuscles() : bodyFocus`). The DEDICATED isolation SLOT is a
      founder-deferred future advancement (2026-07-13) — the trade-not-add slot
      mechanic was proven infeasible (VolumeFilter is POSITIONAL take(N), not
      priority-sorted; focus muscle already kept on its theme day). Upstream
      physique_focus writers: edit_profile_screen.dart:1616 +
      induction_service.dart:209 (muster bridge).
    writers:
      - file: lib/shared/repositories/plan_engine/training_history_analyzer.dart
        method: physiqueFocusMuscles + physiqueFocusToBodyFocus + resolveBodyFocus
        notes: try/catch Hive read → pure token→muscle-substrings translation (→ [] on null/corrupt like weakMuscles); resolveBodyFocus is the flag-gate + precedence GLUE (explicit > physique_focus > weakMuscles), directly behavior-tested (B-pass P2)
      - file: lib/shared/repositories/plan_engine/plan_generator.dart
        method: generateV4 (effectiveBodyFocus seam)
        notes: seam is a one-liner calling TrainingHistoryAnalyzer.resolveBodyFocus(explicitBodyFocus, phase); flag OFF → byte-identical
      - file: lib/shared/repositories/plan_engine/plan_engine_flags.dart
        method: physiqueFocusBringupEnabled
        notes: kill-switch enable_physique_focus_bringup, DEFAULT OFF (ship dark), own try/catch → false
    reader_manifest_complete: true
    readers:
      - file: lib/shared/repositories/plan_engine/periodization_engine.dart
        method: apply (bodyFocus +1 set)
        semantic: pass-through
        notes: existing mechanism — +1 set per exercise whose primaryMuscles contains a focus token (unchanged; ⑤ just feeds it translated tokens)
    contract_test_path: test/contracts/physique_focus_bringup_test.dart

  - concept: equipment_needed_shape
    domain: workout
    behavioral_test_path: test/contracts/equipment_needed_shape_test.dart
    description: |
      Each exercise's library `equipment_needed` is a List<String> (249/258 rows).
      9 rows (E252–E260) stored a bare STRING ("Bodyweight"/"Dumbbells") — a naive
      `as List?` cast on it threw _CastError, CRASHING the swap / add-exercise
      picker when any of those 9 (Incline Dumbbell Press, Split Squat, Wall Sit, …)
      was selected. Batch 5 crash fix: the 9 rows corrected to Lists in
      assets/data/exercise_library.json + SeedService `_exerciseLibraryVersion`
      bumped 5→6 to re-seed; readers route through the shape-tolerant
      `ExerciseData.parseEquipmentNeeded` (List → stringified; non-empty String →
      [String]; else const []) so a bad shape (legacy/restored) never crashes. The
      free-text vocab normalization (~89 tokens) + item-level queryV4 exclusion
      filtering are the later Batch-5 A/B slices (queryV4 today filters on
      `equipment_tier`, not `equipment_needed`).
    writers:
      - file: assets/data/exercise_library.json
        method: equipment_needed field (List<String> per row)
        notes: 9 bare-String rows (E252–E260) corrected to Lists; seeded verbatim into exerciseBox by SeedService
