  - concept: sync_scheduled_payload_hash_index
    domain: workout
    description: |
      H1b Part A (2026-06-27, b4f7e2): the sync-owned fingerprint index that
      gates the idempotent scheduled_workouts re-upsert. Maps scheduled_date ->
      UUID-v5 fingerprint of the exact payload last CONFIRMED to cloud, so an
      unchanged PLANNED row skips its re-upsert (the returning-login ~96-upsert
      tax). The SOLE writer AND reader is _syncScheduledWorkouts ⇒ writer/reader
      drift is structurally impossible. The per-user workoutBox file IS the
      namespace -> auto-clears on swap/sign-out/DPDP.
    writers:
      - file: lib/core/services/sync/sync_workout.dart
        line_range: 1-9999
        method: _syncScheduledWorkouts (stores index[date]=fingerprint ON CONFIRMED 200 ONLY at the 3 upsert success points; prunes to live rows + persists after the loop)
      - file: lib/core/services/sync_service.dart
        line_range: 1-9999
        method: schedPayloadFingerprint / schedShouldSkipUpsert / schedPrunedHashIndex (pure statics) + _schedHashIndexKey const + disable_sched_hash_skip kill-switch
      - file: lib/features/dev/simulation_service.dart
        line_range: 1-9999
        method: resetJourney (A-fix-3 — clears the index key in the workoutBox prefix-clear list)
    reader_manifest_complete: true
    readers:
      - file: lib/core/services/sync/sync_workout.dart
        line_range: 1-9999
        method: _syncScheduledWorkouts (the skip decision reads index[date] for the current row)
        semantic: latest
        fields_read: [sync_sched_payload_hash_index.<scheduled_date>]
    regression_test: test/contracts/sync_scheduled_payload_hash_index_writer_to_reader_test.dart
    behavioral_test_path: test/contracts/sync_scheduled_payload_hash_index_writer_to_reader_test.dart
    hive:
      box: workoutBox
      key_prefix: "sync_sched_payload_hash_index"
      key_formula: "reserved single key -> Map{scheduled_date: SyncService._deterministicId(canonical fixed-order payload string)}"
    cloud:
      table: scheduled_workouts
      columns: [user_id, template_id, scheduled_date, week_number, day_of_week, status, completed_at]
      unique_constraint: "(user_id, scheduled_date)"
    sync_methods: [_syncScheduledWorkouts]
    restore_methods: []
    class_constraints: |
      A-fix-1: a row with status=='completed' is NEVER skipped (cloud can be
      silently stale per d9b2c5; a mis-skip is made PERMANENT by the resync
      migrator's one-shot flag). store-on-200-only: a failed push records no
      fingerprint -> re-pushes next pass. Kill-switch disable_sched_hash_skip
      restores the verbatim pre-H1b unconditional sweep.

