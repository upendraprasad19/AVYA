  - concept: ai_snapshot_building
    domain: ai_coach
    description: |
      buildAiContext is the ONE builder. _compactContext is the ONE
      trimmer. Never construct ad-hoc snapshots in provider code.
      Trim order: step_history_7d → water_7d → weight_trend →
      nutrition_trend_7d → exercise_history → personal_records →
      coach_notices → truncate coaching_notes (1000 chars) →
      drop fitness_summary. Never-drop set: data_window_days,
      current_plan_summary, today_workout, yesterday_workout,
      week_lookahead, meals_today, current_rank, next_rank,
      subscription, committed_at, committed_to_lt_cdr.
    writers:
      - file: lib/features/ai_coach/repositories/ai_coach_repository.dart
        line_range: 23-200
        method: buildAiContext
    reader_manifest_complete: true
    readers:
      - file: lib/core/services/ai_service.dart
        line_range: 128-173
        method: _compactContext
        semantic: pass-through
        fields_read: [step_history_7d, water_7d, weight_trend, nutrition_trend_7d, nutrition_trend, exercise_history, personal_records, coach_notices, coaching_notes, fitness_summary]
        notes: |
          ONE trimmer. Iterates trimSteps list dropping keys until JSON
          encode length ≤ _maxSnapshotBytes (9500). Then truncates
          coaching_notes Map/String to 1000 chars. Last resort drops
          fitness_summary. Never-drop keys are intentionally absent
          from trimSteps.
      - file: lib/core/services/ai_service.dart
        line_range: 265-548
        method: chat / chatWithMedia / predict / direct HTTP fallbacks
        semantic: pass-through
        fields_read: [<full context map>]
        notes: |
          Every external AI call wraps the context map through
