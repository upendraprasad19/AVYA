  - concept: subscription_state
    domain: subscription
    behavioral_test_path: test/contracts/subscription_expiry_banner_behavioral_test.dart
    description: |
      isPro() + gateAndVerify() are the ONLY entitlement DECISION entry points.
      Never read configBox.get('isPro') directly from a widget. High-value
      features go through verifyFromServer() with 5-min cache TTL.
      Build-method callsites must use ref.watch(subscriptionInfoProvider).isPro
      so they rebuild on Razorpay success.

      OI-44 Unit 6 (diagnose a9c4e1) split the read from the enforcement:
        - isPro()            DECISION — enforces (may downgrade), then reports.
        - proStateSnapshot() PURE     — required in Riverpod build methods.
        - evaluateEntitlement()       — enforce WITHOUT asking; boot + user swap.
      Calling isPro() from a provider build made that provider invalidate
      ITSELF (build -> isPro -> _downgradeLocally -> onStateChanged ->
      app.dart:47 ref.invalidate). §4.6 kill-switch: disable_cqrs_pure_pro_read.
      Gate: scripts/check_cqrs_query_naming.dart blocks a query-named mutator
      returning.
    behavioral_test_path_cqrs: test/contracts/subscription_cqrs_behavioral_test.dart
    writers:
      - file: lib/core/services/subscription_service.dart
        line_range: 1048-1088
        method: _downgradeLocally (the SINGLE downgrade sink — every path funnels here)
      - file: lib/core/services/subscription_service.dart
        line_range: 414-480
        method: _enforceEntitlementInvariants (cross-account guard + genuine-expiry downgrade)
        notes: |
          OI-44 Unit 6 (diagnose a9c4e1) — the MUTATING half extracted out of
          isPro(). Both branches are the pre-split code verbatim. pro_lapsed_at
          (diagnose 2026-06-06) is stamped ONLY on the genuine-expiry branch,
          never on the cross-account wipe; it survives the expiresAt wipe so the
          Home expiry banner can surface "PRO expired".
      - file: lib/core/services/subscription_service.dart
        line_range: 481-489
        method: evaluateEntitlement (explicit public enforcement entry point)
        notes: |
          Called at the two moments local state can BECOME cross-account:
          boot (splash_screen.dart:220) and account swap (_onUserChanged, :56).
          Pre-split this was covered incidentally by every isPro() read;
          refreshFromSupabase does NOT cover it (it decides from the SERVER
          response and never compares Hive profile.id against the session).
      - file: lib/core/services/subscription_service.dart
        line_range: 258-337
        method: writeSubscriptionState (atomic putAll; clears pro_lapsed_at on renewal)
      - file: lib/core/services/subscription_service.dart
        line_range: 878-977
        method: verifyFromServer (server-confirmed upgrade / anti-spoof downgrade)
    reader_manifest_complete: true
    readers:
      - file: lib/core/services/subscription_service.dart
        line_range: 338-366
        method: isPro — the DECISION entry point
        semantic: flag-check
        fields_read: [isPro, expiresAt, plan]
        notes: |
          Enforces the invariants (may downgrade) then reports. Behaviour is
          byte-identical to the pre-split version, so all 32 decision callsites
          keep their defense-in-depth. Use this for an entitlement DECISION.
      - file: lib/core/services/subscription_service.dart
        line_range: 367-391
        method: proStateSnapshot — the PURE read
        semantic: flag-check
        fields_read: [isPro, expiresAt]
        notes: |
          Zero writes, zero telemetry. Required in Riverpod BUILD methods and
          in code already inside an entitlement evaluation. Calling isPro()
          from a build method made subscriptionInfoProvider invalidate ITSELF
          (build -> isPro -> _downgradeLocally -> onStateChanged -> app.dart:47
          ref.invalidate). Diagnose a9c4e1.
      - file: lib/core/services/subscription_service.dart
        line_range: 610-700
        method: gateAndVerify (gate() retained as a @Deprecated shim at :578)
        semantic: flag-check
        fields_read: [isPro, expiresAt, plan]
        notes: |
          Returns Future<void> since OI-44 Unit 6 so a caller can await the
          decision — it dispatches an async verify whose callbacks decide the
          outcome, and while it was `void` a silently-dying chain just made
          taps vanish (diagnose 7b3eaf). Routes the high-value set
          (phases_2_to_12, ai_coach_unlimited, progress_photos) through
          verifyFromServer() with a 5-min cache TTL.
      - file: lib/features/profile/providers/profile_provider.dart
        line_range: 365-422
        method: SubscriptionInfoNotifier / subscriptionInfoProvider
        semantic: pass-through
        fields_read: [isPro, expiresAt, plan, isVerifying]
        notes: |
          Canonical reactive reader; lives in profile_provider.dart (NOT a
          separate file). Build-method callsites must use ref.watch on this
          provider so payment success rebuilds them. Razorpay invalidates it via
          razorpay_service.dart:540. Its build() MUST use proStateSnapshot(),
