        notes: One of six alert functions sharing an identical userState shape.
      - file: supabase/functions/pr-detection/index.ts
        line_range: 1-9999
        method: proactive alert prompt
        semantic: sanitise
        fields_read: [userState]
        notes: Same family.
      - file: supabase/functions/protein-gap-alert/index.ts
        line_range: 1-9999
        method: proactive alert prompt
        semantic: sanitise
        fields_read: [userState]
        notes: Same family.
      - file: supabase/functions/re-engagement/index.ts
        line_range: 1-9999
        method: proactive alert prompt
        semantic: sanitise
        fields_read: [userState]
        notes: Same family.
      - file: supabase/functions/streak-guardian/index.ts
        line_range: 1-9999
        method: proactive alert prompt
        semantic: sanitise
        fields_read: [userState]
        notes: |
          Same family, but its userState carries recent_pr_exercise -- an
