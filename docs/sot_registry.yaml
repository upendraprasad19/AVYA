        notes: "subscriptionInfoProvider lives in profile_provider.dart (not a separate file)"
    regression_test: test/subscription/payment_grace_window_test.dart
    telemetry:
      success_op_types: [subscription_refresh_grace_skip, subscription_refresh_success]
    class_constraints: |
      Grace window is 10 minutes. Cleared on webhook confirmation
      OR grace expiry, whichever is first.

  # ─── NEW CONCEPTS (Phase B) ────────────────────────────────────────────────

  - concept: workout_completion_status
    domain: workout
    description: |
      The schedule_<date>.status field drives the calendar, home card state,
      and streak logic. Legal values: planned | completed | skipped | shifted.
      "completed" is sacred — WorkoutScheduleService guards against overwriting
      it on reschedule or re-generate. Driven APK Test #12.9 Bug 5.1 (restore
      was writing status=planned over cloud-authoritative status=completed).
    writers:
      - file: lib/core/services/workout_schedule_service.dart
        line_range: 785-850
        method: markScheduleCompleted
        notes: sole setter for status='completed'; guards if already completed
      - file: lib/core/services/sync_service.dart
        line_range: 1-9999
        method: _restoreWorkoutPlan
        notes: |
          APK Test #12.9 — _restoreWorkoutPlan now runs BEFORE
          _restoreScheduledWorkouts so cloud-authoritative status='completed'
          rows survive the schedule overwrite window.
    readers:
      - file: lib/features/home/providers/home_provider.dart
        line_range: 1-9999
        method: todayWorkoutProvider
      - file: lib/features/train/providers/train_provider.dart
        line_range: 593-628
        method: currentPlanProvider (weekDays status check)
      - file: lib/features/ai_coach/repositories/ai_coach_repository.dart
        line_range: 1-9999
        method: _getThisWeekWorkouts
    regression_test: test/sync/restore_ordering_and_sweep_test.dart
    hive:
      box: workoutBox
      key_prefix: "schedule_"
      key_formula: "'schedule_${istDateStr(date)}'"
    cloud:
      table: scheduled_workouts
      columns: [user_id, scheduled_date, status]
      unique_constraint: "(user_id, scheduled_date)"
    sync_methods: [_syncScheduleCompletions]
    restore_methods: [_restoreWorkoutPlan, _restoreScheduledWorkouts, _restoreScheduleCompletions]
    provider_invalidation_set: [currentPlanProvider, calendarWeekProvider, todayWorkoutProvider, streakProvider]
    ist_sites:
      - { file: lib/core/services/workout_schedule_service.dart, line: 258, fn: _generateSchedule }
    forbidden_legacy_patterns:
      - { pattern: "workoutBox\\.put.*schedule.*status.*planned", reason: "Never overwrite status=completed; check guard first" }
    class_constraints: |
      "completed" is write-once per date. Any method that sets status
      MUST check existing status and skip if already 'completed'.
      _restoreWorkoutPlan must complete before _restoreScheduledWorkouts.

  - concept: workout_templates
    domain: workout
    description: |
      Workout templates stored as tmpl_<ms> or tmpl_<nameHash> Hive keys.
      Multi-day AI templates split into N rows with group_id/group_day_index.
      Cloud: workout_templates parent + template_exercises children.
      UNIQUE(user_id, name) on workout_templates prevents duplicate names
      (migration 050). UNIQUE(template_id, order_index) on
      template_exercises (migration 051) enables upsert with onConflict
      so partial-failure recovery is row-level instead of template-level
      (replaced fragile DELETE-then-INSERT pattern in
      _syncWorkoutTemplates).
    writers:
      - file: lib/features/train/repositories/workout_repository.dart
        line_range: 1415-1560
        method: saveTemplate (single-day) + createMultiDayTemplate
      - file: lib/features/train/screens/template_builder_screen.dart
        line_range: 367-380
        method: _buildTemplate
      - file: lib/features/ai_coach/services/tool_dispatcher.dart
        line_range: 920-960
        method: createCustomTemplate tool
    readers:
      - file: lib/features/train/providers/train_provider.dart
        line_range: 1647-1700
        method: TemplatesNotifier
      - file: lib/features/ai_coach/services/schedule_template_planner.dart
        line_range: 124-240
        method: ScheduleTemplatePlanner (tmpl_* scan)
      - file: lib/core/services/sync_service.dart
        line_range: 1-9999
        method: _syncWorkoutTemplates
    regression_test: test/contracts/templates_unique_constraint_test.dart
    hive:
      box: workoutBox
      key_prefix: "tmpl_"
      key_formula: "'tmpl_${DateTime.now().millisecondsSinceEpoch}' or 'tmpl_${name.hashCode.toUnsigned(32).toRadixString(16)}'"
    cloud:
      table: workout_templates
      columns: [id, user_id, name, exercises, type, assigned_days, group_id, group_day_index, group_total_days, created_at]
      unique_constraint: "(user_id, name) on workout_templates; (template_id, order_index) on template_exercises (migration 051)"
    sync_methods: [_syncWorkoutTemplates]
    restore_methods: [_restoreWorkoutTemplates]
    provider_invalidation_set: [currentPlanProvider, calendarWeekProvider, todayWorkoutProvider]
    telemetry:
      failure_op_types: [sync_workout_templates, restore_workout_templates]
    class_constraints: |
      Single-day templates: one tmpl_* row. Multi-day: N rows with
      group_id + group_day_index + group_total_days fields.
      Cloud id must be deterministic v5 UUID keyed on (user_id, lower(name)).

  - concept: exercise_personal_records
    domain: workout
    description: |
      PR detection: after each set log, _rescanPrFor walks all exlog_* rows
      for the exercise chronologically (sorted by date+created_at), marks
      is_pr=true where weight strictly exceeds prior best (>) — never >= .
      allExercisePRsProvider is the single read path for UI display.
    writers:
      - file: lib/core/services/workout_write_service.dart
        line_range: 292-330
        method: _rescanPrFor
        notes: called inside logExercise after every set commit
      - file: lib/features/train/widgets/edit_workout_log_sheet.dart
        line_range: 256-270
        method: EditWorkoutLogSheet.save (also rescans is_pr on edit)
    readers:
