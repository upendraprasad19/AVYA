      - file: lib/core/services/water_target_service.dart
        line_range: 32-95
        method: currentTargetMl + computeFromProfile + setUserOverride
    # audit-2026-05-16 reader-side — full enumeration of every
    # callsite that reads the current water target. WaterTargetService
    # itself is the canonical computation; everything else watches the
    # provider or reads the singleton.
    reader_manifest_complete: true
    readers:
      - file: lib/features/nutrition/providers/nutrition_provider.dart
        line_range: 1580-1583
        method: waterTargetProvider (Provider<int>)
        semantic: pass-through
        fields_read: [via WaterTargetService.instance.currentTargetMl()]
        notes: |
          Canonical Riverpod entry. Rebuilds on authUserIdTokenProvider
          change (c4055a cross-account guard).
      - file: lib/features/nutrition/widgets/hydration_card.dart
