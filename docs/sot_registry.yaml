    regression_test: test/contracts/error_telemetry_payload_contract_test.dart
    telemetry:
      success_op_types:
        - auth_signed_in
        - auth_signed_up
        - auth_signed_out
        - auth_user_ensured
        - hive_session_opened
        - hive_session_closed
        - subscription_refresh_success
        - restore_started
        - restore_completed
