  - concept: phase_progress_current_phase
    domain: workout
    # c8f3d1 / Unit 3c: was phase_progress_reconciler_test.dart, which is a PURE
    # test of reconciledPhase(int,int) and never touches the write path — the
    # gated field pointed at the one test that could not fail if the writer
    # broke. Now points at the behavioral test that drives the real advance
    # (the reconciler's own pure test is still cited on its writer entry below).
    behavioral_test_path: test/contracts/pro_phase_advance_behavioral_test.dart
    description: |
      The user's current phase number (user_progress.current_phase). The Train
      week-selector phase labels MUST derive from this single SoT (not hardcoded
      PHASE I/II/III). PhaseProgressReconciler maintains the invariant
      current_phase >= (completed past phase blocks)+1, monotonically (two-Phase-1
      fix a3f8c1, 2026-06-02). Past-phase blocks come from the shared
      WorkoutScheduleReadService.pastPhaseBlocks() bucketing (consumed by both the
      week selector AND the reconciler — one SoT, no drift).
    writers:
      - file: lib/shared/repositories/user_repository.dart
        method: saveProgress / updateProgress
        notes: >
          stamps deployments_complete = max(prior, current_phase-1), monotonic —
          and NOTHING guards current_phase itself here, deliberately: a blanket
          monotonic guard at this level would break the two legitimate resets to
          phase 1 (onboarding_provider.dart's first-ever write, the dev
          resetJourney). The guard lives on the ADVANCE operation instead (c8f3d1).
      - file: lib/core/services/phase_progress_reconciler.dart
        method: reconcile (uses pure reconciledPhase)
        notes: >
          monotonic heal; advances current_phase to completedBlocks+1. Called from
          restoring_screen.dart (post-auth restore), NOT from the splash boot path —
          the "boot heal" shorthand used elsewhere is imprecise. Its pure decision is
          pinned by test/contracts/phase_progress_reconciler_test.dart. c8f3d1: its
          body now runs under withPhaseAdvanceLock, because it derives completedBlocks
          from pastPhaseBlocks() — the schedule_* rows a concurrent locked
          generateAndSchedule is mid-rewrite of — and reconciledPhase's own header
          notes a monotonic over-advance is unrecoverable.
      - file: lib/shared/services/pro_phase_advance.dart
        method: commitPhaseAdvance (+ pure phaseAdvanceTarget) — THE single advance writer
        notes: >
          Unit 3c / c8f3d1 (2026-08-01). Re-reads current_phase from Hive AT WRITE
          TIME and refuses a lower-or-equal value; a skip skips the WHOLE delta
          (current_week + phase_started_at + plan_generated_at), never a partial.
          Emits phase_advance_conflict_skipped on a skip. Added because all three
          advance callers computed their target BEFORE a slow plan-generation await
          and wrote it after — the monotonic-demotion class
          (feedback_monotonic_field_recompute_demotion.md, 3a7b9f).
      - file: lib/shared/services/pro_phase_advance.dart
        method: runProPhaseAdvance (splash unawaited + PhaseGeneratingCard CTA)
        notes: >
          calls commitPhaseAdvance(intendedPhase: currentPhase + 1). The session
          bootstrap (ensureOpenedForCurrentSession) lives in the public
          advanceProPhaseIfExpired wrapper, under withPhaseAdvanceLock; the core is
          @visibleForTesting so the write path is behaviorally drivable (task #41).
      - file: lib/shared/services/pro_phase_advance.dart
        method: runGraduationPhaseAdvance (the explicit graduation unlock)
        notes: >
          generation + commit run under the SHARED withPhaseAdvanceLock. Unit B /
          b4e9c7 (2026-08-03, closes OI-84) RELOCATED this from
          graduation_screen.dart `_onPro`, where it was a ~120-line closure in a
          909-line file held under Gate 43's ceiling only by an allow-list entry.
          Behaviour unchanged; the `bool?` return became GraduationAdvanceResult
          (busy / preemptedBeforeGenerate / generatedButDeclined / committed +
          repeatNudgeFlagged) because `false` had covered two outcomes that
          already emitted DIFFERENT telemetry.
          The lock is still taken after the choice sheet closes, never across it —
          that ordering is now the CALLER's, enforced by where the call sits in
          `_onPro`. The screen keeps the pre-lock live-phase abort re-check (kept
          there deliberately: moving it would flash the generating spinner on a
          path that only navigates), the busy snackbar
          (phase_unlock_advance_busy → /train), and the provider invalidations.
      - file: lib/features/dev/simulation_service.dart
        method: _maybeAdvancePhase (kDebugMode dev harness)
        notes: commitPhaseAdvance(now: nowWall()) — keeps the sim clock seam.
      - file: lib/shared/repositories/user_repository.dart
        method: mergeCloudProgress (+ monotonicProgressFields) — THE single RESTORE merge
        notes: >
          Unit A / d1f6b3 (2026-08-03), closes OI-83. The five writers above are all
          ADVANCE-side; this is the RESTORE side, and until now it had no guard at all.
          Pure local-max-wins over exactly 3 monotonic fields (current_phase,
          deployments_complete, total_workouts_done); every other key
          keeps the prior cloud-non-null-wins semantics. §4.6 kill-switch
          `disable_progress_restore_monotonic_merge` (platform tier requires a
          feature_flag, blast_radius.yaml:25). Deliberately EXCLUDES `longest_gap_days`
          — INVERTED (higher is worse, gates a rank at rank_service.dart:506, no client
          writer, already GREATESTed server-side by migration 115), so max-wins there
          could only refuse a server correction; removed by round-1 review. Also the streak
          counters (a streak legitimately resets to 0), the freeze family (already merged
          by StreakProgressService.mergeFreezeProgress) and streak_progress_version
          (server-owned optimistic-lock counter — cloud always wins, Unit 3b e6b9c4).
          Refusals are emitted by the shared reportProgressDemotionsDeclined as
          progress_restore_demotion_declined, one event per field.
      - file: lib/core/services/sync/sync_profile.dart
        method: _restoreUserProgress
        notes: >
          Cloud→Hive restore writer. Was a wholesale cloud-non-null-wins merge that
          demoted current_phase on any device running ahead of its last push; now routes
          through mergeCloudProgress. Its own comment used to justify the wholesale merge
          with "a fresh restore read is always at least as new as whatever's local" —
          true for streak_progress_version, false for a client-advanced field; corrected
          in the same commit.
      - file: lib/core/services/auth_session_bootstrapper.dart
        method: post-auth user_progress pull
        notes: >
          The second demotion vector, identical shape, now routed through the same
          helper. Two independent inline copies of one merge rule is how the next one
          gets fixed and the other does not — hence one shared helper + one shared
          telemetry emitter.
      - file: lib/shared/services/pro_phase_advance.dart
        method: reportDeclinedAdvanceLeftStaleRows
        notes: >
          NOT a current_phase writer and NOT a repair — it REPORTS what a DECLINED
          advance leaves behind (OI-83's second-order half, repair tracked as OI-85).
          Because the restore writers do not take withPhaseAdvanceLock, one can bump the
          phase mid-generation; commitPhaseAdvance then declines, correctly, but the
          schedule_* rows already written for the un-advanced phase are stale. Three
          repair mechanisms were designed and each refuted — restore-takes-the-lock
          (TRY-lock, would DROP the restore), force-past-needsHeal (INERT, the per-row
          predicate re-applies), and preferSnapshot+orphan-sweep (DATA LOSS, plan_json is
          only daily-fresh and spans every schedule_* key). Full reasoning in that
          function's doc comment and OI-85; the event
          `phase_advance_declined_rows_stale` exists so the frequency can be measured
          before more machinery is built.
      - file: lib/core/services/sync/sync_restore_completeness.dart
        method: "_restoreFreezes and its sibling (2 sites) — audited, NOT vectors"
        notes: >
          Both read-modify-write a freshly-read progress map and mutate only freeze keys
          + streak_progress_version, so they preserve whatever current_phase is present.
          Recorded because OI-83 flagged them as "wants the same audit"; this is that
          audit's result, so the next pass does not re-derive it. Same for
          sync_service.dart _stampProgressVersion (version only, already monotonic per
          Hermes C6) and streak_freeze_clamp_migrator.dart (freeze keys only).
    reader_manifest_complete: false
    readers:
