  - concept: week_completion_check
    domain: workout
    behavioral_test_path: test/contracts/week_completion_check_test.dart
    description: |
      Whether a plan week has ≥1 completed scheduled day — drives the ✓
      checkmark on both past-phase and current-phase week chips in the Train
      week strip (Obs 3a 2c9f7a; current-phase chips previously had no check).
    writers:
      - file: lib/core/services/workout_schedule_write_service.dart
        line_range: 1-9999
        method: markCompleted (sets schedule_<date>.status = 'completed')
        notes: completion derives from logging; status stamped on the schedule row.
    readers:
      - file: lib/core/services/workout_schedule_read_service.dart
        line_range: 1-9999
        method: completedWeekNumbers → completedWeekNumbersFrom (pure)
        semantic: aggregated
        notes: |
          "any completed day that week" rule. completedWeekNumbersFrom
          (planStart, isCompletedOn, {maxWeek}) is the pure, Hive-free
          decision (Hermes L1/L37 behavioral coverage).
          ⚠ HOLD ROWS ARE EXCLUDED from the predicate (2026-07-25). The pure
          helper maps date→week via `plan_start + 7k`, but holdWeek() places a
          hold in the calendar week containing TODAY, so a hold is NOT on that
          grid — a late return leaves a gap and a completed hold day lands on an
          arbitrary index (ordinal 1 can sit at date-week 8). That credited a ✓
          to a padlocked PHASE II/III chip; invisible only because _WeekChip
          suppresses the tick when isLocked, a guard that evaporates the moment
          the holder upgrades. Hold weeks carry their own ✓ via
          HoldWeekInfo.isCompleted, computed independently in holdWeeks().
      - file: lib/features/train/widgets/week_selector.dart
        line_range: 1-9999
        method: _PhaseGroup → _WeekChip (hasCompletedDay)
        semantic: flag-check
        notes: renders Icons.check_circle when hasCompletedDay && !isLocked.
    regression_test: test/contracts/week_completion_check_test.dart
    class_constraints: |
      Same "any completed day that week" predicate for past AND current
      phase chips; the reader is the pure completedWeekNumbersFrom.

