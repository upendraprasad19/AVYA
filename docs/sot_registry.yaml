  - concept: cold_start_restore_refresh
    domain: cross_domain
    behavioral_test_path: test/contracts/background_restore_test.dart
    description: |
      Home cards refresh when the cold-start restore heals in the background.
      SyncService.restoreFromCloudForUser bumps a ValueNotifier tick after
      the bg heal; home listens and invalidates. Slow-boot guard (c5a1f2):
      background-restore is now opt-OUT — returning users (local profile
      present) DEFAULT to the bg path (home in ~3s); the disable_bg_restore
      kill-switch preserves the old blocking path (§4.6); fresh installs still
      block. Restore writers are additive / LOCAL-WINS (skip-if-local-exists:
      exlog/wlog/nutrition/saved-meal, mirroring weight sync_health.dart:300)
      so a background restore never overwrites a just-logged local row. The
      heal also calls reconcileExlogIndexes (union of present exlog_ rows).
      Backend-warm (un-flagged) pre-warms the PostgREST connection to kill
      the ~24s cold-start retry.
    writers:
      - file: lib/core/services/sync_service.dart
        line_range: 1-9999
        method: bumpRestoreCompleted (restoreCompletedTick ValueNotifier<int>)
        notes: single-writer monotonic tick; bumped after the bg heal completes.
      - file: lib/core/services/supabase_service.dart
        line_range: 1-9999
        method: warmConnection (best-effort user_profile probe, un-flagged)
    readers:
      - file: lib/features/home/screens/home_screen.dart
        line_range: 1-9999
        method: restoreCompletedTick listener → invalidateOnRetry(ref)
        semantic: pass-through
        notes: listener added in initState, removed in dispose.
