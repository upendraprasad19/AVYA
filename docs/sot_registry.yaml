      - _restoreUserPreferences
      - _restoreCoachInteractions
    telemetry:
      success_op_types: [restore_started, restore_completed]
      failure_op_types: [restore_from_cloud_for_user]
    class_constraints: |
      Adding a new Hive-only surface that paying users would lose
      on reinstall requires (1) cloud column/table, (2) syncX()
      method on SyncService, (3) _restoreX() called from
      restoreFromCloudForUser, AND (4) contract test.
    migration_note: |
      Audit 2026-05-20 / A6 — FULL WRAPPER LANDING (B5 D7-D8 batch,
      2026-05-21). The `SyncDomain` interface
      (`lib/core/services/sync_domain.dart`) now hosts EIGHT
      wrapper classes under `lib/core/services/sync_domains/`:
        - workouts_sync_domain.dart        (workout logs / exercise
                                             logs / schedule completions
                                             / plan / templates /
                                             scheduled workouts)
        - streaks_sync_domain.dart         (proof-of-pattern, landed
                                             in the scaffold batch)
        - nutrition_sync_domain.dart       (nutrition logs / water
                                             logs / saved meals)
        - health_sync_domain.dart          (weight / measurements /
                                             sleep / steps / urine
                                             color — push-only)
        - coach_sync_domain.dart           (coach interactions +
                                             coach memory)
        - profile_sync_domain.dart         (user profile / progress /
                                             preferences)
        - community_sync_domain.dart       (custom items orchestrator
                                             — exercises + foods)
        - restore_completeness_sync_domain.dart (freezes / inbox /
                                             saved diet plan / rank
                                             promotions / referrals)
      Each wrapper delegates to the existing private `_syncX` /
      `_restoreX` helpers via public forwarders on the corresponding
      `SyncServiceX` extension (`pushXForSyncDomain` /
      `restoreXForSyncDomain`). The wrappers ship DUAL-PATH-READY:
      `SyncService._domains` is a registered List<SyncDomain> and
      `_dispatchDomainPushes` / `_dispatchDomainRestores` iterate it
      under `SyncFlags.useDomainFor(<name>)` gates, all of which
      default FALSE. Legacy fan-out in `SyncService.syncWorkoutData`
      / `weeklyFullSync` / `restoreFromCloudForUser` keeps calling
      the private helpers directly — NO RUNTIME BEHAVIOUR CHANGE
      in this batch. The follow-up batch flips flags per domain
      after 24h smoke and deletes the matching legacy
      `_safeRestoreOp(...)` line in the same commit (CLAUDE.md
      §4.11 gates-before-refactor). The matched-pair contract is
      enforced by `test/contracts/sync_domain_interface_test.dart`
      (source-grep exhaustiveness over `_syncX` / `_restoreX`) +
      `test/contracts/sync_domain_full_migration_test.dart`
      (behavioural verification of the 8 wrappers + dispatcher
      no-op safety + SyncFlags default-FALSE invariant).

