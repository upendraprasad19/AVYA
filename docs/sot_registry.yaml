        notes: |
          Server-side validator. Rejects missing required fields with
          400. HIGH_PRIORITY_OP_TYPES allowlist bypasses the per-day
          rate limit; LOW priority shares a 2000/day budget. Response
          carries rate_limited + next_window_at + priority_lane.
