        line_range: 267-363
        method: _syncUserProgress
        notes: |
          THE canonical writer. Projects the program week into the current_week
          column via WorkoutScheduleReadService.currentWeekColumnProjection(...)
          — UNCONDITIONALLY when the kill-switch is OFF (the `!= null` guard on
          the frozen field is dropped — B-pass F1 — so a restore/null-Hive
