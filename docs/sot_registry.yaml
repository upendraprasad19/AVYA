          Reads WorkoutRepository.instance.currentStreak() directly so
          home + record sheet always agree (drift bug fixed in #12.7).
    regression_test: test/sync/streaks_source_field_test.dart
    behavioral_test_path: test/contracts/streak_freeze_refill_race_behavioral_test.dart
    additional_tests:
      - test/contracts/streak_freeze_refill_race_test.dart
      - test/contracts/streak_progress_service_concurrency_test.dart
      - test/contracts/streak_frozen_day_persists_protection_test.dart  # 5e8a1c: a spent freeze protects its day on every recompute (was: walk broke at the frozen day → streak collapse → rank stuck at SD2)
      - test/contracts/streak_decay_reckon_permanent_ledger_test.dart  # f9d2e7: D1 permanent ledger (commitRefill prune-not-clear; a frozen day survives a refill) + D2 gated reckon (rollover persists; tick==0 / empty-schedule do NOT decay)
    reader_allow_files:
      # Debug-only year-simulation harness (kDebugMode-gated; release-inert).
      # resetJourney wipes healthBox['streaks'] to re-baseline a clean journey —
      # it does NOT read streak semantics, so it is allow-listed rather than a
      # semantic reader. Added 2026-05-31 with the year-sim harness.
      - lib/features/dev/simulation_service.dart
    hive:
      box: healthBox
      key_prefix: "streaks"
      key_formula: "'streaks' (singleton list)"
    cloud:
      table: streaks
      columns: [user_id, week_start, days_completed, is_current, source]
      unique_constraint: "(user_id, week_start)"
    sync_methods: [_syncStreaks, syncFreezes]
    restore_methods: [_restoreStreaks, _restoreFreezes]
    provider_invalidation_set: [streakProvider, allExercisePRsProvider]
    telemetry:
      failure_op_types: [upsert_streak]
    class_constraints: |
      Dedup by week_start (UNIQUE constraint). Never dedup by cloud id.
      Streak freezes are stored in userBox (via MigratedKey) under
      streak_freezes_available / streak_freeze_used_dates /
      streak_freezes_last_refill. calculateCurrentStreak() must be
      called fresh — never trust a cached streak number for rank gates.

      Bug 2026-05-19 / diagnose 9c4a17 — refill timing-drift contract.
      The writer (StreakProgressService.commitRefill via refillIfNewWeek)
      bumps local Hive available + last_refill stamp AND schedules a
      fire-and-forget syncFreezes(); the cloud-side reader
      (SyncService._restoreFreezes) MUST max-merge on last_refill (lexical
      compareTo on YYYY-MM-DD) before overwriting available. Blind
      overwrite races the not-yet-propagated fire-and-forget cloud write
      and silently loses the Monday +1. Splash._restoreSub listener
      re-invokes refillIfNewWeek post-restore as defence-in-depth.

      streak_freeze_just_used is a session-scoped UI flag, not durable
      state — its writer is commitConsume and its sole consumer is
      home_screen._checkStreakFreezeUsed which clears it after firing the
      SnackBar. Splash cold-start (splash_screen._runDeferredInit) MUST
      clear it on every launch to prevent leak from a prior session that
      set the flag but never reached the home read.

      Phase 2 / diagnose f9d2e7 — PERMANENT freeze ledger + single decay site.
      D1: commitRefill NO LONGER clears streak_freeze_used_dates each week; it
      PRUNES entries older than the 365-day walk horizon (prunePastHorizon). The
      permanent ledger makes the 5e8a1c "a spent freeze protects its day forever"
      invariant survive a Monday refill (pre-D1 the weekly clear dropped it →
      re-consume / streak break — the founder's "streak 1 after idle days").
      mergeFreezeProgress therefore ALWAYS unions used_dates on every branch (the
      weekly BUDGET available/last_refill still follows the newer refill). D2: the
      SINGLE decay/consume site is WorkoutRepository.reckonStreakDecayAndPersist
      (rollover + completeWorkout), gated on restoreCompletedTick > 0 AND a
      non-empty schedule so a pre-restore / cold-start-empty device never
      spuriously decays; it persists via commitConsume and returns a read-only
      count when gated off. The grant denominator + first-PRO grant live in the
      sibling concept [[streak_freeze_first_pro_grant]].

      Unit 3b / OI-45 cross-device half, diagnose e6b9c4 — cross-device
      optimistic lock. syncFreezes() now calls the update_streak_progress RPC
      (migration 056/090/091/096 — was live and correct but dormant, zero
      callers) instead of a raw upsert. The RPC's own p_expected_version /
      streak_progress_version optimistic-lock pair closes the exact race
      migration 056's own header names: device A consumes (available 1->0),
      device B has a stale read (available 1) and refills (->2), the raw
      upsert let whichever landed last silently win. On a version mismatch
      syncFreezes() re-fetches + reconciles via mergeFreezeProgress (same pure
      merge the restore path already used) + retries once, then drops.
      streak_progress_version is a NEW field in userBox['progress'] / a new
      user_progress column (already present, migration 056) — shared as ONE
      whole-row optimistic counter with the sibling
      [[program_week_projection]] concept's update_user_progress_snapshot RPC
      (migration 115), since user_progress is one row per user. Local writer:
      SyncService._stampProgressVersion (lib/core/services/sync_service.dart,
      static, shared by both RPCs' call sites).

      Round-1-review fixes (2026-07-30, before this landed): (1) P0 —
      update_user_progress_snapshot's grant block originally only did
      `REVOKE EXECUTE ... FROM PUBLIC`, which is a no-op against Supabase's
      per-role default ACL (the postgres role grants EXECUTE on new
      public-schema functions directly to anon/authenticated, bypassing
      PUBLIC) — live-reproduced (anon_can_exec=true), fixed to an explicit
      `FROM PUBLIC, anon, authenticated`, matching update_streak_progress's
      own already-correct live ACL. (2) P1 — a THIRD writer,
      UserRepository.syncOnboardingToSupabase, raw-upserted the same 11
      program_week_projection-concept fields; now routes through the same
      RPC via new SyncService.pushOnboardingProgressSnapshot. (3) P2 — the
      RPC's fresh-insert branch left 4 schema-defaulted columns unwrapped;
      wrapped in COALESCE, closing a gap the P1 fix made newly reachable.
      See docs/diagnoses/2026-07-30-cross-device-progress-optimistic-lock-e6b9c4.md's
      "Round-1 review findings" table for full detail.

  - concept: streak_freeze_first_pro_grant
    domain: workout
    description: |
      One-time grant of 3 streak freezes on first-ever PRO upgrade.
      Controlled by `streak_freezes_first_pro_grant_done` (boolean) stored
      in userBox['progress'] (Hive) and user_progress column (Postgres,
      migration 095). Migration-095 backfill pre-sets the flag to true for
      every ever-PRO / has-subscription user so a boot-refresh of an
      existing PRO user never phantom-grants 3 freezes. The flag is
      NEVER cleared on lapse (resetToFreeCapOnLapse preserves it) so a
      re-purchase after lapse does not re-grant.
    writers:
      - file: lib/core/services/streak_progress_service.dart
        line_range: 213-234
        method: grantFirstProFreezes
        notes: |
          Reads flag from progress map; no-op if already true. Sets
          streak_freezes_available = max(current, 3) then flag = true.
          Fire-and-forget syncFreezes() + telemetry.
      - file: lib/core/services/streak_progress_service.dart
        line_range: 245-268
        method: resetToFreeCapOnLapse
        notes: |
          Clamps streak_freezes_available to 1 on lapse. Does NOT touch
          the flag — preserving grant history across lapse+re-buy cycles.
      - file: lib/core/services/sync/sync_restore_completeness.dart
        line_range: 324-433
        method: _restoreFreezes
        notes: |
          On restore: reads flag from cloud, writes true to Hive if cloud
          is true (never regresses a local true back to false). Unit 3b
          (e6b9c4) added streak_progress_version to the select + a local
          stamp, shifting the method to 324-433 (see line_range above) —
          range verified against the live file in the same commit.
    # Narrow single-field concept within the shared userBox['progress'] map
    # (only streak_freezes_first_pro_grant_done). The `streaks` concept owns the
    # exhaustive reader manifest for the 'progress' prefix — Gate 18's
    # prefix-level exhaustiveness applies THERE, not here (the other 7
    # progress-readers read different fields, not this flag). So: not complete.
    reader_manifest_complete: false
    readers:
      - file: lib/core/services/streak_progress_service.dart
        line_range: 172-179
        method: grantFirstProFreezes (idempotency check)
        semantic: pass-through
        fields_read: [streak_freezes_first_pro_grant_done]
        notes: |
          First read before any write — the gate that makes the grant
          idempotent on every boot-refresh.
      - file: lib/core/services/sync/sync_restore_completeness.dart
        line_range: 22-103
        method: syncFreezes
        semantic: pass-through
        fields_read: [streak_freezes_first_pro_grant_done]
        notes: |
          Only pushes the flag when local value is true (conditional
          include in upsert map to avoid regressing a backfill-true
          cloud row with a false first-sync from a brand-new user).
    behavioral_test_path: test/contracts/streak_freeze_first_pro_grant_behavioral_test.dart
    hive:
      box: userBox
      key_prefix: "progress"
      key_formula: "userBox['progress']['streak_freezes_first_pro_grant_done']"
    cloud:
      table: user_progress
      columns: [streak_freezes_first_pro_grant_done]
    sync_methods: [syncFreezes]
    restore_methods: [_restoreFreezes]
    telemetry:
      failure_op_types: [streak_freeze_first_pro_grant, streak_freeze_lapse_reset]
    class_constraints: |
      Phantom-grant prevention requires BOTH guards to be in place:
      1. Migration-095 backfill: marks all ever-PRO users as done=true
         before this code deploys. Ensures existing PRO users do not
         get phantom-granted 3 freezes on next boot.
      2. grantFirstProFreezes() flag check: idempotent guard inside the
         method. Defense-in-depth for reinstall/restore races where the
         backfill flag lands in Hive via _restoreFreezes (Step C of
         restore) BEFORE writeSubscriptionState fires (Step D).
      The free→PRO transition gate in subscription_service.dart
      writeSubscriptionState captures oldIsPro BEFORE the MigratedKey
      write so a renewal (PRO→PRO) is correctly classified as NOT a
      transition and does not call grantFirstProFreezes().

