    description: |
      Contract for the 'log-client-error' Edge Function request body.
      Every invocation from ErrorTelemetry must include these fields.
      The client_errors table was empty for the first 4 APK tests due
      to a payload mismatch (Test #12.6 fix). The Edge Function validates
      the payload shape server-side — missing required fields → 400, row not written.
    writers:
      - file: lib/core/services/error_telemetry.dart
        line_range: 57-100
        method: recordNonFatal + logEvent
        notes: both methods POST to log-client-error Edge Function
    readers:
