  - concept: subscription_payment_grace_window
    domain: subscription
    description: |
      10-min grace window after Razorpay success during which
      verifyFromServer is suppressed from downgrading the
      optimistic isPro=true. Closes the race where webhook fires
      seconds after a splash-time verify.
    writers:
      - file: lib/core/services/subscription_service.dart
        line_range: 50-110
        method: markPaymentInFlight
    reader_manifest_complete: true
    readers:
      - file: lib/core/services/subscription_service.dart
        line_range: 101-160
        method: isPaymentInFlight / clearPaymentInFlight / paymentInFlightOrderId
        semantic: flag-check
        fields_read: [paymentInFlightOrder, paymentInFlightUntil]
        notes: |
          Canonical reader. Event-based primary path (10-min ceiling
          as fallback safety cap). Legacy paymentInFlightUntil read
          once per device after upgrade until first event-based write.
      - file: lib/core/services/subscription_service.dart
        line_range: 317-605
        method: verifyFromServer + gate (isPaymentInFlight guard)
        semantic: flag-check
        fields_read: [paymentInFlightOrder]
        notes: |
          Suppresses _downgradeLocally during the grace window so a
          splash-time verify doesn't downgrade an optimistic isPro=true
          before the webhook lands.
      - file: lib/features/profile/providers/profile_provider.dart
        line_range: 343-385
        method: subscriptionInfoProvider (isVerifying field)
        semantic: flag-check
        fields_read: [isPaymentInFlight]
        notes: |
          subscriptionInfoProvider lives in profile_provider.dart
          (not a separate file). Exposes isVerifying so the profile
          dossier shows "CONFIRMING ⟳ AWAITING WEBHOOK CONFIRMATION"
          copy.
      - file: lib/core/services/razorpay_service.dart
        line_range: 360-380
        method: RazorpayService._handlePaymentSuccess
        semantic: pass-through
        fields_read: []
        notes: |
          Writes order via markPaymentInFlight FIRST so the grace
          window opens before any subsequent verify race fires.
    regression_test: test/subscription/payment_grace_window_test.dart
    telemetry:
      success_op_types: [subscription_refresh_grace_skip, subscription_refresh_success]
    class_constraints: |
      Grace window is 10 minutes. Cleared on webhook confirmation
      OR grace expiry, whichever is first.

