    cloud:
      table: client_errors
      columns: [user_id, error_message, op_type, platform, app_version, created_at]
    telemetry:
      success_op_types: []
      failure_op_types: []
    class_constraints: |
      Required payload fields: error_message, op_type, platform.
      Optional: user_id (omitted pre-auth), app_version.
      Never throw from within ErrorTelemetry — telemetry must be silent.
