    regression_test: test/contracts/workout_write_to_read_contract_test.dart
    hive:
      box: workoutBox
      key_prefix: "exlog_"
    provider_invalidation_set: [allExercisePRsProvider, currentPlanProvider, workoutStatsProvider]
    forbidden_legacy_patterns:
      - { pattern: "is_pr.*>=", reason: "PR comparison must be strict >; >= creates false PRs on repeat-best sets" }
    class_constraints: |
      Strict > comparison for PR (not >=). allExercisePRsProvider is
      the ONLY read path for UI PR display. EditWorkoutLogSheet MUST
      rescan after any weight edit to keep is_pr flags accurate.

