  - concept: auth_hive_owner_agreement
    domain: cross_domain
    description: |
      Two-layer cross-account guard preventing the previous user's data
      from leaking into the new user's session during the live
      signOut+signUp race window. Closes APK Test #15.4 / B1.

      Layer A (correctness): wrapUserScopedBox compares Supabase
      auth.currentUser.id against HiveUserSession.currentOwnerFullId on
      every call. On disagreement, returns GuardedBox.empty(authUid)
      which short-circuits all reads to null/empty/0/false/true and
      throws StateError on writes. Telemetry event
      'guarded_box_disagreement' fires per occurrence.

      Layer B (liveness): HiveUserSession.currentOwnerListenable is a
      ValueNotifier mirrored under _sessionLock from the 3 locked
      methods (openForUser / closeAll / deleteAllFilesForCurrentUser).
      hiveSessionOwnerProvider wraps it as a Riverpod Provider.
      authUserIdTokenProvider returns '<anon>' until authUid agrees with
      hiveOwner. The 56 user-scoped Riverpod providers from c4055a all
      watch this token — they automatically rebuild when the listenable
      fires after openForUser completes for the new user.

      Cold start unaffected because splash awaits _ensureLocalUser
      (which awaits openForUser) BEFORE UI mounts. Only the live
      in-session sign-out+sign-up race window benefits from this guard.
    writers:
      - file: lib/core/services/hive_user_session.dart
        method: HiveUserSession.openForUser / closeAll / deleteAllFilesForCurrentUser
        notes: |
          The 3 locked methods that mutate _currentOwnerFullId also
          mirror the value into currentOwnerListenable under the same
          _sessionLock. Listenable can never disagree with the static
          field.
    reader_manifest_complete: true
    readers:
      - file: lib/core/services/hive_session_owner_provider.dart
        line_range: 1-9999
        method: hiveSessionOwnerProvider
        semantic: pass-through
        fields_read: [currentOwnerFullId]
        notes: Riverpod Provider wrapping the listenable.
      - file: lib/features/auth/providers/auth_invalidation_provider.dart
        line_range: 1-9999
        method: authUserIdTokenProvider
        semantic: flag-check
        fields_read: [authUid, hiveOwner]
        notes: |
          Watches authStateProvider + currentUserProvider +
          hiveSessionOwnerProvider. Returns '<anon>' on disagreement;
          authUid on agreement. 56 user-scoped providers in lib/features/*
          watch this token as the first line of their build() body.
      - file: lib/core/services/guarded_box.dart
        line_range: 215-240
        method: wrapUserScopedBox
        semantic: flag-check
        fields_read: [authUid, currentOwnerFullId]
        notes: |
          Reads Supabase.instance.client.auth.currentUser?.id and
          HiveUserSession.currentOwnerFullId; returns
          GuardedBox.empty(authUid) on disagreement. Layer A correctness
          net — works even if Layer B liveness fails.
      - file: lib/features/profile/providers/profile_provider.dart
        line_range: 1-9999
        method: 8+ user-scoped providers (userProfile / biometric / subscriptionInfo / etc.)
        semantic: flag-check
        fields_read: []
        notes: First line of every build() body — `ref.watch(authUserIdTokenProvider)`.
      - file: lib/features/nutrition/providers/nutrition_provider.dart
        line_range: 1-9999
        method: 8+ user-scoped providers (waterTarget / foodLog / etc.)
        semantic: flag-check
        fields_read: []
      - file: lib/features/home/providers/home_provider.dart
        line_range: 1-9999
        method: 10+ user-scoped providers (streak / greeting / weightHistory / etc.)
        semantic: flag-check
        fields_read: []
      - file: lib/features/train/providers/train_provider.dart
        line_range: 1-9999
        method: 8+ user-scoped providers (currentPlan / workoutStats / etc.)
        semantic: flag-check
        fields_read: []
      - file: lib/features/onboarding/providers/onboarding_provider.dart
        line_range: 1-9999
