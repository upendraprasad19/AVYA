        line_range: 460-810
        method: _syncStreaks (push) + restore merge
        semantic: pass-through
        fields_read: [week_start, days_completed, is_current, source]
        notes: |
          Moved here from sync_service.dart by refactor/sync-service-part-split
          (2026-05-13). Reads healthBox.get('streaks') list + projects
          to cloud streaks table. Dedup by week_start (UNIQUE constraint).
      - file: lib/features/train/repositories/workout_repository.dart
        line_range: 158-200
        method: currentStreak / consumeMissedDayIfFreezeAvailable
        semantic: aggregated
        fields_read: [<schedule_<date> walk-back>]
        notes: |
          Canonical streak calculation. Walks back through schedule_<date>
          keys (not healthBox 'streaks' rows). currentStreak() is pure
