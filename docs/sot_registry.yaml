  - concept: coach_derived_completion
    domain: ai_coach
    behavioral_test_path: test/contracts/coach_completion_prompt_test.dart
    description: |
      Completion of a scheduled workout day DERIVES from logging — the coach
      never asserts it (ADR-0012 derive-only). Unit 1 (coach-completion-tap-card,
      2026-07-06, diagnose 280c4d) REDESIGNED the derivation after the founder
      bug where ONE coach logSet flipped the whole day to 'completed'. Post-fix
      completion derives via TWO paths, both routing the canonical
      WorkoutWriteService.markCompleted:
        (1) ALL-LOGGED AUTO BACKSTOP — auto-markCompleted(completedVia:'auto')
            ONLY when plannedCount > 0 AND EVERY planned exercise in
            schedule_<date>['exercises'] has a log today. Counts exercises[] ONLY
            (warmup/cooldown/finisher optional). Swap-tolerant: a log under
            exercise_name OR swapped_from counts. finding-4: an EMPTY exercises[]
            (plan-less / legacy / restored ad-hoc day) is NOT auto-completed — it
            falls through to the tap-card (an explicit tap is the only path that
            completes it), else ONE ad-hoc coach log resurrects the founder bug.
            Keeps the rest-day + already-completed guards.
        (2) USER-TAPPED CARD — a genuine partial stays 'planned' and writes a
            date-scoped completion_prompt_<date> coachBox action row
            (kind:'completion_prompt', planned_count/logged_count,
            resolved_at:null; UPDATE-not-INSERT). ChatHistoryNotifier renders it
            as a two-button tile; [Complete workout] → markCompleted(
            completedVia:'tap'); [Log more] → resolve + focus composer.
      The completion_prompt row is LOCAL-ONLY: excluded from the
      _syncCoachInteractions cloud push (kind != null skip) and from restore, so
      it can never corrupt ai_coach_interactions. markCompleted gained an
      idempotent under-lock status re-check so the auto-backstop racing a tap
      cannot double-stamp completed_at/completed_via.
    writers:
      - file: lib/features/ai_coach/services/tool_dispatcher.dart
        line_range: 381-462
        method: _maybeCompleteScheduledDay
        notes: |
          Derived-completion decision after a coach logSet. All-logged →
          markCompleted(completedVia:'auto') + resolve any earlier prompt;
          partial → _writeCompletionPrompt. KEEPS the method + markCompleted
          call + rest-guard so derive_only_tool_surface_test stays green.
      - file: lib/core/services/workout_write_service.dart
        line_range: 399-509
        method: markCompleted
        notes: |
          Canonical completion writer. Unit 1 added completedVia (default 'app';
          'auto' backstop / 'tap' card) + an under-lock status re-check
          (returns success WITHOUT rewriting when already 'completed') + stamps
          completed_via on the schedule + wlog rows.
      - file: lib/features/ai_coach/providers/ai_coach_provider.dart
        line_range: 341-392
        method: completeWorkoutFromPrompt
        notes: |
          [Complete workout] re-reads schedule_<date>; if not completed/rest →
          markCompleted(completedVia:'tap'), then resolveCompletionPrompt stamps
          resolved_at (also the [Log more] path). Both live on ChatHistoryNotifier.
          finding-2: passes DateTime.utc(y,m,d) (split from the IST date-key via
          _utcDateFromIstDateStr) — NOT DateTime.parse(date) (device-local
          midnight) — so markCompleted's internal istDateStr round-trips to the
          same schedule_<date> key on any host timezone (no east-of-IST shift).
    reader_manifest_complete: true
    readers:
      - file: lib/features/ai_coach/providers/ai_coach_provider.dart
        line_range: 164-223
        method: build
        semantic: flag-check
        fields_read: [kind, resolved_at, date, planned_count, logged_count]
        notes: |
          ChatHistoryNotifier.build (declared 164; re-based 2026-07-30 —
          Unit 8 / coach-media-consent inserted ~60 lines above it for the
          new ChatMessage fields, shifting every line number below). The
          completion_prompt handling is the tight sub-branch: the
          entry-collection filter 187-189 skips a resolved row (resolved_at
          != null); the render branch 208-223 emits a
          kind:'completion_prompt' ChatMessage(promptData) for unresolved
          ones — never misreads them as user/ai turns (they carry no
          user_message / ai_response).
      - file: lib/features/ai_coach/screens/ai_coach/chat_area.dart
