      bucketPastRows groups by phase identity via carry-forward when ANY row
      is stamped (else 28-day calendar fallback for legacy data). length =
      phases the user has moved past — feeds the rank/phase reconciler
      (F-B 7d2e6b; fixes the >28-day-span over-count).
