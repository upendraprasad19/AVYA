      surface reads, and returns HoldStatusData.empty whenever
      enable_hold_weeks is OFF — so all of it is inert until the flag flips.
      Deliberately does NOT touch getCurrentWeekNumber / getProgramWeek /
      currentPhaseCompletionRate (still clamped) — see
