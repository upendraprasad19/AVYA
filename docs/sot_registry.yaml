    behavioral_test_path: test/sql/onconflict_live_arbiter.sql  # a1c9f4 — live RPC-call case 'redeem_referral_atomic:2_referral_trial_rows' (2 rows, no UNIQUE-NULL collision) + 'trigger_greatest:no_expiry_demotion'
    telemetry:
      failure_op_types:
        - referral_repository_redeem
    related_concepts:
