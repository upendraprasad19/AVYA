# ── Orphan readers (cron functions reading keys the writer doesn't emit) ──
#
# This is a debt list — every entry here is a cross-system contract that
# will silently degrade because the writer-side (buildAiContext) does NOT
# emit these keys. Most readers fall back to null safely; some (e.g.
# morning-alert milestone templates) render generic copy instead of
# personalized copy when these are null.
#
# OI-03's gate must NOT fail on these (they're documented + intentional
# debt) but SHOULD warn so the list doesn't grow.
orphan_readers:
  - key: current_streak_weeks
    expected_shape: int (top-level)
    actual_writer_path: snapshot.progress.current_streak_weeks (nested)
    readers:
      - { fn: morning-alert, file: supabase/functions/morning-alert/index.ts, line: 112 }
