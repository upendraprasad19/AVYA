# Snapshot contract — AiCoachRepository.buildAiContext -> Edge Function readers.
#
# This file is the explicit manifest of every key emitted by the client-side
# `AiCoachRepository.buildAiContext()` method and every Edge Function that
# reads each key off the JSON snapshot.
#
# Two distinct consumption paths exist; both feed off the SAME JSON blob:
#   (A) Direct request-body path — client passes the snapshot inline to
#       `ai-proxy` / `ai-media-proxy` as `snapshot_json`. Both functions
#       JSON.stringify the whole blob into the Gemini system prompt; they do
#       NOT read individual fields. Every key is therefore implicitly
#       consumed by both functions (recorded as `prompt_passthrough: true`).
#   (B) Persisted-snapshot path — client also POSTs the same blob to
#       `daily-snapshot`, which UPSERTs it into
#       `user_daily_snapshots.snapshot_json` (Postgres jsonb). Cron-driven
#       Edge Functions (morning-alert, streak-guardian, etc.) then read
#       INDIVIDUAL fields off that column. These per-key reads are the only
#       contract that risks silent writer/reader drift; they are enumerated
#       below as `readers: [...]`.
#
# Enforced by `scripts/check_snapshot_contract.dart` (OI-03, separate batch).
# Self-consistency pinned by
# `test/contracts/snapshot_contract_self_consistency_test.dart`.
#
# IMPORTANT: several keys read by cron functions (`current_streak_weeks`,
# `today_workout_name`, `recent_pr_exercise`, `yesterday_calories`, etc.) are
# NOT emitted by today's buildAiContext. They are documented at the bottom
# under `orphan_readers:` as a debt list — the canonical writer either needs
# to start emitting them or the reader needs to be removed. OI-03's gate
# will surface these as failures the moment it goes live.
#
# Verification audit performed 2026-05-17. Every reader citation was
# manually verified against the actual Edge Function code at the cited line
# per feedback_audit_findings_require_live_verification.md.

writer:
  file: lib/features/ai_coach/repositories/ai_coach_repository.dart
  method: buildAiContext
  line: 34
  return_map_start_line: 46

# All ai-proxy / ai-media-proxy consumption is whole-blob stringification.
# Recorded once here to keep per-key entries short.
prompt_passthrough_consumers:
  - { fn: ai-proxy, file: supabase/functions/ai-proxy/index.ts, line: 716 }
  - { fn: ai-media-proxy, file: supabase/functions/ai-media-proxy/index.ts, line: 488 }

