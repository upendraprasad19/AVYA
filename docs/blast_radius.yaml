  # PreToolUse/PreCommit hooks that gate EVERY future git operation platform-
  # wide are platform-tier on their own merits, not just when a change also
  # happens to touch CLAUDE.md (B-pass finding #2, discipline-overhead batch
  # 2026-07-19: these were feature-tier under the scripts/**+.claude/**
  # catch-alls below, so a change touching ONLY the hook — not CLAUDE.md —
  # would have cleared zero review gate despite having the power to block
  # every git commit/push in every future session).
  - { glob: "scripts/git_safety_hook.dart", tier: platform }
  - { glob: "scripts/git_safety_lib.dart", tier: platform }
  - { glob: "scripts/check_commit_from_worktree.dart", tier: platform }
  - { glob: "scripts/worktree_guard_lib.dart", tier: platform }
  # The §4.12 keystone gate + the machinery that DECIDES every tier. Same
  # reasoning as the hooks above, with a live smoking gun: merge 904e6961
  # changed .github/workflows/test.yml — the file defining the keystone gate's
  # own CI job, whose cancel-in-progress bug was silently SKIPPING that gate —
  # and cleared zero review gate, because .github/** and scripts/** are feature
  # tier via the catch-alls below. A change to the reviewer must not be exempt
  # from review. blast_radius.yaml and the classifier are included because a
  # commit that DOWNGRADES a tier would otherwise clear nothing either.
  # (merge-governance batch 2026-07-26, review round 1 finding F8.)
  - { glob: "scripts/check_plan_review_record_exists.dart", tier: platform }
  - { glob: "scripts/plan_review_record_lib.dart", tier: platform }
  # c9f1d3 (2026-07-27): the review-ACCEPTANCE gate, one word away in name from
  # the record gate above and identical in function, was missed by the sweep
  # that wrote the comment above — it fell through scripts/** to feature tier.
  # So the one file that decides whether a catastrophic diff has an accepted
  # review could itself be edited with no review at all, which is precisely the
  # exemption this block exists to close.
  - { glob: "scripts/check_code_review_pass_exists.dart", tier: platform }
  - { glob: "scripts/check_gate_scripts_wired.dart", tier: platform }
  - { glob: "scripts/blast_radius_from_diff.dart", tier: platform }
  - { glob: "scripts/blast_radius_content_rules_lib.dart", tier: platform }
  - { glob: "scripts/pre-commit.sh", tier: platform }
  # a3d7b1 (2026-07-27, founder decision) — the THIRD partial sweep of this
  # block, and the one that tries to stop there being a fourth.
  #
  # scripts/setup-hooks.sh installs the hook sources in consecutive lines (FOUR
  # when this comment was written; FIVE since 2026-08-17 added
  # pre-merge-commit.sh). Before this batch, two were platform (pre-commit.sh,
  # promoted by d947743d 2026-07-26 under "a change to the reviewer must not be
  # exempt from review") and two were feature. Promoting a git hook while its
  # siblings stay exempt is arbitrary, so the rule is now: EVERY hook source
  # setup-hooks.sh installs is >= platform, asserted by a test that DERIVES the
  # list from setup-hooks.sh rather than restating it here.
  #
  # That derive-from-source design paid for itself on 2026-08-17: the
  # cycle-time-and-board-gaps batch added a FIFTH hook (pre-merge-commit.sh) and
  # did not think to add it here, and
  # blast_radius_content_rule_wired_all_scripts_test.dart failed the commit with
  # the new filename named in the message. A hand-maintained list would have
  # silently stayed green while the newest hook — the one that gates every future
  # merge — sat at feature tier.
  #
  # pre-push.sh is the self-referential one: it decides whether the ~7-min full
  # suite runs before code leaves the machine (:64, a string equality against
  # "feature"), so an edit disabling it would clear zero review gate AND skip
  # the suite on the very push that lands it. CI is not a substitute —
  # .github/workflows/test.yml (the `unit-test` job, `--exclude-tags golden`)
  # excludes golden-image tests, which run ONLY in
  # that local suite.
  #
  # commit-msg.sh is the sole LOCAL enforcement of coding rule 22 (every
  # fix/bug/regression commit must cite a validating diagnose-doc). Hard-fail,
  # zero tests, and it owns the `regression-test-skipped:` waiver path, which
  # has no CI equivalent. Its whole downstream chain is promoted with it —
  # promoting the §4.2 no-deferrals chain in full while leaving the parallel
  # rule-22 chain at feature was the arbitrary half of this batch's first draft.
  #
  # safe_commit.sh / safe_push.sh are the sole sanctioned write paths
  # (git_safety_hook.dart, already platform above, exists solely to force them).
  # The existing git_safety tests assert only that the HOOK recognises these
  # filenames — the wrappers' own verify-after-write logic has no behavioural
  # coverage.
  #
  # check_no_deferral_euphemism.dart is the thinnest-defended: one commit ever,
  # no test of its phrase list, hard-fail locally, and it fails OPEN on error.
  # (It is not allow-listed out of CI, but runs vacuously there — CI has no
  # staged diff.) Its phrase LIST lives in docs/deferral_euphemisms.yaml at
  # feature tier by design: adding a banned phrase must stay a one-line edit,
  # while changing how matching works stays gated. Same split as this registry
  # (platform) versus the code that reads it.
  #
  # Cost measured before promoting, not assumed: 10 DISTINCT commits touch this
  # whole set, across 6 distinct days in the repo's 4.1-month life — roughly 4-5
  # review events per quarter. (An earlier draft said "12 of 1366 / ~3 per
  # quarter"; 12 was a per-file sum that double-counted two commits touching
  # more than one file, and the cadence was understated ~2x. Corrected by the
  # B-pass before founder ratified it.)
  #
  # DECLINED, recorded so the next sweep need not re-derive it:
  #   prepare-commit-msg.sh — its own header says the Blast-radius line it
  #     writes is informational; verified no gate parses it back.
  #   setup-hooks.sh — affects fresh clones only, and check_hooks_installed.dart
  #     backstops hook presence.
  #   new-worktree.sh / vercel_build.sh / run-device-tests.sh — not enforcement.
  - { glob: "scripts/pre-push.sh", tier: platform }
  # The fifth hook source (2026-08-17). It is the ONLY thing git runs for an
  # automatically-created merge commit, which is precisely where two branches'
  # OI boards first coexist and where the number-collision class lands. An edit
  # weakening it would clear no review gate and would re-open that hole
  # invisibly, so it takes the same tier as its four siblings.
  - { glob: "scripts/pre-merge-commit.sh", tier: platform }
  # Discipline enforcement added 2026-08-25. Pinned AT BIRTH rather than left
  # to the scripts/** -> feature catch-all: a later commit touching only these
  # files (fixing one of the two P0s the B-pass found here, say) would
  # otherwise classify feature and skip BOTH the local full suite at pre-push
  # and the >=account keystone plan-review gate. Every sibling that guards a
  # commit is already pinned; the machinery that enforces discipline must not
  # be the one piece changeable without it.
  - { glob: "scripts/batch_close_hook.dart", tier: platform }
  - { glob: "scripts/batch_close_lib.dart", tier: platform }
  - { glob: "scripts/check_skill_tuning_history.dart", tier: platform }
  - { glob: "scripts/skill_tuning_lib.dart", tier: platform }
  # THE HOOK WAS PINNED AND ITS DEPENDENCIES WERE NOT — the fourth instance of
  # this exact miss (B-pass 2026-08-17, P1). The comment above records two prior
  # rounds of "promoting a git hook while its siblings stay exempt is
  # arbitrary"; the same reasoning reaches one step further than either sweep
  # went. Verified before pinning: each of these classified `feature` alone
  # while pre-merge-commit.sh classified `platform`.
  #
  #   _dart_bin.sh is sourced by ALL FIVE hooks. That makes it a strictly more
  #     central single point of failure than _git_lock.sh, which was itself
  #     promoted for having two dependents. An edit here changes how every gate
  #     in every hook is invoked.
  #   check_oi_numbering_unique.dart + oi_numbering_lib.dart are the gate the
  #     pre-merge hook exists to run — pinning the hook and leaving the gate it
  #     calls at feature tier gates the shell and exempts the substance.
  #   check_hooks_installed.dart is the only thing that detects a hook being
  #     absent; ~70% of it was rewritten in this batch.
  - { glob: "scripts/_dart_bin.sh", tier: platform }
  - { glob: "scripts/check_oi_numbering_unique.dart", tier: platform }
  - { glob: "scripts/oi_numbering_lib.dart", tier: platform }
  - { glob: "scripts/check_hooks_installed.dart", tier: platform }
  - { glob: "scripts/commit-msg.sh", tier: platform }
  - { glob: "scripts/safe_commit.sh", tier: platform }
  - { glob: "scripts/safe_push.sh", tier: platform }
  # Round-1 review finding #24 (blocking, Unit 3 discipline-tooling-hardening
  # 2026-08-03): _git_lock.sh provides the mutual-exclusion safe_commit.sh and
  # safe_push.sh (both platform above) both depend on -- without this entry a
  # future edit gutting the lock alone falls through to the scripts/**
  # feature-tier catch-all below and clears no review gate, the exact "fell
  # through scripts/** to feature tier" mistake this file's own comments above
  # (lines 84, 93) already record happening twice. safe_merge.sh is the third
  # sanctioned git wrapper (merge-into-main), promoted alongside its siblings
  # for the same reason.
  - { glob: "scripts/_git_lock.sh", tier: platform }
  - { glob: "scripts/safe_merge.sh", tier: platform }
  - { glob: "scripts/validate_audit_closure.dart", tier: platform }
  - { glob: "scripts/check_no_deferral_euphemism.dart", tier: platform }
  # The rule-22 diagnose-doc chain commit-msg.sh drives, promoted with it.
  # validate_diagnose_doc.dart is the structural twin of validate_audit_closure
  # above: a per-invariant validator called from a hard-fail hook and from
  # /build-apk Gate 10.
  - { glob: "scripts/validate_diagnose_doc.dart", tier: platform }
  - { glob: "scripts/validate_diagnose_doc_lib.dart", tier: platform }
  - { glob: "scripts/check_bugfix_commits_have_diagnose.dart", tier: platform }
  # CLAUDE.md §7 names the blast-radius trio: this registry + the classifier +
  # the coverage gate. The first two were already platform; the third was not,
  # so the pointer table advertised an unprotected file.
  - { glob: "scripts/check_blast_radius_coverage.dart", tier: platform }
  - { glob: "docs/blast_radius.yaml", tier: platform }
  - { glob: ".github/workflows/test.yml", tier: platform }
