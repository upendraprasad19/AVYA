  # B-pass finding, progress-map-consolidation batch (2026-07-30): the catch-all
  # comment at the bottom of this file has said "lib/shared/repositories ... is
  # account" since this registry was written, but no rule ever implemented it —
  # lib/shared/repositories/** fell through to the lib/shared/** -> feature
  # catch-all (first-match-wins, declaration order), so a diff touching ONLY
  # user_repository.dart (owner of the progress/profile Hive maps' writer
  # contracts) cleared zero review gate. Verified live via the classifier's own
  # stdin mode before fixing: `printf 'lib/shared/repositories/user_repository.dart\n'
  # | dart run scripts/blast_radius_from_diff.dart -` returned `feature`. This
  # rule finally implements the comment's already-stated intent — repositories
  # own writer/reader contracts by this repo's own architecture rule (lib/CLAUDE.md
  # "Repository pattern"), so a change to one is account-tier by default. Declared
  # here (before the feature overrides below) so it wins over lib/shared/** at
  # the bottom of this file. lib/shared/repositories/plan_engine/** stays platform
  # via its own more-specific, earlier-declared rule above — unaffected.
  - { glob: "lib/shared/repositories/**", tier: account }
  # graduation_screen.dart is the USER-FACING ENTRY POINT for the PRO phase
  # advance: it gates `phases_2_to_12`, drives the choice sheet, holds the
  # pre-lock live-phase abort, and calls `runGraduationPhaseAdvance`. A diff
  # touching ONLY this file would otherwise clear zero review gate, because
  # lib/features/train/** is feature-tier below. Scoped to the single file, not
  # the whole tree, since the rest of it is ordinary Train-tab UI with no
  # equivalent risk — a blanket promotion would over-gate routine UI changes
  # for no safety gain.
  #
  # RESTATED 2026-08-03 (Unit B / b4e9c7, closes OI-84). The original reason
  # was "contains a confirmed direct write to the progress map (`_onPro()`)".
  # That became FALSE when Unit B hoisted the write into
  # `runGraduationPhaseAdvance` in lib/shared/services/pro_phase_advance.dart —
  # which carries its own account rule below, so the gate did not weaken. The
  # TIER is unchanged and still right; only the justification moved. A rule
  # whose stated reason is false reads as coverage it does not have (same class
  # as the `check_writer_reader_drift.dart` citation corrected in
  # lib/CLAUDE.md 2026-08-02, for a gate script that never existed).
  - { glob: "lib/features/train/screens/graduation_screen.dart", tier: account }
  # Unit 3c / c8f3d1 (2026-08-01), same one-file argument as the two rules above:
  # pro_phase_advance.dart became THE single writer for the phase advance
  # (commitPhaseAdvance) and owns the shared advance mutex every generating
  # surface now takes. It sits under lib/shared/**, which is feature-tier at the
  # bottom of this file, so a diff touching only it would clear zero review gate
  # while changing the monotonic guard on `current_phase`. Scoped to the file
  # rather than lib/shared/services/** because that directory currently holds
  # exactly this one file (verified by ls) — a directory glob would silently
  # promote whatever lands there next, which is a claim this rule cannot make.
  - { glob: "lib/shared/services/pro_phase_advance.dart", tier: account }

  # ----- feature (explicit overrides over default) -----
  - { glob: "lib/features/profile/**", tier: feature }
  - { glob: "lib/features/train/**", tier: feature }
  - { glob: "lib/features/nutrition/**", tier: feature }
  - { glob: "lib/features/home/**", tier: feature }
  - { glob: "lib/shared/widgets/**", tier: feature }
  - { glob: "docs/**", tier: feature }
