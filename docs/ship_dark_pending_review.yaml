        The correct shape is to split the trigger from the write.
      title: "Residuals"
      why: >
        currentPhaseCompletionRate's phase>=2 branch scans getWeek(5..12) by
        DATE, folding hold days into the PRO-advance gate input;
        PlanIntegrityReconciler scans weeks 1-4 only, so a hold week's lost
