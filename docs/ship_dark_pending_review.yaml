# ── HARD PRECONDITIONS for flipping enable_hold_weeks ─────────────────────
# Not a wish-list. The flip-on commit already requires the full ×2 + bpass
# (§4.12.4); this is the checklist that review must show closed. Every item was
# found by live verification or independent review on 2026-07-25 and every one
# is currently UNFIXED. A holder today would be told a falsehood by the coach
# and by the Sunday push.
flip_on_blockers:
  flag: enable_hold_weeks
  raised: 2026-07-25
  items:
    - id: FOB-1
      closed: "2026-08-20 — docs/audit/fob1-week-identity.closure.yaml; diagnose f4c8e1; behavioral test test/contracts/hold_week_identity_behavioral_test.dart (16 cases, mutation-proven on 2 legs: hold arm -> 3 red, flag gate -> 5 red). New single-gate seam WorkoutScheduleReadService.weekIdentity() + activeHoldWeeks()/activeHoldOrdinalFor(); holdStatusProvider now delegates to it instead of restating the flag check. SIX in-repo surfaces adopted, not the 7 the why: lists: phase_roadmap_screen reaches the clamp via getProgramWeek (the list understated it) and profile_content.dart was named only through its provider. RESIDUALS, neither deferred: ai_snapshot_builder.dart is FOB-3's by the board's own division (same lines, needs the ai-proxy redeploy); telegram-bot/bot.py is upstream_blocked (separate repo, OpenClaw VPS)."
      title: "Week-identity coherence — adopt 'a hold suppresses the week number; Hn is the identity'"
      why: >
        The shipped UI already chose this rule (plan_header.dart drops the week
        counter while holding, "a hold week has no honest WK n OF m"), and D1
        extends it to the banner. But 7+ surfaces still print the clamped week 4
        for a holder: home_screen.dart (eyebrow), profile_provider.dart ->
        profile_content.dart, journey_timeline.dart, phase_roadmap_screen.dart,
        reports_screen.dart (the SHARE-AS-VIDEO stamp), ai_snapshot_builder.dart
        (x2), and telegram-bot/bot.py. Meanwhile day_detail_sheet.dart and
        preview_workout_screen.dart read the ROW and show week 6 — so the app
        already contradicts itself across surfaces.
      do_not: >
        Do NOT project `4 + ordinal` into user_progress.current_week. That
        manufactures the exact number the UI ruled dishonest AND reintroduces
        the three-surface drift diagnose c9f4a2 closed. If any projected value
        is ever needed it must be programWeekFor(phase, ...) — literal
        `4 + ordinal` demotes a phase-2 holder from 8 to 5.
    # ── STATUS ANNOTATIONS (added 2026-08-13) ─────────────────────────────
    # This section has no per-item status field — each item is a single prose
    # `why:` blob — so closures are recorded as `closed:` lines added here, and
