    - id: FOB-2
      closed: "2026-08-13 — docs/audit/oi60-streak-identity.closure.yaml; diagnose a3f8d1; behavioral test test/contracts/hold_week_streak_identity_behavioral_test.dart (14 cases, 6 mutations proven)"
      title: "Weekly streak + streaks row are dead during a hold"
      why: >
        getCurrentWeekNumber() clamps to 4, so last_streak_week never advances,
        current_streak_weeks freezes for the whole hold (stalling streak-week
        badges), and the streaks row key stays pinned to week 4's Monday — every
        hold completion REWRITES week 4's row and hold weeks get none.
      how: >
        Derive both the week identity and the row key from HoldWeekInfo.weekStart
        BY DATE. Never `plan_start + 7k`: holdWeek() places the hold in the
        calendar week containing today, so a late return leaves a gap (pinned by
        the LATE RETURN case in hold_display_read_path_test.dart — ordinal 1 sits
        at date-week 8). last_streak_week MUST stay an int (train_provider casts
        `as int?` and completeWorkout has no try/catch). Cloud streaks is keyed
        UNIQUE (user_id, week_start) — a DATE — so a new Monday is a new row, no
        migration.
    - id: FOB-3
      title: "The AI coach asserts a falsehood to every holder, every week"
      why: >
        The snapshot sends current_week: 4 for EVERY hold day at EVERY ordinal
        (holds start at plan_start+28 so the clamp always yields 4). Combined
        with captain_manual.ts ("free locks at Phase I after 4 weeks") and
        tier: free, the model synthesizes "final week of Phase I / upgrade" —
        a repeating false milestone aimed at the user who just chose to stay.
        Nothing in supabase/functions/ reads is_hold or hold_ordinal.
      how: >
        Add a `hold` block to the snapshot AND add 'hold' to the keep set in
        trimSnapshotToBudget — it halves non-kept maps by insertion order and
        would silently drop the meaning-carrying fields. Teach captain_manual.ts
        what a hold is. Requires an ai-proxy deploy (own authorization, §4.3).
    - id: FOB-4
      title: "Sunday push and weekly report need hold copy, not a number"
      why: >
        weekly-recap-ready/index.ts interpolates current_week verbatim
        ("Week N debrief ready") and weekly-report/index.ts feeds it to Gemini.
        Whatever value is projected, the copy is wrong for a hold week. Both
        need a hold branch — which means redeploys, so the earlier
        "no EF redeploy needed" framing was false.
    - id: FOB-5
      closed: "2026-08-20 — docs/audit/fob5-hold-telemetry.closure.yaml; diagnose c7a3b9; migration 120 (applied live, founder-authorized); test test/contracts/hold_week_mechanic_behavioral_test.dart (4 cases, mutation-proven: emit removed -> 3 red, ordinal dropped -> 2 red). ⚠ THE `how:` BELOW IS WRONG AND WAS NOT FOLLOWED: `where channel = 'app'` matches 7 of 116 rows and would have replaced a 5.3x overcount with an ~89% undercount. The correct predicate mirrors the repo's own _coachChatChannels (coach_interaction_repository.dart:282) and also drops 38 stuck/pending rows the filing never mentions. Metric now reads 22 instead of 116. Hold telemetry rides on founder_metrics_engagement()'s new hold_* columns rather than a new RPC, because admin-dashboard-data:255 spreads that row wholesale — so no EF redeploy was needed."
      title: "Holds are unobservable, and the events corrupt the one live metric"
      why: >
        The five phase_1_day_29_* events have ZERO consumers repo-wide — no
        query, cron, dashboard or alert. Holds taken / hold->convert /
        hold->churn are all unmeasurable, and the retention thesis rests on this
        mechanic. Worse, founder_metrics_engagement() counts
        ai_coach_interactions with no channel filter, so every app_event row
        inflates ai_messages_today.
      how: >
        Add a hold_week_started event with a real consumer, and add
        `where channel = 'app'` to the metric.
    - id: FOB-6
      title: "Selectable hold weeks (D2) — 6 lifecycle traps, do not ship naively"
      why: >
        During a hold the THIS WEEK rows show the phase's ORIGINAL week 4 while
        the user trains the hold week, and both the W4 chip and the current H
        chip render gold.
      traps: >
        (a) extracting the row->WorkoutDayData mapping depends on loop var `w`
        for dayNumber, so the refactor runs for EVERY user and is NOT hold-gated
        — it needs a characterization test before extraction; (b) a notifier
        watching holdStatusProvider is reset by every currentPlanProvider
        invalidation, clobbering manual selection; (c) needs the
        authUserIdTokenProvider cross-account guard every sibling Train provider
        carries; (d) the hero card sources TODAY unconditionally, so selecting a
        past hold shows today's workout above another hold's rows; (e)
        expandedDayProvider must collapse on selection or a stale index carries
        over; (f) terminal states (hold elapses, PRO advance empties holds) are
        undefined.
    - id: FOB-7
      partially_closed: >
        (c) and (d) are CLOSED — docs/audit/oi60-streak-identity.closure.yaml.
        (c) was STALE as filed: ai-media-proxy already carries BOTH the
        10000-char snapshot cap and the fenceAsData nonce fence (documented in
