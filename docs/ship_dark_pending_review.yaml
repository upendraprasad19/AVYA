# docs/ship_dark_pending_review.yaml
#
# Tracks every kill-switch flag shipped under the CLAUDE.md §4.12.4 ship-dark
# lighter review tier (1 review round at build time instead of ×2, since the
# flag is default-OFF and byte-identical when off — zero live risk until it
# flips). An entry here means: this flag's BUILD commit only got 1 review
# round. It must get the full ×2 review + `bpass: accepted` before (or at) its
# flip-on commit, and only then does the entry move to `resolved:`.
#
# This is a manually-maintained ledger, not a gate — it exists so a flag can't
# quietly go live, or sit forgotten mid-overhaul, having only ever had the
# lighter build-time review. Update it in the SAME commit as any ship-dark-
# tiered build, and again in the SAME commit as its flip-on.
#
# Schema per entry:
#   flag:            the kill-switch flag name (e.g. enable_readiness)
#   branch:          worktree branch the build shipped from
#   build_commit:    sha of the build-tier commit (review_rounds: 1)
#   build_date:      YYYY-MM-DD (IST)
#   flip_reviewed:   false until the flip-on commit's plan-review record shows
#                    review_rounds >= 2 + bpass: accepted; then true
#   flip_commit:     sha of the flip-on commit (fill in when flip_reviewed
#                    flips to true; null until then)

pending:
  - flag: enable_hold_weeks
    branch: hold-mechanic
    build_commit: df5e38b0
    build_date: 2026-07-21
    flip_reviewed: false
    flip_commit: null
    note: >
      Slice 1 (the holdWeek WRITER). NOT the lighter 1-round tier — the
      durability fixes (#1 re-anchor, #4 pagination) are LIVE for all users, so
      the build got the FULL ×2 review (docs/plan-reviews/hold-mechanic.md,
      review_rounds: 2). Merged to main as 7ca850d9. Tracked here so the
      default-OFF flag can't be flipped later without its own flip-on ×2
      (§4.12.4). Placeholder sha resolved by the hold-display batch.

  - flag: enable_hold_weeks
    branch: hold-display
    build_commit: 4f4e9518
    build_date: 2026-07-25
    flip_reviewed: false
    flip_commit: null
    note: >
      Slice 2-6 (the DISPLAY for the same flag) — this one IS the §4.12.4
      lighter build tier (review_rounds: 1, tier: ship_dark_build). Every new
      surface reads one branch point, holdStatusProvider, which returns
      HoldStatusData.empty whenever the flag is OFF; the flag-OFF group in
      test/contracts/hold_display_read_path_test.dart is the byte-identical
      evidence. Blast-radius verified `account` via scripts/blast_radius_from_diff.dart.
      SAME flag as the row above — flipping it on must clear BOTH entries in
      the one flip-on commit, which needs the full ×2 + bpass: accepted.

resolved: []
