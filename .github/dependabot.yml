# Dependabot config — tech-debt audit 2026-05-20 finding D10
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Cadence: weekly (Mondays), to keep transitive bumps from accreting like
# the 32 stale lock-file entries surfaced in the 2026-05-20 audit (D15).
#
# Ignored: flutter SDK pin in pubspec.yaml — controlled deliberately in
# CLAUDE.md §0 + build pipeline. Dependabot must not touch it.

version: 2
updates:
  # Flutter / Dart packages (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "tech-debt-audit"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # Flutter SDK constraint is pinned manually
      - dependency-name: "flutter"
      # share_plus blocked on health → device_info_plus → win32 chain
      # See project_share_plus_13_blocked.md
      - dependency-name: "share_plus"
      # analyzer major upgrades blocked on riverpod_generator
      - dependency-name: "analyzer"

  # GitHub Actions workflow files.
  #
  # ⚠️ These PRs need a plan-review record to merge, and that is DELIBERATE.
  # The only workflow file is .github/workflows/test.yml, promoted to `platform`
  # tier on 2026-07-26, and the Dependabot exemption in
  # scripts/check_plan_review_record_exists.dart covers ONLY pubspec.yaml /
  # pubspec.lock — never .github/workflows/**. A bot must not rewrite the CI
  # that enforces every other gate: `actions/checkout` is what supplies
  # `fetch-depth: 0` to the keystone gate's own job, so a bump there can silently
  # change whether the gate can see HEAD^2 at all.
  #
  # To land one: write docs/plan-reviews/dependabot-github_actions-<pkg>-<ver>.md
  # (the branch name with `/` mapped to `-`) with a real review, exactly as for
  # human work. Merging without one turns main red — which is the intended
  # signal, not a malfunction. `pub` bumps above are exempt and merge freely.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
